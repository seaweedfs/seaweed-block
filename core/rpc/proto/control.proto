// Master-volume control-plane RPC for the block system.
//
// Direction:
//   volume -> master:   ObservationService.ReportHeartbeat (unary)
//   volume -> master:   AssignmentService.SubscribeAssignments (server-streaming)
//   operator -> master: EvidenceService.QueryVolumeStatus (unary, read-only)
//   operator/dashboard -> master: ClusterEvidenceService read-only observation
//   CSI/operator -> master: LifecycleService.CreateVolume/DeleteVolume (desired intent only)
//
// Boundary (T0 sketch §3 load-bearing):
//   - no message carries an AssignmentAsk
//   - no message field maps to Epoch / EndpointVersion as an INPUT from the volume side
//   - Epoch / EndpointVersion appear only INSIDE AssignmentFact, which is master-minted and
//     consumed by the volume read-only
//   - AssignmentFact has NO Intent field; Intent lives on AssignmentAsk, internal to the
//     authority package, and never crosses the wire
syntax = "proto3";

package seaweedfs.block.control;

option go_package = "github.com/seaweedfs/seaweed-block/core/rpc/control;control";

import "google/protobuf/timestamp.proto";

// ObservationService — volume reports local facts to master.
service ObservationService {
    // Periodic unary heartbeat. Master validates, converts to
    // authority.HeartbeatMessage, calls ObservationHost.Ingest.
    // Ack is diagnostic only.
    rpc ReportHeartbeat(HeartbeatReport) returns (HeartbeatAck);

    // A replica's answer to the master's promotion probe round (see
    // ProbeRound). Only an answer carrying the round id the master minted for
    // this decision counts; nothing else a replica says is promotion
    // evidence. Under mutual TLS the caller's node id must be server_id.
    rpc AnswerProbe(ProbeAnswer) returns (ProbeAck);

    // Node/CSI observation event. This appends an operator timeline event only;
    // it MUST NOT mutate lifecycle, authority, placement, Kubernetes, or
    // replica state.
    rpc ReportClusterEvent(ClusterEvent) returns (ClusterEventAck);
}

// AssignmentService — master publishes minted AssignmentInfo to
// subscribing volume processes. Delivery is VOLUME-SCOPED: every
// stream carries the current authority line for the requested
// volume regardless of which replica that line targets.
// replica_id on the request identifies the CALLER (for its own
// self-filter / demotion detection), not the subscription key.
//
// Rationale (round-4 architect high fix): per-(vol, rid)
// subscriptions let a superseded replica keep seeing its own
// old line and never learn that the volume's authority has
// moved to another replica. Volume-scoped fan-in plus a
// self-replica-id filter in the volume host makes
// "you've been superseded" observable without a separate
// demotion message type.
service AssignmentService {
    // Server-streaming. Master sends the current volume
    // authority line on subscribe (catch-up) and every mint
    // thereafter. Current-line replay on fresh subscribe is
    // permitted (T0 sketch §8.2.1 test 3); per-(Epoch,
    // EndpointVersion) dedupe inside the master ensures the
    // client never sees the same line twice or in reverse
    // order, while RefreshEndpoint (same Epoch, higher
    // EndpointVersion) still flows through.
    rpc SubscribeAssignments(SubscribeRequest) returns (stream AssignmentFact);

    // Server-streaming. The master sends a ProbeRound for a volume whose
    // replica runs on this node when it decides a promotion; the node
    // answers each by AnswerProbe. A round carries no authority. Under
    // mutual TLS the caller's node id must be server_id.
    rpc SubscribeProbeRounds(ProbeRoundSubscription) returns (stream ProbeRound);
}

// EvidenceService — operator read-only projection + evidence.
service EvidenceService {
    rpc QueryVolumeStatus(StatusRequest) returns (StatusResponse);
}

// ClusterEvidenceService — dashboard-grade read-only observation surface.
// This service exposes the same evidence model as `sw-block ops ...` and
// MUST NOT mutate lifecycle, authority, placement, Kubernetes, or replica
// state.
service ClusterEvidenceService {
    rpc GetClusterStatus(GetClusterStatusRequest) returns (ClusterStatusResponse);
    rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
    rpc GetVolumeStatus(GetVolumeStatusRequest) returns (VolumeEvidence);
    rpc GetVolumeTimeline(GetVolumeTimelineRequest) returns (VolumeTimelineResponse);
    rpc WatchClusterEvents(WatchClusterEventsRequest) returns (stream ClusterEvent);
}

// LifecycleService — product lifecycle intent. This surface is for CSI /
// operators to record desired volume state. It MUST NOT carry assignment,
// epoch, endpoint_version, readiness, or primary facts.
service LifecycleService {
    rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
    // Resolve the durable volume identity without creating or changing it.
    rpc GetVolume(GetLifecycleVolumeRequest) returns (CreateVolumeResponse);
    rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
    // MarkVolumeDeleting admits a chunk volume delete: under the same locks
    // as every assignment, placement and binding write it refuses
    // (FAILED_PRECONDITION) a volume with live or pending authority, and
    // otherwise records the delete's token in a durable deletion
    // reservation, independent of the volume record. While reserved, no
    // new assignment, placement or binding is admitted and the id is not
    // created again. AbortVolumeDeleting gives a token back (the
    // reservation goes with its last token); CommitVolumeDeleting makes it
    // permanent (never given back).
    rpc MarkVolumeDeleting(MarkVolumeDeletingRequest) returns (MarkVolumeDeletingResponse);
    rpc AbortVolumeDeleting(MarkVolumeDeletingRequest) returns (MarkVolumeDeletingResponse);
    rpc CommitVolumeDeleting(MarkVolumeDeletingRequest) returns (MarkVolumeDeletingResponse);
    // ReserveVolumeDeletion is the layout volume delete's reservation: it
    // commits the delete reservation under the token and stops every later
    // grant for the volume, refused while an authority line is live. A
    // committed reservation is never given back.
    rpc ReserveVolumeDeletion(MarkVolumeDeletingRequest) returns (MarkVolumeDeletingResponse);
    // CheckVolumeNoLiveLease is the layout volume delete's check between its
    // HEAD read and its update: OK only with the committed reservation and
    // no live lease on any line of the volume (granted lines included).
    rpc CheckVolumeNoLiveLease(MarkVolumeDeletingRequest) returns (MarkVolumeDeletingResponse);
}

// FailbackService — disabled-by-default authority failback endpoint.
// This is the only wire surface that may request returned-replica authority
// reassignment, and it must be explicitly enabled in blockmaster config. The
// request carries expected-current guards and terminal evidence; master still
// authors epoch/endpoint_version internally through Publisher.
service FailbackService {
    rpc ExecuteFailback(FailbackRequest) returns (FailbackResponse);
}

// HeartbeatReport — volume -> master observation fact. Field set
// field-compatible with authority.HeartbeatMessage (P14 S4 wire).
// No authority-mutation fields of any kind.
message HeartbeatReport {
    string server_id = 1;
    google.protobuf.Timestamp sent_at = 2;
    bool reachable = 3;
    bool eligible = 4;
    repeated HeartbeatSlot slots = 5;
    // machine_id and durable_root_dev identify the file system of the
    // reporting process's durable root (the machine's /etc/machine-id and
    // the root's st_dev). Raw observation facts: the master compares them
    // with its own authority store to detect a shared file system (one
    // journal). Empty / 0 means unknown and is never compared.
    string machine_id = 6;
    uint64 durable_root_dev = 7;
    // durable_root_fsid is the durable root's statfs f_fsid (high word
    // first). 0 means unknown (older reporters, platforms without statfs):
    // the master then compares machine_id and durable_root_dev only.
    uint64 durable_root_fsid = 8;
    // store_attestation is sent by a volume's primary only: the stores of
    // the replicas that count toward its write ACKs. The master takes it as
    // the reference a promotion's probed store must match, and only from
    // the server that holds the volume's current primary line at that
    // epoch. A replica's own report of its store never sets it.
    StoreAttestation store_attestation = 9;
}

// StoreAttestation is a primary's attestation of its write-ACK set at one
// epoch: every replica in it with the store id (the store's superblock
// UUID) of the store that answered its barriers, the primary's own store
// included. A replica absent from it is not a survivor on this primary's
// word.
message StoreAttestation {
    string volume_id = 1;
    string replica_id = 2; // the primary's own replica id
    uint64 epoch = 3;      // the primary line's epoch
    repeated AttestedStore stores = 4;
}

message AttestedStore {
    string replica_id = 1;
    bytes store_id = 2; // 16 bytes
}

// HeartbeatSlot — per-replica slot fact. local_role_claim is the
// V2-shaped "I think I am Primary/Candidate" flag, carried RAW;
// the observation layer may treat conflicting-primary as
// ReasonConflictingPrimaryClaim but NEVER treats it as authority.
message HeartbeatSlot {
    string volume_id = 1;
    string replica_id = 2;
    string data_addr = 3;
    string ctrl_addr = 4;
    bool reachable = 5;
    bool ready_for_primary = 6;
    bool eligible = 7;
    bool withdrawn = 8;
    uint64 evidence_score = 9;
    uint32 local_role_claim = 10; // authority.LocalRoleClaim enum value
    repeated FrontendTarget frontends = 11;
    // incarnation identifies the reporting volume process; it is new on
    // every process start. Raw observation fact: the controller uses it
    // only to bound a restarted primary's boot grace.
    string incarnation = 12;
    // unhealthy_reason is an explicit unhealthy report for this slot
    // (#128 rule 6): recovery_timeout when a primary-assigned replica did
    // not become promotion-ready within its recover timeout, or
    // role_admission_failed for the G1 latch. Set together with
    // eligible=false; empty when healthy.
    string unhealthy_reason = 13;
}

// FrontendTarget — read-only frontend publication fact reported by
// a blockvolume process. This is an observation/status fact only:
// CSI may consume it to publish an already-running target, but
// master/authority MUST NOT treat it as an assignment, readiness, or
// placement input.
message FrontendTarget {
    string protocol = 1; // "iscsi" | "nvme"
    string addr = 2;
    string iqn = 3;
    string nqn = 4;
    uint32 lun = 5;
    uint32 nsid = 6;
    string transport = 7; // NVMe: "tcp" (default) | "rdma"; empty for iSCSI
    // the replica this frontend belongs to (StatusResponse): a CSI client publishes a target only when the primary
    // replica has a usable frontend; another replica's frontend is at most an extra path to the same target
    // (INV-AUTH-HOLDER-IDENTITY-001)
    string replica_id = 8;
}

message HeartbeatAck {
    google.protobuf.Timestamp accepted_at = 1;
    uint64 sequence = 2;
}

message ClusterEventAck {
    google.protobuf.Timestamp accepted_at = 1;
    string event_id = 2;
}

message SubscribeRequest {
    string volume_id = 1;
    string replica_id = 2;
    uint64 resume_epoch = 3; // delivery hint only; does NOT influence authority
    // the subscriber's --server-id: for a workspace volume the master delivers the line only to a registered server
    // id whose stream comes from its registered host (INV-AUTH-HOLDER-IDENTITY-001)
    string server_id = 4;
}

// ReplicaDescriptor — one entry in an AssignmentFact.peers list.
// Carries the authoritative lineage + addressing for a single peer
// replica. Used by primary to configure its replication fan-out
// (see ReplicationVolume.UpdateReplicaSet). Master-minted; hosts
// MUST NOT construct or accumulate these from local observations
// (option R rejected in v3-phase-15-t4a-5-0-host-callback-discovery.md
// §9.5).
message ReplicaDescriptor {
    string replica_id = 1;
    uint64 epoch = 2;
    uint64 endpoint_version = 3;
    string data_addr = 4;
    string ctrl_addr = 5;
    // store_id is the replica's store the master recorded (16 bytes; its
    // superblock UUID): the primary counts this peer's acks only while the
    // store the peer states in its replication session is this one. Empty
    // never matches.
    bytes store_id = 6;
}

// AssignmentFact — master-minted AssignmentInfo fact carried to a
// subscribed volume. Identity fields (1-6) mirror
// adapter.AssignmentInfo and MUST be decoded via the sole permitted
// site core/host/volume/subscribe.go:decodeAssignmentFact (guarded
// by the TestNoOtherAssignmentInfoConstruction AST fence).
//
// Peer-set fields (7-8) are consumed via a separate host-only
// decoder decodeReplicaTargets in the same file — they do NOT
// transit through AssignmentInfo or the adapter/engine layers
// (guardrail #2 of T4a-5.0 decision). This keeps the narrow
// identity-truth seam untouched while unlocking the primary-side
// replication fan-out that ReplicationVolume.UpdateReplicaSet needs.
message AssignmentFact {
    string volume_id = 1;
    string replica_id = 2;
    uint64 epoch = 3;
    uint64 endpoint_version = 4;
    string data_addr = 5;
    string ctrl_addr = 6;

    // peers — full authoritative peer set for this volume's current
    // line. MAY be empty (legal: standalone / RF=1 / pre-peer
    // bootstrap / operator-drained maintenance). self-replica is
    // implicitly excluded from peers (the primary does not ship to
    // itself).
    repeated ReplicaDescriptor peers = 7;

    // peer_set_generation — monotonic per-volume counter minted by
    // master. Production master MUST emit peer_set_generation >= 1.
    // ReplicationVolume.UpdateReplicaSet uses this for stale-replay
    // protection; fake-master / test harnesses MAY use 0 for
    // unversioned apply (does not advance the monotonic guard).
    uint64 peer_set_generation = 8;

    // Required holder identity. Empty (pre-release master) is never adopted.
    string server_id = 9;

    // primary_kind says how this line made its primary the primary. The
    // target checks it before adopting the role: a PROMOTION carries the
    // evidence the master probed on the target (its durable LSN and its
    // epoch-table row at that LSN), and the target adopts only if its own
    // store still shows it. UNSPECIFIED (a pre-release master) is never
    // adopted by a replicated volume's target that holds data at an epoch it
    // has no row for.
    PrimaryKind primary_kind = 10;
    uint64 evidence_durable_lsn = 11;
    uint64 evidence_epoch = 12;
    uint64 evidence_first_lsn = 13;
    // The probed store's id (its superblock UUID, 16 bytes): the target
    // adopts a promotion only on that same store.
    bytes evidence_store_id = 14;
    // A new volume's initial replicas whose attested store the master has
    // not recorded yet (0: none awaited). While it is non-zero the primary
    // serves no frontend I/O: its peers' acks cannot count yet.
    uint32 replica_stores_awaited = 15;
    // The number of initial replicas (the N of "n of N" in its status).
    uint32 replica_stores_initial = 16;
    // The primary process this line was issued for (its reported
    // incarnation; "" = not recorded). A primary whose own incarnation is
    // another one is a restarted process: it opens no replica session on
    // this line, whose sessions belong to the dead process.
    string line_incarnation = 17;
}

// PrimaryKind is how a line made its primary the primary.
enum PrimaryKind {
    PRIMARY_KIND_UNSPECIFIED = 0;
    // The volume's first primary: the target holds no data.
    PRIMARY_KIND_BOOTSTRAP = 1;
    // A replica promoted on the master's probed evidence (automatic
    // promotion, failover, failback, a planned move).
    PRIMARY_KIND_PROMOTION = 2;
    // The operator's forced promotion: no evidence; the lost range is
    // reported and the target's epoch table restarts at this epoch.
    PRIMARY_KIND_FORCED = 3;
}

message StatusRequest {
    string volume_id = 1;
}

// StatusResponse — operator read-only view. T0 surface is intentionally
// thin: publisher's current line + controller's per-volume evidence.
// Mode / fence / probe / session facts are G3/G4+ territory.
message StatusResponse {
    string volume_id = 1;
    string replica_id = 2;
    uint64 epoch = 3;
    uint64 endpoint_version = 4;
    bool assigned = 5;
    string last_unsupported_reason = 6;
    string last_convergence_stuck_at = 7;
    repeated FrontendTarget frontends = 8;
    // unhealthy_replicas lists the volume's replicas whose fresh
    // heartbeat carries an explicit unhealthy reason (#128 rule 6).
    repeated ReplicaUnhealthy unhealthy_replicas = 9;
}

message ReplicaUnhealthy {
    string replica_id = 1;
    string reason = 2;
}

message GetClusterStatusRequest {
}

message ListVolumesRequest {
}

message GetVolumeStatusRequest {
    string volume_id = 1;
}

message GetVolumeTimelineRequest {
    string volume_id = 1;
}

message WatchClusterEventsRequest {
    string since_event_id = 1;
}

message ObservationCondition {
    string type = 1;
    string status = 2;
    string reason = 3;
    string severity = 4;
    string message = 5;
}

message ClusterStatusResponse {
    string schema_version = 1;
    google.protobuf.Timestamp captured_at = 2;
    string product_revision = 3;
    string status = 4;
    repeated NodeEvidence nodes = 5;
    repeated VolumeEvidence volumes = 6;
    repeated ObservationCondition conditions = 7;
    repeated ClusterEvent events = 8;
    repeated string non_claims = 9;
}

message NodeEvidence {
    string node_name = 1;
    string kubernetes_node = 2;
    string physical_host = 3;
    string internal_ip = 4;
    bool schedulable = 5;
    bool ready = 6;
    google.protobuf.Timestamp last_heartbeat_at = 7;
    int32 replica_count = 8;
    repeated string required_images = 9;
    repeated string missing_images = 10;
    repeated ObservationCondition conditions = 11;
    string frontend_ip = 12;
    string frontend_network_class = 13;
}

message VolumeEvidence {
    string volume_id = 1;
    string namespace = 2;
    string pvc_name = 3;
    string pv_name = 4;
    int32 replication_factor = 5;
    string ack_profile = 6;
    string claim_profile = 7;
    int32 desired_replicas = 8;
    int32 observed_replicas = 9;
    string status = 10;
    string reason = 11;
    string primary_replica = 12;
    string primary_node = 13;
    string publish_target = 14;
    uint64 epoch = 15;
    uint64 endpoint_version = 16;
    repeated ReplicaEvidence replicas = 17;
    repeated ObservationCondition conditions = 18;
    repeated string next_actions = 19;
    string support_bundle_hint = 20;
}

message ReplicaEvidence {
    string replica_id = 1;
    string server_id = 2;
    string kubernetes_node = 3;
    string physical_host = 4;
    bool observed = 5;
    string role = 6;
    string replication_role = 7;
    bool durable_latched = 8;
    bool durable_frontier_known = 9;
    uint64 durable_frontier_lsn = 10;
    bool candidate_ready = 11;
    string candidate_ready_reason = 12;
    string frontend_protocol = 13;
    string frontend_addr = 14;
    string status_addr = 15;
    bool stale_primary_fenced = 16;
    repeated ObservationCondition conditions = 17;
    string support_bundle_path = 18;
    string frontend_nqn = 19;
    uint32 frontend_nsid = 20;
    string frontend_transport = 21;
}

message ClusterEvent {
    string event_id = 1;
    google.protobuf.Timestamp event_time = 2;
    string volume_id = 3;
    string replica_id = 4;
    string node_name = 5;
    string event_type = 6;
    string severity = 7;
    string message = 8;
    string reason_code = 9;
    string old_value = 10;
    string new_value = 11;
    uint64 epoch = 12;
    uint64 endpoint_version = 13;
    string correlation_id = 14;
    string evidence_ref = 15;
}

message ListVolumesResponse {
    string schema_version = 1;
    google.protobuf.Timestamp captured_at = 2;
    repeated VolumeEvidence volumes = 3;
}

message VolumeTimelineResponse {
    string schema_version = 1;
    google.protobuf.Timestamp captured_at = 2;
    string volume_id = 3;
    repeated ClusterEvent events = 4;
}

message CreateVolumeRequest {
    string volume_id = 1;
    uint64 size_bytes = 2;
    int32 replication_factor = 3;
    string pvc_name = 4;
    string pvc_namespace = 5;
    string pv_name = 6;
    string pvc_uid = 7;
    string protocol = 8; // "iscsi" default | "nvme"
    string frontend_transport = 9; // NVMe: "tcp" default | "rdma"
    uint32 block_size = 10; // omitted: 4096, persisted on first create
    uint64 chunk_bytes = 11; // omitted: 4 MiB, persisted on first create
    string source_volume = 12; // restore only: source lifecycle name
    string source_snapshot = 13; // restore only: named source snapshot
    string create_request_id = 14; // restore retry identity, bound to name/source/snapshot
}

message CreateVolumeResponse {
    string volume_id = 1;
    uint64 size_bytes = 2;
    int32 replication_factor = 3;
    string pvc_name = 4;
    string pvc_namespace = 5;
    string pv_name = 6;
    string pvc_uid = 7;
    string protocol = 8; // "iscsi" default | "nvme"
    string frontend_transport = 9; // NVMe: "tcp" default | "rdma"
    string layout_id = 10; // master-minted, immutable 32 lower-case hex digits
    uint32 block_size = 11;
    uint64 chunk_bytes = 12;
    bool store_ready = 13; // false: created, store not ready; retry CreateVolume
}

message GetLifecycleVolumeRequest {
    string volume_id = 1; // lifecycle name
}

message DeleteVolumeRequest {
    string volume_id = 1;
}

message DeleteVolumeResponse {
}

message MarkVolumeDeletingRequest {
    string volume_id = 1;
    // token identifies one delete operation (chosen by the caller).
    string token = 2;
}

message MarkVolumeDeletingResponse {
    // known is true when the master also has a lifecycle record for the
    // volume (the reservation applies either way).
    bool known = 1;
    // state is the reservation after the call: "admitted", "committed" or
    // "" (none left).
    string state = 2;
}

message FailbackRequest {
    string volume_id = 1;
    string replica_id = 2;
    string target_data_addr = 3;
    string target_ctrl_addr = 4;
    string expected_current_replica_id = 5;
    uint64 expected_current_epoch = 6;
    bool ack_eligible = 7;
    bool frontend_fenced_before_failback = 8;
    bool durable_frontier_covered = 9;
    bool no_cross_volume_identity_change = 10;
    repeated string evidence_refs = 11;
}

message FailbackResponse {
    bool failback_started = 1;
    bool authority_epoch_advanced = 2;
    bool single_primary_after_failback = 3;
    bool publish_target_swapped_after_failback = 4;
    bool no_storage_mutation = 5;
    bool no_cross_volume_identity_change = 6;
    repeated string evidence_refs = 7;
}


// ProbeRoundSubscription opens a node's probe round stream.
message ProbeRoundSubscription {
    string server_id = 1;
}

// ProbeRound asks the node's replica of volume_id for its promotion evidence
// now. round_id is fresh per decision; an answer counts only for it.
message ProbeRound {
    string volume_id = 1;
    string replica_id = 2;
    uint64 round_id = 3;
    // A fencing round (fence_epoch > 0): a replica whose store is
    // expected_store_id makes its epoch floor fence_epoch durable FIRST, then
    // answers (its answer is the promise: it refuses frames and acks at a
    // lower epoch from then on). A replica on another store raises nothing
    // and answers its own store id. 0: a plain probe, no fence.
    uint64 fence_epoch = 4;
    bytes expected_store_id = 5;
}

// ProbeAnswer is one replica's promotion evidence for one round.
message ProbeAnswer {
    string server_id = 1;
    string volume_id = 2;
    string replica_id = 3;
    uint64 round_id = 4;
    // The store's identity (its superblock UUID); empty = none.
    bytes store_id = 5;
    // The store's durable end (R) and its epoch-table row there.
    uint64 durable_end = 6;
    uint64 last_data_epoch = 7;
    uint64 last_data_first_lsn = 8;
    bool table_present = 9;
    bool table_valid = 10;
    // The replica's role as it sees it: a replica ready to be promoted, or a
    // primary that serves.
    bool replica_ready = 11;
    bool primary_ready = 12;
    // The replica's durable epoch floor when it answered (after a fencing
    // round's raise). Above the round's fence_epoch: superseded, not counted.
    uint64 floor = 13;
    // The epoch of this replica's primary assignment that still awaits
    // replica stores (a new volume's creation wait), when that is why it does
    // not serve: primary_ready is false by design, not because it failed.
    // 0: not awaiting. It names its line, so it never excuses another.
    uint64 awaiting_replica_stores_epoch = 14;
    // The volume's own replication ACK profile (its --replication-ack, in
    // canonical form: best_effort, sync_quorum or sync_all). Empty: an
    // older volume that does not say. The promotion gate holds a volume
    // whose answers disagree with the master's profile or do not say.
    string ack_profile = 15;
}

message ProbeAck {}
