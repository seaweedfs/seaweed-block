// Master-volume control-plane RPC for the block system.
//
// Direction:
//   volume -> master:   ObservationService.ReportHeartbeat (unary)
//   volume -> master:   AssignmentService.SubscribeAssignments (server-streaming)
//   operator -> master: EvidenceService.QueryVolumeStatus (unary, read-only)
//   operator/dashboard -> master: ClusterEvidenceService read-only observation
//   CSI/operator -> master: LifecycleService.CreateVolume/DeleteVolume (desired intent only)
//   CSI/snapshot client -> master dedicated mTLS listener: SnapshotService catalog operations
//
// Boundary (T0 sketch §3 load-bearing):
//   - no message carries an AssignmentAsk
//   - no message field maps to Epoch / EndpointVersion as an INPUT from the volume side
//   - Epoch / EndpointVersion appear only INSIDE AssignmentFact, which is master-minted and
//     consumed by the volume read-only
//   - AssignmentFact has NO Intent field; Intent lives on AssignmentAsk, internal to the
//     authority package, and never crosses the wire
syntax = "proto3";

package seaweedfs.block.control;

option go_package = "github.com/seaweedfs/seaweed-block/core/rpc/control;control";

import "google/protobuf/timestamp.proto";

// ObservationService — volume reports local facts to master.
service ObservationService {
    // Periodic unary heartbeat. Master validates, converts to
    // authority.HeartbeatMessage, calls ObservationHost.Ingest.
    // Ack is diagnostic only.
    rpc ReportHeartbeat(HeartbeatReport) returns (HeartbeatAck);

    // Node/CSI observation event. This appends an operator timeline event only;
    // it MUST NOT mutate lifecycle, authority, placement, Kubernetes, or
    // replica state.
    rpc ReportClusterEvent(ClusterEvent) returns (ClusterEventAck);
}

// AssignmentService — master publishes minted AssignmentInfo to
// subscribing volume processes. Delivery is VOLUME-SCOPED: every
// stream carries the current authority line for the requested
// volume regardless of which replica that line targets.
// replica_id on the request identifies the CALLER (for its own
// self-filter / demotion detection), not the subscription key.
//
// Rationale (round-4 architect high fix): per-(vol, rid)
// subscriptions let a superseded replica keep seeing its own
// old line and never learn that the volume's authority has
// moved to another replica. Volume-scoped fan-in plus a
// self-replica-id filter in the volume host makes
// "you've been superseded" observable without a separate
// demotion message type.
service AssignmentService {
    // Server-streaming. Master sends the current volume
    // authority line on subscribe (catch-up) and every mint
    // thereafter. Current-line replay on fresh subscribe is
    // permitted (T0 sketch §8.2.1 test 3); per-(Epoch,
    // EndpointVersion) dedupe inside the master ensures the
    // client never sees the same line twice or in reverse
    // order, while RefreshEndpoint (same Epoch, higher
    // EndpointVersion) still flows through.
    rpc SubscribeAssignments(SubscribeRequest) returns (stream AssignmentFact);
}

// EvidenceService — operator read-only projection + evidence.
service EvidenceService {
    rpc QueryVolumeStatus(StatusRequest) returns (StatusResponse);
}

// ClusterEvidenceService — dashboard-grade read-only observation surface.
// This service exposes the same evidence model as `sw-block ops ...` and
// MUST NOT mutate lifecycle, authority, placement, Kubernetes, or replica
// state.
service ClusterEvidenceService {
    rpc GetClusterStatus(GetClusterStatusRequest) returns (ClusterStatusResponse);
    rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
    rpc GetVolumeStatus(GetVolumeStatusRequest) returns (VolumeEvidence);
    rpc GetVolumeTimeline(GetVolumeTimelineRequest) returns (VolumeTimelineResponse);
    rpc WatchClusterEvents(WatchClusterEventsRequest) returns (stream ClusterEvent);
}

// LifecycleService — product lifecycle intent. This surface is for CSI /
// operators to record desired volume state. It MUST NOT carry assignment,
// epoch, endpoint_version, readiness, or primary facts.
service LifecycleService {
    rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
    rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
}

// FailbackService — disabled-by-default authority failback endpoint.
// This is the only wire surface that may request returned-replica authority
// reassignment, and it must be explicitly enabled in blockmaster config. The
// request carries expected-current guards and terminal evidence; master still
// authors epoch/endpoint_version internally through Publisher.
service FailbackService {
    rpc ExecuteFailback(FailbackRequest) returns (FailbackResponse);
}

// HeartbeatReport — volume -> master observation fact. Field set
// field-compatible with authority.HeartbeatMessage (P14 S4 wire).
// No authority-mutation fields of any kind.
message HeartbeatReport {
    string server_id = 1;
    google.protobuf.Timestamp sent_at = 2;
    bool reachable = 3;
    bool eligible = 4;
    repeated HeartbeatSlot slots = 5;
}

// HeartbeatSlot — per-replica slot fact. local_role_claim is the
// V2-shaped "I think I am Primary/Candidate" flag, carried RAW;
// the observation layer may treat conflicting-primary as
// ReasonConflictingPrimaryClaim but NEVER treats it as authority.
message HeartbeatSlot {
    string volume_id = 1;
    string replica_id = 2;
    string data_addr = 3;
    string ctrl_addr = 4;
    bool reachable = 5;
    bool ready_for_primary = 6;
    bool eligible = 7;
    bool withdrawn = 8;
    uint64 evidence_score = 9;
    uint32 local_role_claim = 10; // authority.LocalRoleClaim enum value
    repeated FrontendTarget frontends = 11;
    string snapshot_runtime_endpoint = 12; // authenticated HTTPS capture endpoint; observation only
}

// SnapshotService owns crash-consistent, immutable single-volume snapshots.
// It is registered only on blockmaster's dedicated mTLS listener and also
// requires a file-backed API bearer token; it is absent from the shared
// plaintext control listener.
// Create captures only the positively ready current primary. Restore and CSI
// orchestration are separate layers and are not implied by this service.
service SnapshotService {
    rpc CreateSnapshot(CreateSnapshotRequest) returns (SnapshotRecord);
    rpc GetSnapshot(GetSnapshotRequest) returns (SnapshotRecord);
    rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
    rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
    rpc RestoreSnapshot(RestoreSnapshotRequest) returns (RestoreSnapshotResponse);
}

// FrontendTarget — read-only frontend publication fact reported by
// a blockvolume process. This is an observation/status fact only:
// CSI may consume it to publish an already-running target, but
// master/authority MUST NOT treat it as an assignment, readiness, or
// placement input.
message FrontendTarget {
    string protocol = 1; // "iscsi" | "nvme"
    string addr = 2;
    string iqn = 3;
    string nqn = 4;
    uint32 lun = 5;
    uint32 nsid = 6;
    string transport = 7; // NVMe: "tcp" (default) | "rdma"; empty for iSCSI
}

message HeartbeatAck {
    google.protobuf.Timestamp accepted_at = 1;
    uint64 sequence = 2;
}

message ClusterEventAck {
    google.protobuf.Timestamp accepted_at = 1;
    string event_id = 2;
}

message SubscribeRequest {
    string volume_id = 1;
    string replica_id = 2;
    uint64 resume_epoch = 3; // delivery hint only; does NOT influence authority
}

// ReplicaDescriptor — one entry in an AssignmentFact.peers list.
// Carries the authoritative lineage + addressing for a single peer
// replica. Used by primary to configure its replication fan-out
// (see ReplicationVolume.UpdateReplicaSet). Master-minted; hosts
// MUST NOT construct or accumulate these from local observations
// (option R rejected in v3-phase-15-t4a-5-0-host-callback-discovery.md
// §9.5).
message ReplicaDescriptor {
    string replica_id = 1;
    uint64 epoch = 2;
    uint64 endpoint_version = 3;
    string data_addr = 4;
    string ctrl_addr = 5;
}

// AssignmentFact — master-minted AssignmentInfo fact carried to a
// subscribed volume. Identity fields (1-6) mirror
// adapter.AssignmentInfo and MUST be decoded via the sole permitted
// site core/host/volume/subscribe.go:decodeAssignmentFact (guarded
// by the TestNoOtherAssignmentInfoConstruction AST fence).
//
// Peer-set fields (7-8) are consumed via a separate host-only
// decoder decodeReplicaTargets in the same file — they do NOT
// transit through AssignmentInfo or the adapter/engine layers
// (guardrail #2 of T4a-5.0 decision). This keeps the narrow
// identity-truth seam untouched while unlocking the primary-side
// replication fan-out that ReplicationVolume.UpdateReplicaSet needs.
message AssignmentFact {
    string volume_id = 1;
    string replica_id = 2;
    uint64 epoch = 3;
    uint64 endpoint_version = 4;
    string data_addr = 5;
    string ctrl_addr = 6;

    // peers — full authoritative peer set for this volume's current
    // line. MAY be empty (legal: standalone / RF=1 / pre-peer
    // bootstrap / operator-drained maintenance). self-replica is
    // implicitly excluded from peers (the primary does not ship to
    // itself).
    repeated ReplicaDescriptor peers = 7;

    // peer_set_generation — monotonic per-volume counter minted by
    // master. Production master MUST emit peer_set_generation >= 1.
    // ReplicationVolume.UpdateReplicaSet uses this for stale-replay
    // protection; fake-master / test harnesses MAY use 0 for
    // unversioned apply (does not advance the monotonic guard).
    uint64 peer_set_generation = 8;
}

message StatusRequest {
    string volume_id = 1;
}

// StatusResponse — operator read-only view. T0 surface is intentionally
// thin: publisher's current line + controller's per-volume evidence.
// Mode / fence / probe / session facts are G3/G4+ territory.
message StatusResponse {
    string volume_id = 1;
    string replica_id = 2;
    uint64 epoch = 3;
    uint64 endpoint_version = 4;
    bool assigned = 5;
    string last_unsupported_reason = 6;
    string last_convergence_stuck_at = 7;
    repeated FrontendTarget frontends = 8;
}

message GetClusterStatusRequest {
}

message ListVolumesRequest {
}

message GetVolumeStatusRequest {
    string volume_id = 1;
}

message GetVolumeTimelineRequest {
    string volume_id = 1;
}

message WatchClusterEventsRequest {
    string since_event_id = 1;
}

message ObservationCondition {
    string type = 1;
    string status = 2;
    string reason = 3;
    string severity = 4;
    string message = 5;
}

message ClusterStatusResponse {
    string schema_version = 1;
    google.protobuf.Timestamp captured_at = 2;
    string product_revision = 3;
    string status = 4;
    repeated NodeEvidence nodes = 5;
    repeated VolumeEvidence volumes = 6;
    repeated ObservationCondition conditions = 7;
    repeated ClusterEvent events = 8;
    repeated string non_claims = 9;
}

message NodeEvidence {
    string node_name = 1;
    string kubernetes_node = 2;
    string physical_host = 3;
    string internal_ip = 4;
    bool schedulable = 5;
    bool ready = 6;
    google.protobuf.Timestamp last_heartbeat_at = 7;
    int32 replica_count = 8;
    repeated string required_images = 9;
    repeated string missing_images = 10;
    repeated ObservationCondition conditions = 11;
    string frontend_ip = 12;
    string frontend_network_class = 13;
}

message VolumeEvidence {
    string volume_id = 1;
    string namespace = 2;
    string pvc_name = 3;
    string pv_name = 4;
    int32 replication_factor = 5;
    string ack_profile = 6;
    string claim_profile = 7;
    int32 desired_replicas = 8;
    int32 observed_replicas = 9;
    string status = 10;
    string reason = 11;
    string primary_replica = 12;
    string primary_node = 13;
    string publish_target = 14;
    uint64 epoch = 15;
    uint64 endpoint_version = 16;
    repeated ReplicaEvidence replicas = 17;
    repeated ObservationCondition conditions = 18;
    repeated string next_actions = 19;
    string support_bundle_hint = 20;
}

message ReplicaEvidence {
    string replica_id = 1;
    string server_id = 2;
    string kubernetes_node = 3;
    string physical_host = 4;
    bool observed = 5;
    string role = 6;
    string replication_role = 7;
    bool durable_latched = 8;
    bool durable_frontier_known = 9;
    uint64 durable_frontier_lsn = 10;
    bool candidate_ready = 11;
    string candidate_ready_reason = 12;
    string frontend_protocol = 13;
    string frontend_addr = 14;
    string status_addr = 15;
    bool stale_primary_fenced = 16;
    repeated ObservationCondition conditions = 17;
    string support_bundle_path = 18;
    string frontend_nqn = 19;
    uint32 frontend_nsid = 20;
    string frontend_transport = 21;
}

message ClusterEvent {
    string event_id = 1;
    google.protobuf.Timestamp event_time = 2;
    string volume_id = 3;
    string replica_id = 4;
    string node_name = 5;
    string event_type = 6;
    string severity = 7;
    string message = 8;
    string reason_code = 9;
    string old_value = 10;
    string new_value = 11;
    uint64 epoch = 12;
    uint64 endpoint_version = 13;
    string correlation_id = 14;
    string evidence_ref = 15;
}

message ListVolumesResponse {
    string schema_version = 1;
    google.protobuf.Timestamp captured_at = 2;
    repeated VolumeEvidence volumes = 3;
}

message VolumeTimelineResponse {
    string schema_version = 1;
    google.protobuf.Timestamp captured_at = 2;
    string volume_id = 3;
    repeated ClusterEvent events = 4;
}

message CreateVolumeRequest {
    string volume_id = 1;
    uint64 size_bytes = 2;
    int32 replication_factor = 3;
    string pvc_name = 4;
    string pvc_namespace = 5;
    string pv_name = 6;
    string pvc_uid = 7;
    string protocol = 8; // "iscsi" default | "nvme"
    string frontend_transport = 9; // NVMe: "tcp" default | "rdma"
    string source_snapshot_id = 10; // immutable snapshot restored before the new volume becomes ready
}

message CreateVolumeResponse {
    string volume_id = 1;
    uint64 size_bytes = 2;
    int32 replication_factor = 3;
    string pvc_name = 4;
    string pvc_namespace = 5;
    string pv_name = 6;
    string pvc_uid = 7;
    string protocol = 8; // "iscsi" default | "nvme"
    string frontend_transport = 9; // NVMe: "tcp" default | "rdma"
    string source_snapshot_id = 10;
}

message DeleteVolumeRequest {
    string volume_id = 1;
}

message DeleteVolumeResponse {
}

message CreateSnapshotRequest {
    string name = 1;
    string source_volume_id = 2;
}

message GetSnapshotRequest {
    string snapshot_id = 1;
}

message ListSnapshotsRequest {
    string source_volume_id = 1;
}

message ListSnapshotsResponse {
    repeated SnapshotRecord snapshots = 1;
}

message DeleteSnapshotRequest {
    string snapshot_id = 1;
}

message DeleteSnapshotResponse {
}

message RestoreSnapshotRequest {
    string snapshot_id = 1;
    string target_volume_id = 2;
}

message RestoreSnapshotResponse {
    string snapshot_id = 1;
    string target_volume_id = 2;
    uint32 replica_count = 3;
    bool already_complete = 4;
}

message SnapshotRecord {
    string snapshot_id = 1;
    string name = 2;
    string source_volume_id = 3;
    google.protobuf.Timestamp created_at = 4;
    string state = 5;
    uint64 frontier = 6;
    uint64 size_bytes = 7;
    uint32 num_blocks = 8;
    uint32 block_size = 9;
    uint64 record_count = 10;
    uint64 data_bytes = 11;
    int64 archive_bytes = 12;
    string archive_sha256 = 13;
}

message FailbackRequest {
    string volume_id = 1;
    string replica_id = 2;
    string target_data_addr = 3;
    string target_ctrl_addr = 4;
    string expected_current_replica_id = 5;
    uint64 expected_current_epoch = 6;
    bool ack_eligible = 7;
    bool frontend_fenced_before_failback = 8;
    bool durable_frontier_covered = 9;
    bool no_cross_volume_identity_change = 10;
    repeated string evidence_refs = 11;
}

message FailbackResponse {
    bool failback_started = 1;
    bool authority_epoch_advanced = 2;
    bool single_primary_after_failback = 3;
    bool publish_target_swapped_after_failback = 4;
    bool no_storage_mutation = 5;
    bool no_cross_volume_identity_change = 6;
    repeated string evidence_refs = 7;
}
