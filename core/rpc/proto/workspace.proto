syntax = "proto3";
package seaweedfs.block.control;
option go_package = "github.com/seaweedfs/seaweed-block/core/rpc/control;control";

// Opt-in RF=1 workspace authority protocol. Epochs are minted only by Publisher.
service WorkspaceService {
  // Register a caller-allocated per-volume pair before placement or move.
  rpc RegisterWorkspaceBinding(WorkspaceBinding) returns (WorkspaceBinding);
  // Desired chosen-node intent only; this never directly mints authority.
  rpc PlaceWorkspace(WorkspacePlacement) returns (WorkspaceEmpty);
  rpc RenewWorkspaceLease(WorkspaceIdentity) returns (WorkspaceLeaseFact);
  rpc RevokeWorkspace(WorkspaceIdentity) returns (WorkspaceLeaseFact);
  rpc AckWorkspaceRevoked(WorkspaceRevocationAck) returns (WorkspaceEmpty);
  rpc MoveWorkspace(WorkspaceMove) returns (WorkspaceGrant);
  rpc QueryWorkspace(WorkspaceVolume) returns (WorkspaceStatus);
  // The stored lost ranges of the volume's issued forced moves, in issue
  // order (or the one of request_id); never recomputed. A forced move whose
  // range is missing or unreadable fails with DATA_LOSS, never "no loss".
  rpc QueryWorkspaceLostRange(WorkspaceLostRangeQuery) returns (WorkspaceLostRanges);
  // Read-only forced-move admission check (no reservation, no journal
  // write): advisory, re-checked by MoveWorkspace.
  rpc PreviewWorkspaceMove(WorkspaceMove) returns (WorkspaceMovePreview);
}
message WorkspaceIdentity { string volume_id = 1; string replica_id = 2; uint64 epoch = 3; }
message WorkspaceVolume { string volume_id = 1; }
message WorkspaceEmpty {}
message WorkspaceLeaseFact {
  string volume_id = 1; string replica_id = 2; uint64 epoch = 3;
  int64 expires_at_ns = 4; int64 valid_for_ns = 5; bool revoking = 6;
}
message WorkspaceRevocationAck { WorkspaceIdentity identity = 1; uint64 head_gen = 2; }
message WorkspaceMove {
  string request_id = 1; string volume_id = 2;
  string expected_replica_id = 3; uint64 expected_epoch = 4;
  string target_replica_id = 5; string target_data_addr = 6; string target_ctrl_addr = 7;
  string kind = 8; bool force = 9;
  string target_server_id = 10;
}
message WorkspaceGrant {
  string request_id = 1; string volume_id = 2; string old_replica_id = 3; string new_replica_id = 4;
  string kind = 5; uint64 old_epoch = 6; uint64 new_epoch = 7;
  uint64 head_gen = 8; uint64 remote_lsn = 9; bool issued = 10;
  string old_host = 11; string new_host = 12;
  // Forced grants only: the lost range stored before the issue (also on a
  // replay). Absent on a forced grant means the readout is not proven, and
  // lost_range_error says why; it never means "no loss".
  WorkspaceLostRange lost_range = 13;
  string lost_range_error = 14;
}
// What a forced move abandoned. head_gen 0: no published HEAD (everything the
// old holder wrote is lost). head_time_ns is the HEAD entry's filer mtime read
// with HEAD at the move (1 s resolution), valid only when head_time_known.
// lost_until_ns is master time; the upper bound is a time, not an LSN.
message WorkspaceLostRange {
  string request_id = 1; string volume_id = 2; uint64 new_epoch = 3;
  string old_replica_id = 4; uint64 old_epoch = 5;
  uint64 lost_after_lsn = 6; int64 lost_until_ns = 7;
  uint64 head_gen = 8; int64 head_time_ns = 9; bool head_time_known = 10;
}
message WorkspaceLostRangeQuery { string volume_id = 1; string request_id = 2; }
message WorkspaceLostRanges { repeated WorkspaceLostRange ranges = 1; }
// lost_until_ns is when a forced move becomes admissible (0 if the master has
// no lease to judge). HEAD is read only when admitted, as for the move.
message WorkspaceMovePreview {
  bool admitted = 1; string reason = 2;
  int64 lost_until_ns = 3; int64 master_time_ns = 4;
  bool head_read = 5; string head_error = 6;
  uint64 head_gen = 7; uint64 head_epoch = 8; string head_holder = 9; uint64 head_remote_lsn = 10;
  int64 head_time_ns = 11; bool head_time_known = 12;
}
message WorkspaceStatus {
  WorkspaceLeaseFact lease = 1; WorkspaceRevocationAck revocation_ack = 2;
  repeated WorkspaceGrant moves = 3;
  repeated WorkspaceBinding bindings = 4;
}
message WorkspaceBinding {
  string volume_id = 1; string server_id = 2;
  string data_addr = 3; string ctrl_addr = 4;
  bool retired = 5; // server output only
}
message WorkspacePlacement {
  string volume_id = 1; string server_id = 2; string replica_id = 3;
}
