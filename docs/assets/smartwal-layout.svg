<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>smartwal (experimental) layout: data written in place in the extent, plus a ring of 32-byte metadata records indexed by LSN modulo capacity</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="18" fill="#f8fafc"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">smartwal · in-place data plus a metadata record ring</text>
  <rect x="790" y="30" width="140" height="28" rx="14" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="860" y="49" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">EXPERIMENTAL</text>
  <text x="40" y="80" font-size="15" fill="#475569">Not a default and no chunk snapshots · core/storage/smartwal/store.go (Store), record.go, ring.go, recovery.go</text>

  <!-- file regions -->
  <text x="40" y="122" font-size="14" font-weight="700" fill="#0f172a">File regions (not to scale)</text>
  <rect x="40" y="134" width="170" height="74" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="125" y="164" font-size="14" font-weight="600" fill="#312e81" text-anchor="middle">header</text>
  <text x="125" y="184" font-size="12" fill="#4338ca" text-anchor="middle">4 KiB · offset 0</text>
  <rect x="214" y="134" width="360" height="74" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="394" y="164" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">record ring</text>
  <text x="394" y="184" font-size="12" fill="#b45309" text-anchor="middle">slots × 32 bytes (65,536 slots = 2 MiB default)</text>
  <rect x="578" y="134" width="582" height="74" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="869" y="164" font-size="14" font-weight="600" fill="#065f46" text-anchor="middle">extent: the data, written in place</text>
  <text x="869" y="184" font-size="12" fill="#047857" text-anchor="middle">numBlocks × BlockSize · reads always come from here</text>

  <!-- record byte map: 30 px per byte, x0 = 120 -->
  <rect x="40" y="232" width="1120" height="170" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="260" font-size="15" font-weight="700" fill="#0f172a">One ring slot: a 32-byte record (record.go encode)</text>
  <rect x="120" y="280" width="30" height="44" fill="#eef2ff" stroke="#6366f1"/>
  <rect x="150" y="280" width="30" height="44" fill="#eef2ff" stroke="#6366f1"/>
  <rect x="180" y="280" width="60" height="44" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="240" y="280" width="120" height="44" fill="#fde68a" stroke="#f59e0b"/>
  <rect x="360" y="280" width="240" height="44" fill="#fde68a" stroke="#f59e0b"/>
  <rect x="600" y="280" width="240" height="44" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="840" y="280" width="120" height="44" fill="#d1fae5" stroke="#10b981"/>
  <rect x="960" y="280" width="120" height="44" fill="#eef2ff" stroke="#6366f1"/>
  <text x="135" y="307" font-size="10.5" fill="#312e81" text-anchor="middle">mg</text>
  <text x="165" y="307" font-size="10.5" fill="#312e81" text-anchor="middle">fl</text>
  <text x="210" y="307" font-size="10.5" fill="#64748b" text-anchor="middle">rsv</text>
  <text x="300" y="307" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">LBA u32</text>
  <text x="480" y="307" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">LSN u64</text>
  <text x="720" y="307" font-size="12" fill="#64748b" text-anchor="middle">reserved2 (zero)</text>
  <text x="900" y="307" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">dataCRC32</text>
  <text x="1020" y="307" font-size="12" font-weight="600" fill="#312e81" text-anchor="middle">recCRC32</text>
  <text x="120" y="340" font-size="11" fill="#64748b" text-anchor="middle">0</text>
  <text x="150" y="340" font-size="11" fill="#64748b" text-anchor="middle">1</text>
  <text x="180" y="340" font-size="11" fill="#64748b" text-anchor="middle">2</text>
  <text x="240" y="340" font-size="11" fill="#64748b" text-anchor="middle">4</text>
  <text x="360" y="340" font-size="11" fill="#64748b" text-anchor="middle">8</text>
  <text x="600" y="340" font-size="11" fill="#64748b" text-anchor="middle">16</text>
  <text x="840" y="340" font-size="11" fill="#64748b" text-anchor="middle">24</text>
  <text x="960" y="340" font-size="11" fill="#64748b" text-anchor="middle">28</text>
  <text x="1080" y="340" font-size="11" fill="#64748b" text-anchor="middle">32</text>
  <text x="60" y="366" font-size="12" fill="#334155">mg = magic 0xAC (anything else is an empty slot) · fl = flags (write 0x01, trim 0x02, barrier 0x04) · rsv = reserved · little-endian</text>
  <text x="60" y="386" font-size="12" fill="#334155">dataCRC32 = CRC32 of the data block in the extent · recCRC32 = CRC32 of bytes 0..27 · slot index = LSN mod capacity (ring.go appendAt)</text>

  <!-- write order -->
  <text x="40" y="440" font-size="15" font-weight="700" fill="#0f172a">Write order (Store.writeAt) and Sync</text>
  <rect x="40" y="454" width="250" height="96" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="56" y="480" font-size="13.5" font-weight="700" fill="#0f172a">1 · read the old block</text>
  <text x="56" y="502" font-size="12" fill="#334155">kept in memory for rollback</text>
  <rect x="320" y="454" width="250" height="96" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="336" y="480" font-size="13.5" font-weight="700" fill="#065f46">2 · pwrite data in place</text>
  <text x="336" y="502" font-size="12" fill="#334155">the extent slot of the LBA</text>
  <rect x="600" y="454" width="250" height="96" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="616" y="480" font-size="13.5" font-weight="700" fill="#92400e">3 · append the record</text>
  <text x="616" y="502" font-size="12" fill="#334155">slot = LSN mod capacity; on failure</text>
  <text x="616" y="520" font-size="12" fill="#334155">the old block is written back</text>
  <rect x="880" y="454" width="280" height="96" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="896" y="480" font-size="13.5" font-weight="700" fill="#312e81">4 · Sync: one fsync</text>
  <text x="896" y="502" font-size="12" fill="#334155">covers data and record together</text>
  <text x="896" y="520" font-size="12" fill="#334155">(same file)</text>
  <line x1="291" y1="502" x2="318" y2="502" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="571" y1="502" x2="598" y2="502" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="851" y1="502" x2="878" y2="502" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- crash window -->
  <path d="M585,556 L585,580" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowR)"/>
  <rect x="380" y="586" width="410" height="50" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="585" y="607" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">Known crash window between 2 and 3</text>
  <text x="585" y="625" font-size="11.5" fill="#991b1b" text-anchor="middle">extent newer than the ring: CRC check fails, volume does not open</text>

  <!-- recovery -->
  <rect x="40" y="652" width="1120" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="676" font-size="12.5" font-weight="700" fill="#0f172a">Recovery (runRecoveryCounting):</text>
  <text x="280" y="676" font-size="12.5" fill="#334155">scan every slot (a bad recCRC is skipped and counted as a warning) → highest LSN per LBA →</text>
  <text x="280" y="694" font-size="12.5" fill="#334155">check the extent block against dataCRC32; a mismatch fails closed as a WAL integrity failure → frontier = highest verified LSN</text>
</svg>
