<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Seaweed Block agent workspace disks: local-speed disk per microVM, incremental snapshots to SeaweedFS, fork and move to any host</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="18" fill="#f8fafc"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Seaweed Block · agent workspace disks</text>
  <text x="40" y="80" font-size="15" fill="#475569">Local-speed disk per agent VM · incremental snapshots to SeaweedFS · fork and resume on any host</text>

  <!-- Host A -->
  <rect x="40" y="110" width="420" height="300" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="138" font-size="15" font-weight="700" fill="#0f172a">Host A</text>

  <rect x="60" y="154" width="170" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="145" y="184" font-size="14" font-weight="600" fill="#312e81" text-anchor="middle">agent microVM</text>
  <text x="145" y="204" font-size="12" fill="#4338ca" text-anchor="middle">/dev/vda · ext4</text>

  <rect x="270" y="154" width="170" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="355" y="184" font-size="14" font-weight="600" fill="#312e81" text-anchor="middle">agent microVM</text>
  <text x="355" y="204" font-size="12" fill="#4338ca" text-anchor="middle">/dev/vda · ext4</text>

  <line x1="145" y1="226" x2="145" y2="262" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="355" y1="226" x2="355" y2="262" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="250" y="250" font-size="11.5" fill="#64748b" text-anchor="middle">virtio-blk (ublk / NVMe-TCP loopback)</text>

  <rect x="60" y="266" width="380" height="122" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="292" font-size="14" font-weight="700" fill="#0f172a">blockvolume (one per workspace)</text>
  <text x="80" y="316" font-size="12.5" fill="#334155">• fsync completes on the local WAL</text>
  <text x="80" y="338" font-size="12.5" fill="#334155">• dirty-chunk tracking since the last cut</text>
  <text x="80" y="360" font-size="12.5" fill="#334155">• single local replica; durability from snapshots</text>
  <text x="80" y="380" font-size="12.5" fill="#334155">• epoch-fenced HEAD ownership</text>

  <!-- SeaweedFS -->
  <rect x="560" y="160" width="300" height="250" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="580" y="188" font-size="15" font-weight="700" fill="#065f46">SeaweedFS</text>

  <rect x="580" y="204" width="260" height="56" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="710" y="228" font-size="13" font-weight="600" fill="#065f46" text-anchor="middle">HEAD root (~2 KB)</text>
  <text x="710" y="247" font-size="11.5" fill="#047857" text-anchor="middle">conditional update on {gen, epoch}</text>

  <rect x="580" y="272" width="260" height="56" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="710" y="296" font-size="13" font-weight="600" fill="#065f46" text-anchor="middle">snapshots · forks</text>
  <text x="710" y="315" font-size="11.5" fill="#047857" text-anchor="middle">copy the root only · chunks shared</text>

  <g>
    <rect x="584" y="342" width="36" height="24" rx="4" fill="#a7f3d0"/>
    <rect x="626" y="342" width="36" height="24" rx="4" fill="#a7f3d0"/>
    <rect x="668" y="342" width="36" height="24" rx="4" fill="#a7f3d0"/>
    <rect x="710" y="342" width="36" height="24" rx="4" fill="#6ee7b7"/>
    <rect x="752" y="342" width="36" height="24" rx="4" fill="#a7f3d0"/>
    <rect x="794" y="342" width="36" height="24" rx="4" fill="#6ee7b7"/>
  </g>
  <text x="710" y="392" font-size="11.5" fill="#047857" text-anchor="middle">immutable 4 MiB chunks · two-phase graced GC</text>

  <line x1="442" y1="300" x2="556" y2="270" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="500" y="262" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle">cut</text>
  <text x="500" y="314" font-size="11" fill="#0f766e" text-anchor="middle">changed chunks only</text>

  <!-- Host B -->
  <rect x="940" y="110" width="220" height="300" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="960" y="138" font-size="15" font-weight="700" fill="#0f172a">Any other host</text>

  <rect x="960" y="154" width="180" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1050" y="184" font-size="14" font-weight="600" fill="#312e81" text-anchor="middle">resumed / forked VM</text>
  <text x="1050" y="204" font-size="12" fill="#4338ca" text-anchor="middle">boots from HEAD</text>

  <rect x="960" y="266" width="180" height="122" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="980" y="292" font-size="13" font-weight="700" fill="#0f172a">take over</text>
  <text x="980" y="314" font-size="12" fill="#334155">• epoch + 1</text>
  <text x="980" y="334" font-size="12" fill="#334155">• fetch chunks lazily</text>
  <text x="980" y="354" font-size="12" fill="#334155">• old holder fenced:</text>
  <text x="992" y="372" font-size="12" fill="#334155">cannot publish</text>

  <line x1="862" y1="280" x2="956" y2="300" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="908" y="272" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle">resume</text>

  <!-- Footer metrics -->
  <rect x="40" y="440" width="1120" height="92" rx="14" fill="#0f172a"/>
  <text x="70" y="474" font-size="14" font-weight="700" fill="#e2e8f0">Measured on lab hosts: workloads in Firecracker microVMs; snapshot/fork in a host-side proxy (not an SLO)</text>
  <text x="70" y="502" font-size="13" fill="#cbd5e1">npm ci · git clone · untar · find+stat: same as a local disk</text>
  <text x="560" y="502" font-size="13" fill="#cbd5e1">snapshot 0.18 ms · fork 0.29 ms (10 GiB volume) · two-host lifecycle 35/35</text>
  <text x="70" y="522" font-size="12" fill="#94a3b8">fsync (ublk): 3.2 ms vs 2.7 ms local · every guest fsync reaches the backend sync</text>
</svg>
