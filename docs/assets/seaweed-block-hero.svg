<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Seaweed Block: one block service core, two uses</title>
  <desc id="desc">A shared core (blockvolume with ublk, NVMe/TCP and iSCSI frontends, one Read/Write/Sync backend contract and the walstore WAL engine, plus blockmaster as the epoch authority) serves two uses: agent microVM disks that cut changed chunks to SeaweedFS for snapshots, forks and host moves, and Kubernetes PVCs through CSI, RF=1 by default with optional RF=2 or RF=3 replication.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1200" height="500" rx="18" fill="#f8fafc"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Seaweed Block</text>
  <text x="40" y="80" font-size="15" fill="#475569">One block service core · two uses: agent workspace disks and Kubernetes block volumes</text>

  <!-- Use 1: agent workspace disks -->
  <text x="40" y="124" font-size="11.5" font-weight="700" fill="#4338ca" letter-spacing="0.06em">AGENT WORKSPACE DISKS</text>
  <text x="212" y="124" font-size="11.5" fill="#64748b">· proof of concept</text>
  <rect x="40" y="134" width="260" height="110" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="170" y="168" font-size="14" font-weight="600" fill="#312e81" text-anchor="middle">agent microVM</text>
  <text x="170" y="190" font-size="12" fill="#4338ca" text-anchor="middle">/dev/vda · ext4</text>
  <text x="170" y="212" font-size="11.5" fill="#4338ca" text-anchor="middle">one local-speed disk per sandbox</text>

  <!-- Use 2: Kubernetes block volumes -->
  <text x="40" y="312" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="0.06em">KUBERNETES BLOCK VOLUMES</text>
  <text x="238" y="312" font-size="11.5" fill="#64748b">· alpha</text>
  <rect x="40" y="322" width="260" height="108" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="170" y="356" font-size="14" font-weight="600" fill="#78350f" text-anchor="middle">app pod + PVC</text>
  <text x="170" y="378" font-size="12" fill="#92400e" text-anchor="middle">blockcsi: provision, attach, mount</text>
  <text x="170" y="400" font-size="11.5" fill="#92400e" text-anchor="middle">Helm chart · read-only status</text>

  <!-- Shared core -->
  <rect x="380" y="110" width="440" height="320" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="400" y="136" font-size="15" font-weight="700" fill="#0f172a">Shared core</text>

  <rect x="400" y="150" width="400" height="184" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="420" y="176" font-size="14" font-weight="700" fill="#0f172a">blockvolume</text>
  <text x="780" y="176" font-size="11.5" fill="#64748b" text-anchor="end">one process per volume replica</text>

  <rect x="420" y="190" width="110" height="28" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="475" y="209" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">ublk</text>
  <rect x="545" y="190" width="110" height="28" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="600" y="209" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">NVMe/TCP</text>
  <rect x="670" y="190" width="110" height="28" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="725" y="209" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">iSCSI</text>

  <text x="600" y="242" font-size="12.5" fill="#334155" text-anchor="middle">one Backend contract: Read · Write · Sync</text>

  <rect x="420" y="254" width="360" height="64" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="280" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">local WAL engine: walstore</text>
  <text x="600" y="300" font-size="11.5" fill="#475569" text-anchor="middle">WAL + extent · group fsync · typed recovery reasons</text>

  <line x1="600" y1="350" x2="600" y2="337" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="400" y="350" width="400" height="66" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="600" y="377" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">blockmaster · epoch authority</text>
  <text x="600" y="399" font-size="11.5" fill="#475569" text-anchor="middle">assignments · epochs · leases · epoch fencing</text>

  <!-- Into the core -->
  <line x1="302" y1="190" x2="396" y2="204" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="349" y="182" font-size="11" fill="#64748b" text-anchor="middle">virtio-blk</text>
  <line x1="302" y1="376" x2="396" y2="232" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="340" y="290" font-size="11" fill="#64748b" text-anchor="end">iSCSI or</text>
  <text x="340" y="304" font-size="11" fill="#64748b" text-anchor="end">NVMe/TCP</text>

  <!-- Durability for use 1: SeaweedFS -->
  <rect x="900" y="134" width="260" height="172" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="920" y="160" font-size="15" font-weight="700" fill="#065f46">SeaweedFS</text>
  <rect x="920" y="172" width="220" height="46" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="1030" y="191" font-size="12.5" font-weight="600" fill="#065f46" text-anchor="middle">HEAD root (~2 KB)</text>
  <text x="1030" y="208" font-size="11" fill="#047857" text-anchor="middle">conditional update on {gen, epoch}</text>
  <g>
    <rect x="924" y="228" width="30" height="18" rx="3" fill="#a7f3d0"/>
    <rect x="960" y="228" width="30" height="18" rx="3" fill="#a7f3d0"/>
    <rect x="996" y="228" width="30" height="18" rx="3" fill="#6ee7b7"/>
    <rect x="1032" y="228" width="30" height="18" rx="3" fill="#a7f3d0"/>
    <rect x="1068" y="228" width="30" height="18" rx="3" fill="#6ee7b7"/>
    <rect x="1104" y="228" width="30" height="18" rx="3" fill="#a7f3d0"/>
  </g>
  <text x="1030" y="264" font-size="11.5" fill="#047857" text-anchor="middle">immutable 4 MiB chunks, shared</text>
  <text x="1030" y="281" font-size="11.5" fill="#047857" text-anchor="middle">snapshot / fork = copy the root</text>
  <text x="1030" y="298" font-size="11.5" fill="#047857" text-anchor="middle">resume on another host at epoch + 1</text>

  <line x1="802" y1="286" x2="896" y2="220" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="852" y="232" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle">cut</text>
  <text x="852" y="276" font-size="10.5" fill="#0f766e" text-anchor="start">changed</text>
  <text x="852" y="289" font-size="10.5" fill="#0f766e" text-anchor="start">chunks</text>

  <!-- Durability for use 2: replicas -->
  <rect x="900" y="326" width="260" height="104" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="920" y="352" font-size="14" font-weight="700" fill="#78350f">Optional replicas (RF=2 / 3)</text>
  <text x="920" y="374" font-size="11.5" fill="#92400e">ship by LSN · durable barrier</text>
  <text x="920" y="394" font-size="11.5" fill="#92400e">best_effort · sync_quorum · sync_all</text>
  <text x="920" y="414" font-size="11.5" fill="#92400e">catch-up or rebuild · epoch-fenced</text>

  <line x1="802" y1="300" x2="896" y2="370" stroke="#b45309" stroke-width="2" marker-end="url(#arrowA)"/>
  <text x="840" y="352" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">replicate</text>

  <!-- Caption -->
  <text x="40" y="472" font-size="12.5" fill="#64748b">Workspace disks run one local replica; durability comes from cuts to SeaweedFS. Kubernetes volumes default to RF=1; synchronous RF=2 or RF=3 is opt-in (supported lab).</text>
</svg>
