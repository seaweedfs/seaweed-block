\* RED_hz_noclamp_safety: #205 control: without the clamp the restart rule still covers grants (expected to pass: the clamp is for S1 and fail-closed, not split-brain) (run from docs/spec: ./run.sh RED_hz_noclamp_safety)
SPECIFICATION Spec
CONSTANTS
    Kinds = {"forced"}
    MaxT = 4
    TTL = 2
    ITTL = 1
    MaxLSN = 2
    MaxCuts = 2
    Drift = 0
    MaxRestarts = 1
    LeaseOn = TRUE
    LsnGuard = TRUE
    StoreEpochGuard = TRUE
    HostFence = TRUE
    LayerLsnCheck = TRUE
    SeedFromObserved = TRUE
    GCEpochRule = TRUE
    WaitLeaseExpiry = TRUE
    Clamp = FALSE
    ExtFail = FALSE
INVARIANT TypeOK NoDualServing NoOldCasAfterTakeover NoLateChunkReachable ForcedLossBounded GCSafe
PROPERTY HeadMonotone
