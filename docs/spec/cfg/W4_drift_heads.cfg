\* W4_drift_heads: model-checks WorkspaceTakeover.tla (run from docs/spec: ./run.sh W4_drift_heads)
SPECIFICATION Spec
CONSTANTS
    Kinds = {"forced"}
    MaxT = 4
    TTL = 2
    ITTL = 1
    MaxLSN = 2
    MaxCuts = 2
    Drift = 1
    MaxRestarts = 1
    LeaseOn = TRUE
    LsnGuard = TRUE
    StoreEpochGuard = TRUE
    HostFence = TRUE
    LayerLsnCheck = TRUE
    SeedFromObserved = TRUE
    GCEpochRule = TRUE
    WaitLeaseExpiry = TRUE
    Clamp = TRUE
    ExtFail = FALSE
INVARIANT TypeOK NoOldCasAfterTakeover NoLateChunkReachable ForcedLossBounded GCSafe NoLiveIntentExpired AttachOrder SeedMatchesTakeover
PROPERTY HeadMonotone
