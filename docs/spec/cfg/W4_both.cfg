\* W4_both: model-checks WorkspaceTakeover.tla (run from docs/spec: ./run.sh W4_both)
SPECIFICATION Spec
CONSTANTS
    Kinds = {"clean", "forced"}
    MaxT = 4
    TTL = 2
    ITTL = 1
    MaxLSN = 2
    MaxCuts = 2
    Drift = 0
    MaxRestarts = 0
    LeaseOn = TRUE
    LsnGuard = TRUE
    StoreEpochGuard = TRUE
    HostFence = TRUE
    LayerLsnCheck = TRUE
    SeedFromObserved = TRUE
    GCEpochRule = TRUE
    WaitLeaseExpiry = TRUE
INVARIANT TypeOK NoDualServing NoOldCasAfterTakeover NoLateChunkReachable CleanNoLoss ForcedLossBounded GCSafe NoLiveIntentExpired AttachOrder SeedMatchesTakeover
PROPERTY HeadMonotone
