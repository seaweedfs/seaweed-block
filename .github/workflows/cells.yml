name: cells

# The must-pass table's 1/2/3-volume cells (.github/cell-tests.txt): each test
# group x each volume count is one job on the team runners. A cell needs every
# named test to PASS (required-tests-check.py: a skip, a failure, a test that
# never ran or was cut off fails it) AND, with 2 or 3 volumes, every sibling
# volume to read back every acknowledged write (cell-record.py). Each job
# prints and uploads its record: product head, binary sha256s, runner and
# kernel, and per test the subtests executed and skipped and the sibling lines.
# These tests use the test's user-space NVMe/TCP initiator, no kernel
# nvme-tcp module and no loop device; a cell that needs either is not listed
# here and runs on a lab host (never skipped here).
#
# Run on demand only (workflow_dispatch, for example on a release candidate),
# never on every pull request, so it does not double the CI queue on the
# team runners. A push to a cells-trial/ branch runs one short cell (the A1
# cell with 2 volumes) to prove a runner picks the job up.

on:
  workflow_dispatch:
  push:
    branches:
      - "cells-trial/**"

permissions:
  contents: read

concurrency:
  group: cells-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cell:
    name: cells ${{ matrix.group }} x ${{ matrix.volumes }} volume(s)
    runs-on: tp04-seaweed-block
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'push' && '{"group":["lifecycle"],"volumes":[2]}' || '{"group":["ladder","lifecycle","fault"],"volumes":[1,2,3]}') }}
    env:
      CGO_ENABLED: "0"
      SWBLOCK_TEST_VOLUMES: ${{ matrix.volumes }}
      SWBLOCK_TEST_VOLUME_BYTES: "104857600"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.sum

      - name: Self-test of the gates
        run: |
          python3 -I .github/scripts/required-tests-check-test.py
          python3 -I .github/scripts/cell-record-test.py

      - name: Pinned SeaweedFS
        # Checked against its sha256 before every use, also when taken from
        # the runner's cache; a mismatch fails the step.
        env:
          WEED_VERSION: "4.53"
          WEED_SHA256: d1a7dec9f48d8b33895a0ea8951971defc2dc5312906dcc76fa5a5f74a6ee90d
        run: |
          set -euo pipefail
          cache="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/seaweedfs-weed/$WEED_VERSION"
          tgz="$cache/linux_amd64.tar.gz"
          mkdir -p "$cache"
          if ! echo "$WEED_SHA256  $tgz" | sha256sum -c --status - 2>/dev/null; then
            part="$tgz.$$.part"
            curl -fsSL --retry 3 -o "$part" "https://github.com/seaweedfs/seaweedfs/releases/download/$WEED_VERSION/linux_amd64.tar.gz"
            echo "$WEED_SHA256  $part" | sha256sum -c - || { rm -f "$part"; exit 1; }
            mv -f "$part" "$tgz"
          fi
          bin="$RUNNER_TEMP/weed-$WEED_VERSION"
          mkdir -p "$bin"
          tar -xzf "$tgz" -C "$bin" weed
          echo "CHUNKSTORE_WEED=$bin/weed" >>"$GITHUB_ENV"

      - name: Build the binaries and the test binary once
        run: |
          set -euo pipefail
          bins="$RUNNER_TEMP/swblock-bins"
          mkdir -p "$bins"
          for b in blockmaster blockvolume sw-block; do go build -o "$bins/$b" "./cmd/$b"; done
          go test -c -tags 'subprocess chunkstore_integration' -o "$bins/blockvolume.test" ./cmd/blockvolume
          echo "SWBLOCK_TEST_BINS=$bins" >>"$GITHUB_ENV"

      - name: Run the group's tests
        env:
          GROUP: ${{ matrix.group }}
          TRIAL: ${{ github.event_name == 'push' }}
          TEST_TIMEOUT: 15m
        run: |
          set -euo pipefail
          names="$RUNNER_TEMP/cell-$GROUP.txt"
          sed 's/#.*//' .github/cell-tests.txt | awk -v g="$GROUP" '$1 == g { print $2 }' >"$names"
          if [ "$TRIAL" = true ]; then
            echo TestCellCreateMountWriteRead >"$names"
          fi
          test -s "$names"
          bash .github/scripts/run-named-tests.sh "$SWBLOCK_TEST_BINS/blockvolume.test" "$names" \
            "$RUNNER_TEMP/cell.json" "$RUNNER_TEMP/cell.status" "$TEST_TIMEOUT" cmd/blockvolume
          rc=0
          python3 -I .github/scripts/required-tests-check.py --status "$RUNNER_TEMP/cell.status" \
            "$names" "$RUNNER_TEMP/cell.json" || rc=1
          python3 -I .github/scripts/cell-record.py "$SWBLOCK_TEST_VOLUMES" "$names" "$RUNNER_TEMP/cell.json" \
            "$SWBLOCK_TEST_BINS"/blockmaster "$SWBLOCK_TEST_BINS"/blockvolume "$SWBLOCK_TEST_BINS"/sw-block \
            "$SWBLOCK_TEST_BINS"/blockvolume.test "$CHUNKSTORE_WEED" >"$RUNNER_TEMP/cell-record.json" || rc=1
          cat "$RUNNER_TEMP/cell-record.json"
          exit "$rc"

      - name: Upload the cell record
        # The record is also printed above, so the run's log carries it even
        # if the upload is refused.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cell-${{ matrix.group }}-${{ matrix.volumes }}
          path: |
            ${{ runner.temp }}/cell-record.json
            ${{ runner.temp }}/cell.status
            ${{ runner.temp }}/cell.json
          if-no-files-found: warn
