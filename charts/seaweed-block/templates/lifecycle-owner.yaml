{{- if .Values.lifecycleOwner.create }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sw-block-lifecycle-owner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seaweed-block.labels" . | nindent 4 }}
    app: sw-block-lifecycle-owner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sw-block-lifecycle-owner
  template:
    metadata:
      labels:
        app: sw-block-lifecycle-owner
        {{- include "seaweed-block.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "seaweed-block.fullname" . }}-lifecycle-owner
      {{- with .Values.lifecycleOwner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: lifecycle-owner
          image: {{ include "seaweed-block.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/sw-block"]
          args:
            - "ops"
            - "lifecycle-owner"
            {{- if .Values.lifecycleOwner.dryRun }}
            - "--dry-run"
            {{- end }}
            - "--namespace={{ .Release.Namespace }}"
            - "--interval={{ .Values.lifecycleOwner.interval }}"
{{- end }}
