{{- if .Values.failbackExecutor.create }}
{{- if and .Values.failbackExecutor.execution.enabled .Values.failbackExecutor.dryRun -}}
{{- fail "failbackExecutor.execution.enabled=true requires failbackExecutor.dryRun=false" -}}
{{- end -}}
{{- if and .Values.failbackExecutor.execution.enabled (not .Values.failbackExecutor.execution.policy) -}}
{{- fail "failbackExecutor.execution.enabled=true requires failbackExecutor.execution.policy=true" -}}
{{- end -}}
{{- if and .Values.failbackExecutor.execution.failbackRuntimeGrpcAddr (not .Values.failbackExecutor.execution.enabled) -}}
{{- fail "failbackExecutor.execution.failbackRuntimeGrpcAddr requires failbackExecutor.execution.enabled=true" -}}
{{- end -}}
{{- if and .Values.failbackExecutor.execution.failbackRuntimeURL (not .Values.failbackExecutor.execution.enabled) -}}
{{- fail "failbackExecutor.execution.failbackRuntimeURL requires failbackExecutor.execution.enabled=true" -}}
{{- end -}}
{{- if and .Values.failbackExecutor.execution.failbackRuntimeGrpcAddr .Values.failbackExecutor.execution.failbackRuntimeURL -}}
{{- fail "failbackExecutor.execution.failbackRuntimeGrpcAddr and failbackExecutor.execution.failbackRuntimeURL are mutually exclusive" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sw-block-failback-executor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seaweed-block.labels" . | nindent 4 }}
    app: sw-block-failback-executor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sw-block-failback-executor
  template:
    metadata:
      labels:
        app: sw-block-failback-executor
        {{- include "seaweed-block.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "seaweed-block.fullname" . }}-failback-executor
      {{- with .Values.failbackExecutor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: failback-executor
          image: {{ include "seaweed-block.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/sw-block"]
          args:
            - "ops"
            - "failback-executor"
            - "--namespace={{ .Release.Namespace }}"
            {{- if .Values.failbackExecutor.dryRun }}
            - "--dry-run"
            {{- end }}
            {{- if .Values.failbackExecutor.execution.enabled }}
            - "--enable-execution"
            {{- end }}
            {{- if .Values.failbackExecutor.execution.policy }}
            - "--execution-policy"
            {{- end }}
            {{- if .Values.failbackExecutor.execution.failbackRuntimeGrpcAddr }}
            - "--failback-runtime-grpc-addr={{ .Values.failbackExecutor.execution.failbackRuntimeGrpcAddr }}"
            {{- end }}
            {{- if .Values.failbackExecutor.execution.failbackRuntimeURL }}
            - "--failback-runtime-url={{ .Values.failbackExecutor.execution.failbackRuntimeURL }}"
            {{- end }}
            - "--interval={{ .Values.failbackExecutor.interval }}"
{{- end }}
