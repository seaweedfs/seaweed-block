{{- if and .Values.failbackExecutor.create .Values.failbackExecutor.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "seaweed-block.fullname" . }}-failback-executor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seaweed-block.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "seaweed-block.fullname" . }}-failback-executor
  labels:
    {{- include "seaweed-block.labels" . | nindent 4 }}
rules:
  - apiGroups: ["block.seaweedfs.com"]
    resources: ["swblockreplicafailbacks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["block.seaweedfs.com"]
    resources: ["swblockreplicafailbacks/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "seaweed-block.fullname" . }}-failback-executor
  labels:
    {{- include "seaweed-block.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "seaweed-block.fullname" . }}-failback-executor
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "seaweed-block.fullname" . }}-failback-executor
{{- end }}
