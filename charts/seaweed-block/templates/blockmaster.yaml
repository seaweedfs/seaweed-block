{{- if and .Values.network.externalISCSI (not .Values.chap.enabled) -}}
{{- fail "network.externalISCSI=true requires chap.enabled=true so cross-node iSCSI is not published without CHAP credentials" -}}
{{- end -}}
{{- if and .Values.network.externalStatus (not (or .Values.network.externalISCSI .Values.network.externalNVMe)) -}}
{{- fail "network.externalStatus=true requires network.externalISCSI=true or network.externalNVMe=true because external status is only supported with external block frontend publishing" -}}
{{- end -}}
{{- if and (ne .Values.blockmaster.durableImpl "walstore") (not .Values.compat.launcherDurableImplFlag) -}}
{{- fail "blockmaster.durableImpl requires compat.launcherDurableImplFlag=true because older published images do not accept --launcher-durable-impl" -}}
{{- end -}}
{{- if and .Values.snapshot.enabled (not .Values.snapshot.runtimeSecretName) -}}
{{- fail "snapshot.enabled=true requires snapshot.runtimeSecretName" -}}
{{- end -}}
{{- if and .Values.snapshot.enabled (not .Values.blockmaster.stateHostPath) -}}
{{- fail "snapshot.enabled=true requires blockmaster.stateHostPath so the snapshot catalog survives restart" -}}
{{- end -}}
{{- if and .Values.snapshot.enabled (not (index .Values.blockmaster.nodeSelector "kubernetes.io/hostname")) -}}
{{- fail "snapshot.enabled=true requires blockmaster.nodeSelector.kubernetes.io/hostname so the node-local snapshot catalog is pinned to exactly one node" -}}
{{- end -}}
{{- if and .Values.snapshot.enabled (ne (int .Values.blockmaster.replicas) 1) -}}
{{- fail "snapshot.enabled=true requires blockmaster.replicas=1 for the node-local snapshot catalog" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sw-blockmaster
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seaweed-block.labels" . | nindent 4 }}
    app: sw-blockmaster
spec:
  replicas: {{ .Values.blockmaster.replicas }}
  selector:
    matchLabels:
      app: sw-blockmaster
  template:
    metadata:
      labels:
        app: sw-blockmaster
        {{- include "seaweed-block.labels" . | nindent 8 }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "seaweed-block.fullname" . }}-master
      {{- with .Values.blockmaster.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.blockmaster.stateHostPath }}
      initContainers:
        - name: state-permissions
          image: {{ include "seaweed-block.statePermissionsImage" . | quote }}
          imagePullPolicy: {{ .Values.blockmaster.statePermissionsImage.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - "mkdir -p /var/lib/sw-block/authority /var/lib/sw-block/lifecycle{{ if .Values.snapshot.enabled }} /var/lib/sw-block/snapshots{{ end }} && chown -R 65532:65532 /var/lib/sw-block"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: state
              mountPath: /var/lib/sw-block
      {{- end }}
      containers:
        - name: blockmaster
          image: {{ include "seaweed-block.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/blockmaster"]
          args:
            - "--authority-store={{ .Values.blockmaster.authorityStore }}"
            - "--lifecycle-store={{ .Values.blockmaster.lifecycleStore }}"
            - "--cluster-spec=/config/cluster-spec.yaml"
            - "--lifecycle-product-loop-interval={{ .Values.blockmaster.lifecycleProductLoopInterval }}"
            - "--launcher-loop-interval={{ .Values.blockmaster.launcherLoopInterval }}"
            - "--launcher-manifest-dir={{ .Values.blockmaster.launcherManifestDir }}"
            - "--launcher-master-addr={{ include "seaweed-block.blockmasterAddress" . }}"
            - "--launcher-image={{ include "seaweed-block.image" . }}"
            - "--launcher-namespace={{ .Release.Namespace }}"
            - "--launcher-durable-root={{ .Values.blockmaster.durableRoot }}"
            {{- if .Values.compat.launcherDurableImplFlag }}
            - "--launcher-durable-impl={{ .Values.blockmaster.durableImpl }}"
            {{- end }}
            {{- if .Values.blockmaster.durableWALMultiBlockRecords }}
            - "--launcher-durable-wal-multiblock-records"
            {{- end }}
            {{- if .Values.blockmaster.durableWALRecoveryTestDisableFlusher }}
            - "--launcher-durable-wal-recovery-test-disable-flusher"
            {{- end }}
            {{- if .Values.blockmaster.launcherStatus }}
            - "--launcher-status"
            {{- end }}
            {{- if .Values.compat.launcherReplicationAckFlag }}
            - "--launcher-replication-ack={{ .Values.replication.ackProfile }}"
            {{- end }}
            - "--launcher-iscsi-port-base={{ .Values.ports.iscsiBase }}"
            - "--launcher-nvme-port-base={{ .Values.ports.nvmeBase }}"
            {{- if ne (int .Values.nvme.maxH2CDataLength) 32768 }}
            - "--launcher-nvme-max-h2c-data-length={{ .Values.nvme.maxH2CDataLength }}"
            {{- end }}
            {{- if and .Values.blockmaster.launcherPVCOwnerRef (not .Values.snapshot.enabled) }}
            - "--launcher-pvc-owner-ref"
            {{- end }}
            {{- if .Values.blockmaster.stateHostPath }}
            - "--launcher-state-hostpath={{ .Values.blockmaster.stateHostPath }}"
            {{- end }}
            {{- if .Values.snapshot.enabled }}
            - "--snapshot-root=/var/lib/sw-block/snapshots"
            - "--snapshot-runtime-ca-file=/var/run/sw-block/snapshot-runtime/ca.crt"
            - "--snapshot-runtime-token-file=/var/run/sw-block/snapshot-runtime/token"
            - "--snapshot-runtime-client-cert=/var/run/sw-block/snapshot-runtime/client.crt"
            - "--snapshot-runtime-client-key=/var/run/sw-block/snapshot-runtime/client.key"
            - "--snapshot-api-listen=0.0.0.0:{{ .Values.snapshot.apiPort }}"
            - "--snapshot-api-tls-cert=/var/run/sw-block/snapshot-runtime/api-server.crt"
            - "--snapshot-api-tls-key=/var/run/sw-block/snapshot-runtime/api-server.key"
            - "--snapshot-api-client-ca=/var/run/sw-block/snapshot-runtime/api-client-ca.crt"
            - "--snapshot-api-token-file=/var/run/sw-block/snapshot-runtime/api-token"
            - "--launcher-snapshot-runtime-secret-name={{ .Values.snapshot.runtimeSecretName }}"
            {{- end }}
            {{- if .Values.network.externalISCSI }}
            - "--launcher-external-iscsi"
            - "--launcher-iscsi-chap-secret-name={{ .Values.chap.secretName }}"
            - "--launcher-iscsi-chap-username-key={{ .Values.chap.usernameKey }}"
            - "--launcher-iscsi-chap-secret-key={{ .Values.chap.secretKey }}"
            {{- end }}
            {{- if .Values.network.externalNVMe }}
            - "--launcher-external-nvme"
            {{- end }}
            {{- if .Values.network.externalStatus }}
            - "--launcher-external-status"
            {{- end }}
            {{- if and .Values.network.rejectLoopbackPublishTargets .Values.compat.launcherRejectLoopbackFlag }}
            - "--launcher-reject-loopback-publish-targets"
            {{- end }}
            - "--launcher-kubernetes-apply"
            - "--listen=0.0.0.0:{{ .Values.blockmaster.listenPort }}"
            {{- if .Values.blockmaster.failbackRuntimeRPC }}
            - "--failback-runtime-rpc"
            {{- end }}
            {{- if .Values.blockmaster.frontendPublicationRuntimeHTTP }}
            - "--frontend-publication-runtime-http"
            - "--frontend-publication-runtime-listen=0.0.0.0:{{ .Values.blockmaster.frontendPublicationRuntimePort }}"
            {{- end }}
            - "--expected-slots-per-volume={{ include "seaweed-block.expectedSlotsPerVolume" . }}"
          ports:
            - name: grpc
              containerPort: {{ .Values.blockmaster.listenPort }}
            {{- if .Values.snapshot.enabled }}
            - name: snapshot-grpc
              containerPort: {{ .Values.snapshot.apiPort }}
            {{- end }}
            {{- if .Values.blockmaster.frontendPublicationRuntimeHTTP }}
            - name: frontend-http
              containerPort: {{ .Values.blockmaster.frontendPublicationRuntimePort }}
            {{- end }}
          volumeMounts:
            - name: cluster-spec
              mountPath: /config
              readOnly: true
            - name: state
              mountPath: /var/lib/sw-block
            - name: manifests
              mountPath: /manifests
            {{- if .Values.snapshot.enabled }}
            - name: snapshot-runtime-identity
              mountPath: /var/run/sw-block/snapshot-runtime
              readOnly: true
            {{- end }}
      volumes:
        - name: cluster-spec
          configMap:
            name: {{ include "seaweed-block.fullname" . }}-cluster-spec
        - name: state
          {{- if .Values.blockmaster.stateHostPath }}
          hostPath:
            path: {{ .Values.blockmaster.stateHostPath | quote }}
            type: {{ .Values.blockmaster.stateHostPathType | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: manifests
          emptyDir: {}
        {{- if .Values.snapshot.enabled }}
        - name: snapshot-runtime-identity
          secret:
            secretName: {{ .Values.snapshot.runtimeSecretName }}
            items:
              - key: ca.crt
                path: ca.crt
              - key: token
                path: token
              - key: client.crt
                path: client.crt
              - key: client.key
                path: client.key
              - key: api-token
                path: api-token
              - key: api-server.crt
                path: api-server.crt
              - key: api-server.key
                path: api-server.key
              - key: api-client-ca.crt
                path: api-client-ca.crt
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.blockmaster.serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seaweed-block.labels" . | nindent 4 }}
    app: sw-blockmaster
spec:
  selector:
    app: sw-blockmaster
  ports:
    - name: grpc
      port: {{ .Values.blockmaster.listenPort }}
      targetPort: grpc
    {{- if .Values.snapshot.enabled }}
    - name: snapshot-grpc
      port: {{ .Values.snapshot.apiPort }}
      targetPort: snapshot-grpc
    {{- end }}
    {{- if .Values.blockmaster.frontendPublicationRuntimeHTTP }}
    - name: frontend-http
      port: {{ .Values.blockmaster.frontendPublicationRuntimePort }}
      targetPort: frontend-http
    {{- end }}
