apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sw-block-csi-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seaweed-block.labels" . | nindent 4 }}
    app: sw-block-csi-node
spec:
  selector:
    matchLabels:
      app: sw-block-csi-node
  template:
    metadata:
      labels:
        app: sw-block-csi-node
        {{- include "seaweed-block.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "seaweed-block.fullname" . }}-csi
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostPID: true
      {{- if .Values.csiNode.loadKernelModules }}
      initContainers:
        - name: load-iscsi-tcp
          image: {{ include "seaweed-block.csiImage" . | quote }}
          imagePullPolicy: {{ .Values.csiImage.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - "modprobe iscsi_tcp || true; modprobe nvme_tcp || true; modprobe nvme_rdma || true; modprobe dm_multipath || true; modprobe scsi_dh_alua || true"
          securityContext:
            privileged: true
          volumeMounts:
            - name: modules-dir
              mountPath: /lib/modules
              readOnly: true
      {{- end }}
      containers:
        - name: block-csi
          image: {{ include "seaweed-block.csiImage" . | quote }}
          imagePullPolicy: {{ .Values.csiImage.pullPolicy }}
          args:
            - "--endpoint=unix:///csi/csi.sock"
            - "--master=$(BLOCKMASTER_ADDR)"
            - "--node-id=$(NODE_NAME)"
            {{- if .Values.stage2Multipath.enabled }}
            - "--stage2-multipath"
            {{- end }}
            {{- if .Values.csiNode.nvmeReconnect.enabled }}
            - "--nvme-reconnect-owner"
            - "--nvme-reconnect-interval={{ .Values.csiNode.nvmeReconnect.interval }}"
            {{- end }}
            {{- if .Values.network.rejectLoopbackPublishTargets }}
            - "--reject-loopback-publish-targets"
            {{- end }}
          env:
            - name: BLOCKMASTER_ADDR
              value: {{ include "seaweed-block.blockmasterAddress" . | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: dev
              mountPath: /dev
            - name: iscsi-dir
              mountPath: /etc/iscsi
            - name: udev-run
              mountPath: /run/udev
              readOnly: true
        - name: csi-node-driver-registrar
          image: {{ .Values.sidecars.nodeDriverRegistrarImage | quote }}
          args:
            - "--csi-address=/csi/csi.sock"
            - "--kubelet-registration-path={{ .Values.csiNode.pluginPath }}/csi.sock"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      volumes:
        - name: socket-dir
          hostPath:
            path: {{ .Values.csiNode.pluginPath | quote }}
            type: DirectoryOrCreate
        - name: kubelet-dir
          hostPath:
            path: {{ .Values.csiNode.kubeletPath | quote }}
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: iscsi-dir
          hostPath:
            path: /etc/iscsi
            type: DirectoryOrCreate
        - name: udev-run
          hostPath:
            path: /run/udev
            type: Directory
        - name: modules-dir
          hostPath:
            path: /lib/modules
            type: Directory
        - name: registration-dir
          hostPath:
            path: {{ .Values.csiNode.registrationPath | quote }}
            type: Directory
