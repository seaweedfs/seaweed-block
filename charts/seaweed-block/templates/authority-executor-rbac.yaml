{{- if and .Values.authorityExecutor.create .Values.authorityExecutor.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "seaweed-block.fullname" . }}-authority-executor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seaweed-block.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "seaweed-block.fullname" . }}-authority-executor
  labels:
    {{- include "seaweed-block.labels" . | nindent 4 }}
rules:
  - apiGroups: ["block.seaweedfs.com"]
    resources: ["swblockvolumes"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.authorityExecutor.execution.enabled }}
  - apiGroups: ["block.seaweedfs.com"]
    resources: ["swblockreplicaeligibilities"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["block.seaweedfs.com"]
    resources: ["swblockreplicaeligibilities/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["block.seaweedfs.com"]
    resources: ["swblockreplicarebuilds"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["block.seaweedfs.com"]
    resources: ["swblockreplicarebuilds/status"]
    verbs: ["get", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "seaweed-block.fullname" . }}-authority-executor
  labels:
    {{- include "seaweed-block.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "seaweed-block.fullname" . }}-authority-executor
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "seaweed-block.fullname" . }}-authority-executor
{{- end }}
