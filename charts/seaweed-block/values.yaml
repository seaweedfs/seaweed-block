# Seaweed Block Helm values.
#
# This chart packages the existing alpha Kubernetes install path. It does not
# claim operator lifecycle, backup/restore, upgrade safety, or mutating admin
# actions.

image:
  repository: ghcr.io/seaweedfs/seaweed-block
  tag: alpha
  digest: ""
  pullPolicy: IfNotPresent

csiImage:
  repository: ghcr.io/seaweedfs/seaweed-block-csi
  tag: alpha
  digest: ""
  pullPolicy: IfNotPresent

sidecars:
  provisionerImage: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0
  attacherImage: registry.k8s.io/sig-storage/csi-attacher:v4.8.1
  nodeDriverRegistrarImage: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0

driver:
  name: block.csi.seaweedfs.com

appNamespace: default

blockmaster:
  replicas: 1
  nodeSelector: {}
  serviceName: blockmaster
  listenPort: 9333
  authorityStore: /var/lib/sw-block/authority
  lifecycleStore: /var/lib/sw-block/lifecycle
  durableRoot: /var/lib/sw-block
  lifecycleProductLoopInterval: 100ms
  launcherLoopInterval: 100ms
  launcherManifestDir: /manifests
  launcherNamespace: kube-system
  launcherStatus: true
  launcherPVCOwnerRef: true
  durableImpl: walstore
  stateHostPath: ""
  stateHostPathType: DirectoryOrCreate
  statePermissionsImage:
    repository: busybox
    tag: "1.36"
    digest: ""
    pullPolicy: IfNotPresent

restartPersistence:
  # ephemeral keeps the alpha/dev default. hostpath persists blockmaster and
  # generated blockvolume state across Kubernetes pod restarts.
  mode: ephemeral
  stateHostPath: ""

storageClass:
  create: true
  name: sw-block-dynamic
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  allowVolumeExpansion: false
  replicationFactor: 1
  protocol: iscsi
  nodeStageSecret:
    enabled: true

replication:
  ackProfile: best-effort
  expectedSlotsPerVolume: 0

network:
  externalISCSI: false
  externalStatus: false
  rejectLoopbackPublishTargets: false

compat:
  # Some published alpha images predate these blockmaster launcher flags. Keep
  # these false unless the selected image is known to support the flag.
  launcherDurableImplFlag: false
  launcherReplicationAckFlag: false
  launcherRejectLoopbackFlag: false

stage2Multipath:
  enabled: false

chap:
  enabled: false
  secretName: sw-block-iscsi-chap
  usernameKey: chapUsername
  secretKey: chapSecret
  username: ""
  secret: ""
  create: true

ports:
  iscsiBase: 3260
  statusBase: 23260

# Initial block-capable nodes. D2 will add a generator that derives this from
# `kubectl get nodes` so node names and InternalIPs are verified against the
# live cluster.
blockNodes:
  - name: m02
    serverID: m02
    internalIP: 127.0.0.1
    dataPort: 19101
    ctrlPort: 19102
    poolID: pool-a
    totalBytes: 1073741824
    freeBytes: 1073741824

rbac:
  create: true

operatorStatus:
  # Phase 35 read-only operator foundation. When enabled, this installs the
  # status service account/RBAC plus a status projection Deployment. dryRun
  # logs the projection only. dryRun=false patches existing SwBlockCluster /
  # SwBlockVolume .status subresources and does not create CR objects.
  create: false
  dryRun: true
  interval: 30s
  clusterName: sw-block
  rbac:
    create: true
  nodeSelector: {}

lifecycleOwner:
  # Phase 43 bounded lifecycle owner. Disabled by default. When enabled with
  # dryRun=false it may patch only SwBlockVolume metadata.finalizers, and the
  # admission policy confines the patch to the Seaweed Block protection
  # finalizer.
  create: false
  dryRun: true
  interval: 30s
  finalizerName: block.seaweedfs.com/swblockvolume-protection
  rbac:
    create: true
  admission:
    create: true
  nodeSelector: {}

csiController:
  replicas: 1

csiNode:
  kubeletPath: /var/lib/kubelet
  pluginPath: /var/lib/kubelet/plugins/block.csi.seaweedfs.com
  registrationPath: /var/lib/kubelet/plugins_registry
  loadKernelModules: true
