apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: swblockfrontendpublications.block.seaweedfs.com
spec:
  group: block.seaweedfs.com
  scope: Namespaced
  names:
    plural: swblockfrontendpublications
    singular: swblockfrontendpublication
    kind: SwBlockFrontendPublication
    shortNames:
      - swbfp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Volume
          type: string
          jsonPath: .spec.volumeName
        - name: Replica
          type: string
          jsonPath: .spec.replicaID
        - name: State
          type: string
          jsonPath: .status.state
        - name: Reason
          type: string
          jsonPath: .status.reasonCode
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: Narrow target for future frontend publication. Phase 69 creates the target only; it does not publish frontend paths.
          properties:
            spec:
              type: object
              description: Identity and terminal ACK evidence required before a future frontend publication executor may act.
              required:
                - volumeName
                - replicaID
              properties:
                volumeName:
                  type: string
                volumeID:
                  type: string
                pvcName:
                  type: string
                replicaID:
                  type: string
                sourceEligibilityName:
                  type: string
                sourceFailbackName:
                  type: string
                ackEligibilityKnown:
                  type: boolean
                ackEligible:
                  type: boolean
                frontendFencedAfterExecution:
                  type: boolean
                primaryUnchanged:
                  type: boolean
                durableFrontierCovered:
                  type: boolean
                noCrossVolumeIdentityChange:
                  type: boolean
                failbackCompleted:
                  type: boolean
                authorityEpochAdvanced:
                  type: boolean
                singlePrimaryAfterFailback:
                  type: boolean
                publishTargetSwappedAfterFailback:
                  type: boolean
                frontendPublicationDecision:
                  type: string
                  enum:
                    - blocked
                    - disabled
                    - enabled
                frontendPublicationReason:
                  type: string
                frontendPublicationMutationAllowed:
                  type: boolean
                runtimeEndpoint:
                  type: string
            status:
              type: object
              properties:
                observedAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                executor:
                  type: string
                state:
                  type: string
                  enum:
                    - planned
                    - blocked
                    - published
                reasonCode:
                  type: string
                publicationMutationAllowed:
                  type: boolean
                frontendPublished:
                  type: boolean
                failbackStarted:
                  type: boolean
                noStorageMutation:
                  type: boolean
                noCrossVolumeIdentityChange:
                  type: boolean
                evidenceGeneration:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        enum:
                          - Ready
                          - Blocked
                          - Recovering
                          - Recovered
                          - EvidenceStale
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      severity:
                        type: string
                        enum:
                          - info
                          - warning
                          - error
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      evidenceRefs:
                        type: array
                        items:
                          type: string
                evidenceRefs:
                  type: array
                  items:
                    type: string
                nonClaims:
                  type: array
                  items:
                    type: string
