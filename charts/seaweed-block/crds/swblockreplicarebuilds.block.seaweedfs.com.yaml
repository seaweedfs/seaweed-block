apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: swblockreplicarebuilds.block.seaweedfs.com
spec:
  group: block.seaweedfs.com
  scope: Namespaced
  names:
    plural: swblockreplicarebuilds
    singular: swblockreplicarebuild
    kind: SwBlockReplicaRebuild
    shortNames:
      - swbrr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Volume
          type: string
          jsonPath: .spec.volumeName
        - name: Replica
          type: string
          jsonPath: .spec.replicaID
        - name: State
          type: string
          jsonPath: .status.state
        - name: Reason
          type: string
          jsonPath: .status.reasonCode
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: Narrow status target for returned-replica rebuild/catch-up progress evidence.
          properties:
            spec:
              type: object
              description: Identity of the returned replica whose rebuild/catch-up progress may be recorded.
              required:
                - volumeName
                - replicaID
              properties:
                volumeName:
                  type: string
                volumeID:
                  type: string
                pvcName:
                  type: string
                replicaID:
                  type: string
                sourceReplicaID:
                  type: string
            status:
              type: object
              properties:
                observedAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                executor:
                  type: string
                state:
                  type: string
                  enum:
                    - planned
                    - blocked
                    - running
                    - caught_up
                reasonCode:
                  type: string
                frontendFencedBeforeRebuild:
                  type: boolean
                primaryUnchanged:
                  type: boolean
                durableFrontierKnown:
                  type: boolean
                durableFrontierLsn:
                  type: integer
                  format: int64
                  minimum: 0
                requiredFrontierKnown:
                  type: boolean
                requiredFrontierLsn:
                  type: integer
                  format: int64
                  minimum: 0
                durableFrontierCaughtUp:
                  type: boolean
                rebuildTrafficStarted:
                  type: boolean
                noFrontendPublication:
                  type: boolean
                noCrossVolumeIdentityChange:
                  type: boolean
                evidenceGeneration:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        enum:
                          - Ready
                          - Blocked
                          - Recovering
                          - Recovered
                          - EvidenceStale
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      severity:
                        type: string
                        enum:
                          - info
                          - warning
                          - error
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      evidenceRefs:
                        type: array
                        items:
                          type: string
                evidenceRefs:
                  type: array
                  items:
                    type: string
                nonClaims:
                  type: array
                  items:
                    type: string
