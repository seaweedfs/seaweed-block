# tmpfiles.d entry for the blockvolume host volume locks. Install as
# /etc/tmpfiles.d/sw-block.conf, then run `systemd-tmpfiles --create`.
# blockvolume creates the directory when it can and refuses to start when it
# cannot (the shipped units cannot: ProtectSystem=strict). Each volume takes an
# exclusive lock on /run/sw-block/locks/<volume id>.lock, so one host runs at
# most one live blockvolume per volume. The directory is owned by the
# unprivileged units' user (sw-block) and is 0700, so no other local user can
# create or hold a volume's lock. The root ublk unit reaches it as root.
d /run/sw-block 0755 root root -
d /run/sw-block/locks 0700 sw-block sw-block -
