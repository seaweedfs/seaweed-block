# Runner-native Phase 81 gate: blockmaster has a FailbackService RPC that is
# registered but disabled by default. Enabling it is explicit and still requires
# expected-current + terminal evidence.

name: failback-service-rpc-chain
timeout: 8m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: failback_service_rpc_gate
    actions:
      - action: exec
        node: m02
        timeout: 7m
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase81-failback-service-rpc && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase81-failback-service-rpc && cd {{ product_root }} && SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase81-failback-service-rpc bash scripts/run-phase81-failback-service-rpc-gate.sh {{ product_root }}"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase81-failback-service-rpc/phase81-failback-service-rpc-summary.txt"
        pattern: "^phase81_failback_service_rpc_status=ok$"
        save_as: phase81_ok
      - action: assert_greater
        actual: "{{ phase81_ok }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase81-failback-service-rpc/phase81-failback-service-rpc-summary.txt"
        pattern: "^failback_service_default_disabled=true$"
        save_as: default_disabled
      - action: assert_greater
        actual: "{{ default_disabled }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase81-failback-service-rpc/phase81-failback-service-rpc-summary.txt"
        pattern: "^failback_runtime_rpc_flag_default_false=true$"
        save_as: flag_default_false
      - action: assert_greater
        actual: "{{ flag_default_false }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase81-failback-service-rpc/phase81-failback-service-rpc-summary.txt"
        pattern: "^failback_runtime_rpc_flag_opt_in=true$"
        save_as: flag_opt_in
      - action: assert_greater
        actual: "{{ flag_opt_in }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase81-failback-service-rpc/phase81-failback-service-rpc-summary.txt"
        pattern: "^failback_service_registered=true$"
        save_as: service_registered
      - action: assert_greater
        actual: "{{ service_registered }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase81-failback-service-rpc/phase81-failback-service-rpc-summary.txt"
        pattern: "^enabled_failback_service_advances_publisher=true$"
        save_as: enabled_advances
      - action: assert_greater
        actual: "{{ enabled_advances }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase81-failback-service-rpc/phase81-failback-service-rpc-summary.txt"
        pattern: "^public_rpc_enabled_by_default=false$"
        save_as: public_rpc_default_off
      - action: assert_greater
        actual: "{{ public_rpc_default_off }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase81-failback-service-rpc/phase81-failback-service-rpc-summary.txt"
        pattern: "^frontend_publication_allowed=false$"
        save_as: no_frontend_publication
      - action: assert_greater
        actual: "{{ no_frontend_publication }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase81-failback-service-rpc/phase81-failback-service-rpc-summary.txt"
        pattern: "^storage_mutation_allowed=false$"
        save_as: no_storage_mutation
      - action: assert_greater
        actual: "{{ no_storage_mutation }}"
        threshold: "0"

  - name: collect
    always: true
    actions:
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase81-failback-service-rpc"
        name: "remote-phases"
        ignore_error: true
