# Phase 27 D8: multi-volume RF=3 mounted failover with app pods spread across nodes.
#
# Pass = three RF=3 PVCs are mounted by long-running writer pods distributed
# across m01/m02/tp01, each target volume's current primary is stopped in turn,
# the same writer pod UID verifies old data and writes new data through
# dm-multipath, and cleanup is clean.

name: helm-multi-volume-rf3-app-spread-failover-chain
timeout: 52m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"
  helm_release: "sw-block"
  helm_namespace: "kube-system"
  sw_block_image: "sw-block:phase27-d8"
  sw_block_csi_image: "sw-block-csi:phase27-d8"
  volume_count: "3"
  replication_factor: "3"
  app_nodes: "m01,m02,tp01"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: pre_clean
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        timeout: 6m
        cmd: |
          set -e
          helm uninstall {{ helm_release }} --namespace {{ helm_namespace }} --wait --timeout 240s >/dev/null 2>&1 || true
          kubectl -n default delete pod -l sw-block-test=multi-volume-mounted-failover --ignore-not-found=true --wait=true --timeout=180s
          for i in 1 2 3; do
            kubectl -n default delete pod sw-block-multi-mounted-writer-$i --ignore-not-found=true --wait=true --timeout=180s
            kubectl -n default delete pvc sw-block-multi-mounted-pvc-$i --ignore-not-found=true --wait=true --timeout=180s
          done
          kubectl delete storageclass sw-block-multi-mounted sw-block-dynamic --ignore-not-found=true --wait=true --timeout=180s
          kubectl delete clusterrole/sw-block-csi clusterrolebinding/sw-block-csi --ignore-not-found=true
          for ip in 192.168.1.181 192.168.1.184 192.168.1.188; do
            if [ "$ip" = "192.168.1.184" ]; then runner="bash -lc"; else runner="ssh -i /opt/work/testdev_key -o StrictHostKeyChecking=no testdev@$ip"; fi
            $runner 'sudo -n iscsiadm -m node 2>/dev/null | awk '"'"'/io.seaweedfs/ {print $1, $2}'"'"' | while read portal target; do sudo -n iscsiadm -m node -T "$target" -p "$portal" --logout >/dev/null 2>&1 || true; sudo -n iscsiadm -m node -T "$target" -p "$portal" -o delete >/dev/null 2>&1 || true; done; sudo -n multipath -F >/dev/null 2>&1 || true'
          done
          rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover
          mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/bin /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/values /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/install /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/recovery /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/cleanup
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: assert_no_active_iscsi_sessions
        node: m02

  - name: preflight
    actions:
      - action: exec
        node: m02
        cmd: "kubectl get nodes -o wide | tee /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/preflight-nodes.txt && kubectl get nodes --no-headers | awk '$2==\"Ready\"{c++} END{if(c<3){exit 1}}'"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/preflight-nodes.txt"
        pattern: "Ready"
        save_as: ready_node_count
      - action: assert_greater
        actual: "{{ ready_node_count }}"
        threshold: "2"

  - name: host_multipath_prereq
    actions:
      - action: exec
        node: m02
        cmd: |
          set -e
          B=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover
          : > "$B/multipath-prereq.txt"
          for spec in m01:192.168.1.181 m02:192.168.1.184 tp01:192.168.1.188; do
            name="${spec%%:*}"
            ip="${spec#*:}"
            if [ "$ip" = "192.168.1.184" ]; then runner="bash -lc"; else runner="ssh -i /opt/work/testdev_key -o StrictHostKeyChecking=no testdev@$ip"; fi
            $runner 'set -e; command -v iscsiadm >/dev/null; command -v multipath >/dev/null; command -v sg_rtpg >/dev/null; sudo modprobe iscsi_tcp; sudo modprobe dm_multipath; sudo modprobe scsi_dh_alua; test -d /sys/module/iscsi_tcp; test -d /sys/module/dm_multipath; test -d /sys/module/scsi_dh_alua; sudo multipath -t >/tmp/sw-block-multipath-prereq.config.txt 2>&1'
            echo "node=${name} multipath_prereq=pass" >> "$B/multipath-prereq.txt"
          done
          echo multipath_prereq=pass >> "$B/multipath-prereq.txt"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/multipath-prereq.txt"
        pattern: "multipath_prereq=pass"
        save_as: multipath_prereq_count
      - action: assert_greater
        actual: "{{ multipath_prereq_count }}"
        threshold: "0"

  - name: build_and_generate_values
    actions:
      - action: exec
        node: m02
        timeout: 8m
        cmd: "cd {{ product_root }} && SW_BLOCK_IMAGE={{ sw_block_image }} SW_BLOCK_CSI_IMAGE={{ sw_block_csi_image }} SW_BLOCK_IMPORT_K3S=1 SW_BLOCK_IMPORT_K3S_NODES='192.168.1.181,192.168.1.188' SW_BLOCK_IMPORT_K3S_SSH_USER=testdev SW_BLOCK_IMPORT_K3S_SSH_KEY=/opt/work/testdev_key SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/build bash scripts/build-alpha-images.sh {{ product_root }}"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: exec
        node: m02
        timeout: 6m
        cmd: "cd {{ product_root }} && go build -o /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/bin/sw-block ./cmd/sw-block && /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/bin/sw-block ops generate-helm-values --kubeconfig /etc/rancher/k3s/k3s.yaml --out /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/values/values.day1.yaml --image {{ sw_block_image }} --csi-image {{ sw_block_csi_image }} --replication-factor {{ replication_factor }} --ack-profile sync-quorum --stage2-multipath > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/values/generate.stdout.txt && python3 - <<'PY'\nfrom pathlib import Path\np=Path('/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/values/values.day1.yaml')\ns=p.read_text()\ns=s.replace('launcherReplicationAckFlag: false','launcherReplicationAckFlag: true')\np.write_text(s)\nPY"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/values/generate.stdout.txt"
        pattern: "helm_values_status=ok"
        save_as: generator_ok_count
      - action: assert_greater
        actual: "{{ generator_ok_count }}"
        threshold: "0"

  - name: helm_install_stack
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: |
          set -e
          B=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover
          cd {{ product_root }}
          helm lint charts/seaweed-block -f "$B/values/values.day1.yaml" > "$B/install/helm-lint.txt"
          helm install {{ helm_release }} charts/seaweed-block --namespace {{ helm_namespace }} --create-namespace -f "$B/values/values.day1.yaml" --wait --timeout 10m > "$B/install/helm-install.txt"
          kubectl -n {{ helm_namespace }} rollout status deploy/sw-blockmaster --timeout=180s > "$B/install/rollout-blockmaster.txt"
          kubectl -n {{ helm_namespace }} rollout status deploy/sw-block-csi-controller --timeout=180s > "$B/install/rollout-csi-controller.txt"
          kubectl -n {{ helm_namespace }} rollout status ds/sw-block-csi-node --timeout=180s > "$B/install/rollout-csi-node.txt"
          helm get values {{ helm_release }} --namespace {{ helm_namespace }} --all > "$B/install/helm-values.applied.yaml"
          helm get manifest {{ helm_release }} --namespace {{ helm_namespace }} > "$B/install/helm-manifest.yaml"
          kubectl -n {{ helm_namespace }} get pods,deploy,ds,svc -o wide > "$B/install/kube-system.after-install.txt"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/install/helm-install.txt"
        pattern: "STATUS: deployed"
        save_as: helm_deployed_count
      - action: assert_greater
        actual: "{{ helm_deployed_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/install/helm-manifest.yaml"
        pattern: "sw-block:phase27-d8"
        save_as: helm_manifest_phase_image_count
      - action: assert_greater
        actual: "{{ helm_manifest_phase_image_count }}"
        threshold: "0"

  - name: app_spread_mounted_failover
    actions:
      - action: exec
        node: m02
        timeout: 34m
        cmd: "cd {{ product_root }} && bash scripts/run-multi-volume-mounted-failover.sh {{ product_root }}"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/recovery"
        env.SW_BLOCK_MULTI_VOLUME_COUNT: "{{ volume_count }}"
        env.SW_BLOCK_MULTI_VOLUME_RF: "{{ replication_factor }}"
        env.SW_BLOCK_MULTI_VOLUME_APP_NODE: "{{ app_nodes }}"
        env.SW_BLOCK_CLI: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/bin/sw-block"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/recovery/multi-volume-mounted-failover-summary.txt"
        pattern: "^multi_volume_mounted_failover_status=ok$"
        save_as: mounted_failover_ok_count
      - action: assert_greater
        actual: "{{ mounted_failover_ok_count }}"
        threshold: "0"

  - name: app_spread_asserts
    actions:
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/recovery/multi-volume-mounted-failover-summary.txt"
        pattern: "^app_node_distribution_count=3$"
        save_as: app_spread_count
      - action: assert_greater
        actual: "{{ app_spread_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/recovery/multi-volume-mounted-failover-summary.txt"
        pattern: "^recovered_volume_count=3$"
        save_as: recovered_count_ok
      - action: assert_greater
        actual: "{{ recovered_count_ok }}"
        threshold: "0"
      - action: exec
        node: m02
        timeout: 2m
        cmd: "B=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/recovery/failover; grep -q '^writer_node=m01$' \"$B/volume-1/summary.txt\"; grep -q '^writer_node=m02$' \"$B/volume-2/summary.txt\"; grep -q '^writer_node=tp01$' \"$B/volume-3/summary.txt\"; for i in 1 2 3; do S=$B/volume-$i/summary.txt; grep -q '^failover_status=promoted$' \"$S\"; grep -q '^target_recovered=true$' \"$S\"; grep -q '^pod_recreate_used=false$' \"$S\"; grep -q '^rtpg_transition_verified=true$' \"$S\"; grep -q '^old_primary_stale_io_success_count=0$' \"$S\"; done"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

  - name: helm_uninstall_cleanup
    always: true
    actions:
      - action: exec
        node: m02
        timeout: 3m
        cmd: |
          helm status {{ helm_release }} --namespace {{ helm_namespace }} >/dev/null 2>&1 && helm uninstall {{ helm_release }} --namespace {{ helm_namespace }} --wait --timeout 180s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/cleanup/helm-uninstall.txt || true
          kubectl -n default delete pod -l sw-block-test=multi-volume-mounted-failover --ignore-not-found=true --force --grace-period=0 --wait=false
          for i in 1 2 3; do kubectl -n default delete pvc sw-block-multi-mounted-pvc-$i --ignore-not-found=true --wait=false; done
          kubectl delete storageclass sw-block-multi-mounted sw-block-dynamic --ignore-not-found=true --wait=false
          kubectl -n default delete deploy -l app=sw-blockvolume --ignore-not-found=true --wait=false
          for ip in 192.168.1.181 192.168.1.184 192.168.1.188; do
            if [ "$ip" = "192.168.1.184" ]; then runner="bash -lc"; else runner="ssh -i /opt/work/testdev_key -o StrictHostKeyChecking=no testdev@$ip"; fi
            $runner 'sudo -n iscsiadm -m node 2>/dev/null | awk '"'"'/io.seaweedfs/ {print $1, $2}'"'"' | while read portal target; do sudo -n iscsiadm -m node -T "$target" -p "$portal" --logout >/dev/null 2>&1 || true; sudo -n iscsiadm -m node -T "$target" -p "$portal" -o delete >/dev/null 2>&1 || true; done; sudo -n multipath -F >/dev/null 2>&1 || true'
          done
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/cleanup/verify"
        env.SW_BLOCK_HELM_RELEASE: "{{ helm_release }}"
        env.SW_BLOCK_NAMESPACE: "{{ helm_namespace }}"
      - action: exec
        node: m02
        timeout: 3m
        cmd: "cd {{ product_root }} && SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/cleanup/verify SW_BLOCK_HELM_RELEASE={{ helm_release }} SW_BLOCK_NAMESPACE={{ helm_namespace }} bash scripts/verify-helm-cleanup.sh {{ product_root }}"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: assert_no_active_iscsi_sessions
        node: m02
      - action: assert_no_processes
        node: m02
        pattern: "blockmaster,blockvolume,blockcsi,iscsi-target"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-multi-volume-rf3-app-spread-failover/cleanup/verify/cleanup-summary.txt"
        pattern: "^cleanup_status=ok$"
        save_as: helm_cleanup_ok_count
      - action: assert_greater
        actual: "{{ helm_cleanup_ok_count }}"
        threshold: "0"
