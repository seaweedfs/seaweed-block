name: nvme-stage-unstage-residue-chain
timeout: 30m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: pre_clean
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-stage-unstage && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-stage-unstage"

  - name: nvme_stage_unstage
    actions:
      - action: exec
        node: m02
        timeout: 20m
        cmd: "cd {{ product_root }} && bash scripts/run-phase101-nvme-stage-unstage-gate.sh {{ product_root }}"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-stage-unstage/gate"
        env.SW_BLOCK_NVME_STAGE_CYCLES: "3"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-stage-unstage/gate/phase101-nvme-stage-unstage-summary.txt"
        pattern: "^phase101_nvme_stage_unstage_status=ok$"
        save_as: d3_ok
      - action: assert_greater
        actual: "{{ d3_ok }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-stage-unstage/gate/phase101-nvme-stage-unstage-summary.txt"
        pattern: "^cycle_1_connected_path_count=2$"
        save_as: cycle1_connected
      - action: assert_greater
        actual: "{{ cycle1_connected }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-stage-unstage/gate/phase101-nvme-stage-unstage-summary.txt"
        pattern: "^cycle_2_connected_path_count=2$"
        save_as: cycle2_connected
      - action: assert_greater
        actual: "{{ cycle2_connected }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-stage-unstage/gate/phase101-nvme-stage-unstage-summary.txt"
        pattern: "^cycle_3_connected_path_count=2$"
        save_as: cycle3_connected
      - action: assert_greater
        actual: "{{ cycle3_connected }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-stage-unstage/gate/phase101-nvme-stage-unstage-summary.txt"
        pattern: "^cycle_1_disconnected_path_count=0$"
        save_as: cycle1_clean
      - action: assert_greater
        actual: "{{ cycle1_clean }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-stage-unstage/gate/phase101-nvme-stage-unstage-summary.txt"
        pattern: "^cycle_2_disconnected_path_count=0$"
        save_as: cycle2_clean
      - action: assert_greater
        actual: "{{ cycle2_clean }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-stage-unstage/gate/phase101-nvme-stage-unstage-summary.txt"
        pattern: "^cycle_3_disconnected_path_count=0$"
        save_as: cycle3_clean
      - action: assert_greater
        actual: "{{ cycle3_clean }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-stage-unstage/gate/phase101-nvme-stage-unstage-summary.txt"
        pattern: "^final_nvme_residue_count=0$"
        save_as: final_clean
      - action: assert_greater
        actual: "{{ final_clean }}"
        threshold: "0"

  - name: collect_and_cleanup
    always: true
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-stage-unstage"
        name: "remote-phases"
        ignore_error: true
