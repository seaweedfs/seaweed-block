# Runner-native Phase 20 D1 activation chain.
#
# Goal:
#   Prove the documented Day-1 install path as a user-facing product loop:
#     preflight -> build/import -> install -> StorageClass -> readiness summary
#     -> cleanup.
#
# Expected invocation:
#   swblock run \
#     -env product_root=/path/to/seaweed_block/on/m02 \
#     -env ssh_key=/path/to/testdev_key/on/controller \
#     testops/scenarios/activation-day1-install-chain.yaml

name: activation-day1-install-chain
timeout: 18m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: pre_clean
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1 && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/activation /mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/cleanup"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |^blockmaster |^blockvolume |^blockcsi |^iscsi-target "

  - name: activate_alpha_stack
    actions:
      - action: exec
        node: m02
        timeout: 12m
        cmd: "cd {{ product_root }} && bash scripts/activate-k8s-alpha.sh {{ product_root }}"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/activation"
        env.SW_BLOCK_ACTIVATION_IMPORT_K3S: "1"

  - name: activation_asserts
    actions:
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/activation/activation-summary.txt"
        pattern: "^activation_status=ok$"
        save_as: activation_ok_count
      - action: assert_greater
        actual: "{{ activation_ok_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/activation/activation-summary.txt"
        pattern: "^master_ready_replicas=1$"
        save_as: master_ready_count
      - action: assert_greater
        actual: "{{ master_ready_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/activation/activation-summary.txt"
        pattern: "^csi_controller_ready_replicas=1$"
        save_as: csi_controller_ready_count
      - action: assert_greater
        actual: "{{ csi_controller_ready_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/activation/activation-summary.txt"
        pattern: "^csi_node_ready=[1-9][0-9]*/[1-9][0-9]*$"
        save_as: csi_node_ready_count
      - action: assert_greater
        actual: "{{ csi_node_ready_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/activation/activation-summary.txt"
        pattern: "^storageclass=sw-block-dynamic$"
        save_as: storageclass_count
      - action: assert_greater
        actual: "{{ storageclass_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/activation/activation-summary.txt"
        pattern: "^storageclass_provider=block.csi.seaweedfs.com$"
        save_as: storageclass_provider_count
      - action: assert_greater
        actual: "{{ storageclass_provider_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/activation/activation-summary.txt"
        pattern: "^protocol=iscsi$"
        save_as: protocol_count
      - action: assert_greater
        actual: "{{ protocol_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/activation/activation-summary.txt"
        pattern: "^ack_profile=best-effort$"
        save_as: ack_profile_count
      - action: assert_greater
        actual: "{{ ack_profile_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/activation/activation-summary.txt"
        pattern: "next_create_volume=kubectl apply -f examples/kubernetes/basic-app/storageclass-pvc.yaml"
        save_as: next_create_volume_count
      - action: assert_greater
        actual: "{{ next_create_volume_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/activation/activation-summary.txt"
        pattern: "non_claims=alpha_only,no_backup_restore,no_upgrade_safety,no_mutating_dashboard_actions,no_broad_performance_slo"
        save_as: non_claims_count
      - action: assert_greater
        actual: "{{ non_claims_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/activation/readiness.txt"
        pattern: "sw-block-csi-node"
        save_as: readiness_csi_node_count
      - action: assert_greater
        actual: "{{ readiness_csi_node_count }}"
        threshold: "0"

  - name: collect_and_cleanup
    always: true
    actions:
      - action: exec
        node: m02
        timeout: 5m
        cmd: "cd {{ product_root }} && bash scripts/uninstall-k8s-alpha.sh {{ product_root }}"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/cleanup"
        env.SW_BLOCK_UNINSTALL_DELETE_ALL_BLOCKVOLUMES: "1"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |^blockmaster |^blockvolume |^blockcsi |^iscsi-target "
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-activation-day1/cleanup/delete-storageclass.log"
        pattern: "sw-block-dynamic"
        save_as: storageclass_cleanup_count
      - action: assert_greater
        actual: "{{ storageclass_cleanup_count }}"
        threshold: "0"
