# Phase 31 D3: Helm single-node restart persistence gate.
#
# Goal:
#   Prove the smallest Kubernetes user path survives a k3s/product restart when
#   Helm is installed with explicit hostPath restart persistence.
#
# Product boundary:
#   RF=1 / single selected Kubernetes node / loopback iSCSI / pod recreate
#   after restart. This is not an HA, node-loss, or disaster-recovery claim.

name: helm-single-node-restart-persistence-chain
timeout: 30m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"
  helm_release: "sw-block"
  helm_namespace: "kube-system"
  single_node: "m02"
  sw_block_image: "sw-block:local"
  sw_block_csi_image: "sw-block-csi:local"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: pre_clean
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        timeout: 5m
        cmd: "helm status {{ helm_release }} --namespace {{ helm_namespace }} >/dev/null 2>&1 && helm uninstall {{ helm_release }} --namespace {{ helm_namespace }} --wait --timeout 180s || true; kubectl -n default delete pod sw-block-example-reader sw-block-example-writer --ignore-not-found=true --wait=true --timeout=120s; kubectl -n default delete pvc sw-block-example-pvc --ignore-not-found=true --wait=true --timeout=120s; kubectl delete storageclass sw-block-example --ignore-not-found=true --wait=true --timeout=120s; kubectl delete clusterrole/sw-block-csi clusterrolebinding/sw-block-csi --ignore-not-found=true; sudo -n iscsiadm -m node 2>/dev/null | awk '/io.seaweedfs/ {print $1, $2}' | while read portal target; do sudo -n iscsiadm -m node -T \"$target\" -p \"$portal\" -o delete || true; done; sudo -n rm -rf /var/lib/sw-block/testops-{{ run_id }}-restart-persistence; rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/bin /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/values /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/install /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/basic-app /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/restart /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/after-restart /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/cleanup"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |^blockmaster |^blockvolume |^blockcsi |^iscsi-target "

  - name: build_sw_block_cli
    actions:
      - action: exec
        node: m02
        timeout: 5m
        cmd: "cd {{ product_root }} && go build -o /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/bin/sw-block ./cmd/sw-block && /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/bin/sw-block --version > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/bin/sw-block.version.txt"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/bin/sw-block.version.txt"
        pattern: "sw-block"
        save_as: sw_block_version_count
      - action: assert_greater
        actual: "{{ sw_block_version_count }}"
        threshold: "0"

  - name: pin_build_alpha_images
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: "cd {{ product_root }} && bash scripts/build-alpha-images.sh {{ product_root }}"
        env.SW_BLOCK_IMPORT_K3S: "1"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/pin_build"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/pin_build/alpha-images.env"
        pattern: "SW_BLOCK_IMAGE_ID="
        save_as: pin_image_id_count
      - action: assert_greater
        actual: "{{ pin_image_id_count }}"
        threshold: "0"

  - name: generate_restart_values
    actions:
      - action: exec
        node: m02
        timeout: 3m
        cmd: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/bin/sw-block ops generate-helm-values --kubeconfig /etc/rancher/k3s/k3s.yaml --out /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/values/values.restart.yaml --image {{ sw_block_image }} --csi-image {{ sw_block_csi_image }} --target-node {{ single_node }} --node-limit 1 --restart-persistence hostpath --state-hostpath /var/lib/sw-block/testops-{{ run_id }}-restart-persistence > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/values/generate.stdout.txt"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/values/generate.stdout.txt"
        pattern: "^restart_persistence_mode=hostpath$"
        save_as: restart_mode_count
      - action: assert_greater
        actual: "{{ restart_mode_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/values/generate.stdout.txt"
        pattern: "^state_hostpath=/var/lib/sw-block/testops-{{ run_id }}-restart-persistence$"
        save_as: state_hostpath_stdout_count
      - action: assert_greater
        actual: "{{ state_hostpath_stdout_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/values/values.restart.yaml"
        pattern: "stateHostPath: /var/lib/sw-block/testops-{{ run_id }}-restart-persistence"
        save_as: state_hostpath_values_count
      - action: assert_greater
        actual: "{{ state_hostpath_values_count }}"
        threshold: "0"

  - name: helm_install_stack
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: "cd {{ product_root }} && helm lint charts/seaweed-block -f /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/values/values.restart.yaml > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/install/helm-lint.txt && helm template {{ helm_release }} charts/seaweed-block -f /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/values/values.restart.yaml > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/install/helm-template.yaml && grep -q -- '--launcher-state-hostpath=/var/lib/sw-block/testops-{{ run_id }}-restart-persistence' /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/install/helm-template.yaml && helm install {{ helm_release }} charts/seaweed-block --namespace {{ helm_namespace }} --create-namespace -f /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/values/values.restart.yaml --wait --timeout 10m > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/install/helm-install.txt && kubectl -n {{ helm_namespace }} rollout status deploy/sw-blockmaster --timeout=180s && kubectl -n {{ helm_namespace }} rollout status deploy/sw-block-csi-controller --timeout=180s && kubectl -n {{ helm_namespace }} rollout status ds/sw-block-csi-node --timeout=180s && kubectl -n {{ helm_namespace }} get deploy,ds,pods,svc -o wide > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/install/kube-system.after-install.txt"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/install/helm-install.txt"
        pattern: "STATUS: deployed"
        save_as: helm_deployed_count
      - action: assert_greater
        actual: "{{ helm_deployed_count }}"
        threshold: "0"

  - name: first_volume_before_restart
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: "cd {{ product_root }} && bash scripts/run-basic-app-example.sh {{ product_root }}"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/basic-app"
        env.SW_BLOCK_BASIC_APP_CLEANUP: "0"
        env.SW_BLOCK_BASIC_APP_NODE_SELECTOR: "{{ single_node }}"
        env.SW_BLOCK_INSTALL_MODE: "helm-single-node-restart-persistence"
        env.SW_BLOCK_HELM_RELEASE: "{{ helm_release }}"
        env.SW_BLOCK_HELM_NAMESPACE: "{{ helm_namespace }}"
        env.SW_BLOCK_HELM_VALUES_FILE: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/values/values.restart.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/basic-app/first-volume-summary.txt"
        pattern: "^first_volume_status=ok$"
        save_as: first_volume_ok_count
      - action: assert_greater
        actual: "{{ first_volume_ok_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/basic-app/reader.log"
        pattern: "/data/demo.bin: OK"
        save_as: reader_before_restart_count
      - action: assert_greater
        actual: "{{ reader_before_restart_count }}"
        threshold: "0"

  - name: restart_k3s_and_verify
    actions:
      - action: exec
        node: m02
        timeout: 8m
        cmd: "set -e; date -u > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/restart/restart-start.txt; sudo -n systemctl restart k3s; for i in $(seq 1 180); do if sudo -n k3s kubectl get nodes >/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/restart/nodes.wait.txt 2>&1; then break; fi; sleep 2; done; sudo -n chmod 644 /etc/rancher/k3s/k3s.yaml; kubectl wait --for=condition=Ready node/{{ single_node }} --timeout=300s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/restart/wait-node-ready.txt; kubectl -n {{ helm_namespace }} rollout status deploy/sw-blockmaster --timeout=300s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/restart/wait-blockmaster.txt; kubectl -n {{ helm_namespace }} rollout status deploy/sw-block-csi-controller --timeout=300s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/restart/wait-csi-controller.txt; kubectl -n {{ helm_namespace }} rollout status ds/sw-block-csi-node --timeout=300s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/restart/wait-csi-node.txt; for d in $(kubectl -n default get deploy -l app=sw-blockvolume -o name); do kubectl -n default rollout status \"$d\" --timeout=300s; done > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/restart/wait-blockvolumes.txt; kubectl -n {{ helm_namespace }} get pods,deploy,ds,svc -o wide > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/restart/kube-system.after-restart.txt; kubectl -n default get pods,pvc,pv,deploy -o wide > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/restart/default.after-restart.txt"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/restart/wait-blockmaster.txt"
        pattern: "successfully rolled out"
        save_as: blockmaster_restart_ready_count
      - action: assert_greater
        actual: "{{ blockmaster_restart_ready_count }}"
        threshold: "0"

  - name: reader_after_restart
    actions:
      - action: exec
        node: m02
        timeout: 8m
        cmd: "set -e; kubectl -n default delete pod sw-block-example-reader --ignore-not-found=true --wait=true --timeout=120s; kubectl apply -f /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/basic-app/reader-pod.rendered.yaml > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/after-restart/apply-reader-after-restart.log; kubectl -n default wait --for=jsonpath='{.status.phase}'=Succeeded pod/sw-block-example-reader --timeout=240s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/after-restart/wait-reader-after-restart.log; kubectl -n default logs sw-block-example-reader > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/after-restart/reader-after-restart.log; grep -q '/data/demo.bin: OK' /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/after-restart/reader-after-restart.log; port=$(/usr/bin/python3 - <<'PY'\nimport socket\ns=socket.socket(); s.bind(('127.0.0.1',0)); print(s.getsockname()[1]); s.close()\nPY\n); kubectl -n {{ helm_namespace }} port-forward deploy/sw-blockmaster ${port}:9333 > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/after-restart/blockmaster-port-forward.log 2>&1 & pf=$!; trap 'kill $pf >/dev/null 2>&1 || true; wait $pf >/dev/null 2>&1 || true' EXIT; for i in $(seq 1 60); do if (echo >/dev/tcp/127.0.0.1/$port) >/dev/null 2>&1; then break; fi; sleep 1; done; /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/bin/sw-block ops cluster --master-api 127.0.0.1:${port} --timeout 30s -o json > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/after-restart/cluster-after-restart.json; /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/bin/sw-block ops report --master-api 127.0.0.1:${port} --out /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/after-restart/report > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/after-restart/report.stdout.txt"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/after-restart/reader-after-restart.log"
        pattern: "/data/demo.bin: OK"
        save_as: reader_after_restart_count
      - action: assert_greater
        actual: "{{ reader_after_restart_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/after-restart/report/summary.txt"
        pattern: "managed_volume=.*status=ready"
        save_as: managed_volume_ready_count
      - action: assert_greater
        actual: "{{ managed_volume_ready_count }}"
        threshold: "0"

  - name: post_restart_status_convergence
    actions:
      - action: exec
        node: m02
        timeout: 4m
        cmd: |
          set -e
          out=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/after-restart/convergence
          mkdir -p "$out"
          python3 - "$out" <<'PY'
          import json
          import socket
          import subprocess
          import sys
          import time
          from pathlib import Path

          out = Path(sys.argv[1])
          root = Path("/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart")
          sw_block = root / "bin/sw-block"
          summary = root / "basic-app/first-volume-summary.txt"
          volume_id = ""
          for line in summary.read_text(encoding="utf-8").splitlines():
              if line.startswith("volume_id="):
                  volume_id = line.split("=", 1)[1]
                  break
          if not volume_id:
              raise SystemExit("volume_id unavailable")

          def run(*args, **kwargs):
              return subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, **kwargs)

          pods = run(
              "kubectl", "-n", "{{ helm_namespace }}", "get", "pods",
              "-l", "app.kubernetes.io/component=blockmaster",
              "--field-selector=status.phase=Running",
              "-o", "json",
              check=True,
          )
          pod_items = json.loads(pods.stdout).get("items") or []
          if not pod_items:
              pods = run(
                  "kubectl", "-n", "{{ helm_namespace }}", "get", "pods",
                  "--field-selector=status.phase=Running",
                  "-o", "json",
                  check=True,
              )
              pod_items = [
                  item for item in json.loads(pods.stdout).get("items") or []
                  if item.get("metadata", {}).get("name", "").startswith("sw-blockmaster-")
              ]
          ready_pod = ""
          for item in pod_items:
              conditions = {c.get("type"): c.get("status") for c in (item.get("status") or {}).get("conditions") or []}
              if conditions.get("Ready") == "True":
                  ready_pod = item["metadata"]["name"]
                  break
          if not ready_pod:
              raise SystemExit("no Ready blockmaster pod")
          (out / "blockmaster-pod.txt").write_text(ready_pod + "\n", encoding="utf-8")

          sock = socket.socket()
          sock.bind(("127.0.0.1", 0))
          port = sock.getsockname()[1]
          sock.close()
          (out / "port.txt").write_text(str(port) + "\n", encoding="utf-8")

          pf_log = open(out / "blockmaster-port-forward.log", "w", encoding="utf-8")
          pf = subprocess.Popen(
              ["kubectl", "-n", "{{ helm_namespace }}", "port-forward", f"pod/{ready_pod}", f"{port}:9333"],
              stdout=pf_log,
              stderr=subprocess.STDOUT,
              text=True,
          )

          def port_ready():
              try:
                  with socket.create_connection(("127.0.0.1", port), timeout=1):
                      return True
              except OSError:
                  return False

          try:
              deadline = time.time() + 30
              while time.time() < deadline:
                  if pf.poll() is not None:
                      raise SystemExit("port-forward exited early")
                  if port_ready():
                      break
                  time.sleep(0.5)
              else:
                  raise SystemExit("port-forward did not become ready")

              consecutive = 0
              max_consecutive = 0
              observations = []
              final_reason = ""
              for attempt in range(1, 31):
                  report_dir = out / f"report-{attempt:02d}"
                  evidence_dir = out / f"evidence-{attempt:02d}"
                  proc = run(
                      str(sw_block), "ops", "report",
                      "--namespace", "default",
                      "--master", f"127.0.0.1:{port}",
                      "--out", str(report_dir),
                      "--evidence-out", str(evidence_dir),
                      "--timeout", "30s",
                  )
                  (out / f"report-{attempt:02d}.stdout.txt").write_text(proc.stdout, encoding="utf-8")
                  (out / f"report-{attempt:02d}.stderr.txt").write_text(proc.stderr, encoding="utf-8")
                  if proc.returncode != 0:
                      observations.append(f"{attempt}: report_failed rc={proc.returncode}")
                      consecutive = 0
                      time.sleep(3)
                      continue
                  snap = json.loads((report_dir / "operator-snapshot.json").read_text(encoding="utf-8"))
                  vols = snap.get("volumes") or []
                  target = next((v for v in vols if (v.get("status") or {}).get("volume_id") == volume_id), None)
                  if target is None:
                      observations.append(f"{attempt}: volume_missing")
                      consecutive = 0
                      time.sleep(3)
                      continue
                  status = target.get("status") or {}
                  conditions = status.get("conditions") or []
                  ready_true = any(c.get("type") == "Ready" and c.get("status") == "True" for c in conditions)
                  blocked_true = any(c.get("type") == "Blocked" and c.get("status") == "True" for c in conditions)
                  status_value = status.get("status", "")
                  reason = status.get("reason_code", "")
                  final_reason = reason
                  if status_value == "ready" and ready_true and not blocked_true:
                      consecutive += 1
                  else:
                      consecutive = 0
                  max_consecutive = max(max_consecutive, consecutive)
                  observations.append(
                      f"{attempt}: status={status_value} reason={reason} ready_true={str(ready_true).lower()} "
                      f"blocked_true={str(blocked_true).lower()} consecutive_ready={consecutive}"
                  )
                  if consecutive >= 3:
                      break
                  time.sleep(3)

              (out / "observations.txt").write_text("\n".join(observations) + "\n", encoding="utf-8")
              status = "ok" if consecutive >= 3 else "failed"
              with open(out / "convergence-summary.txt", "w", encoding="utf-8") as f:
                  f.write(f"restart_status_convergence={status}\n")
                  f.write(f"volume_id={volume_id}\n")
                  f.write(f"required_consecutive_ready=3\n")
                  f.write(f"max_consecutive_ready={max_consecutive}\n")
                  f.write(f"final_reason={final_reason or 'unknown'}\n")
                  f.write("evidence=observations.txt\n")
              if status != "ok":
                  raise SystemExit("post-restart status did not converge to stable Ready")
          finally:
              pf.terminate()
              try:
                  pf.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  pf.kill()
                  pf.wait(timeout=5)
              pf_log.close()
          PY
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/after-restart/convergence/convergence-summary.txt"
        pattern: "^restart_status_convergence=ok$"
        save_as: restart_convergence_ok_count
      - action: assert_greater
        actual: "{{ restart_convergence_ok_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/after-restart/convergence/convergence-summary.txt"
        pattern: "^max_consecutive_ready=3$"
        save_as: restart_consecutive_ready_count
      - action: assert_greater
        actual: "{{ restart_consecutive_ready_count }}"
        threshold: "0"

  - name: helm_uninstall_cleanup
    always: true
    actions:
      - action: exec
        node: m02
        timeout: 8m
        cmd: "mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/cleanup/diagnostics; kubectl -n {{ helm_namespace }} get pods,deploy,ds,svc -o wide > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/cleanup/diagnostics/kube-system.before-cleanup.txt 2>&1 || true; kubectl -n {{ helm_namespace }} logs deploy/sw-blockmaster --all-containers=true --tail=200 > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/cleanup/diagnostics/blockmaster.before-cleanup.log 2>&1 || true; kubectl -n {{ helm_namespace }} get events --sort-by=.lastTimestamp > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/cleanup/diagnostics/events.before-cleanup.txt 2>&1 || true; helm status {{ helm_release }} --namespace {{ helm_namespace }} >/dev/null 2>&1 && helm uninstall {{ helm_release }} --namespace {{ helm_namespace }} --wait --timeout 300s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/cleanup/helm-uninstall.txt || true; kubectl -n default delete pod sw-block-example-reader sw-block-example-writer --ignore-not-found=true --wait=true --timeout=120s; kubectl -n default delete pvc sw-block-example-pvc --ignore-not-found=true --wait=true --timeout=120s; kubectl delete storageclass sw-block-example --ignore-not-found=true --wait=true --timeout=120s; sudo -n iscsiadm -m node 2>/dev/null | awk '/io.seaweedfs/ {print $1, $2}' | while read portal target; do sudo -n iscsiadm -m node -T \"$target\" -p \"$portal\" -o delete || true; done; sudo -n rm -rf /var/lib/sw-block/testops-{{ run_id }}-restart-persistence; cd {{ product_root }} && bash scripts/verify-helm-cleanup.sh"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/cleanup/verify"
        env.SW_BLOCK_HELM_RELEASE: "{{ helm_release }}"
        env.SW_BLOCK_HELM_NAMESPACE: "{{ helm_namespace }}"
        env.SW_BLOCK_CLEANUP_HOSTPATH_PREFIX: "testops-{{ run_id }}-restart-persistence"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |^blockmaster |^blockvolume |^blockcsi |^iscsi-target "
      - action: exec
        node: m02
        cmd: "test ! -e /var/lib/sw-block/testops-{{ run_id }}-restart-persistence"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart/cleanup/verify/cleanup-summary.txt"
        pattern: "^cleanup_status=ok$"
        save_as: helm_cleanup_ok_count
      - action: assert_greater
        actual: "{{ helm_cleanup_ok_count }}"
        threshold: "0"
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-single-node-restart"
        name: "remote-phases"
        ignore_error: true
