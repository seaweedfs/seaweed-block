name: nvme-tcp-cross-node-multivolume-isolation-chain
timeout: 45m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"
  helm_release: "sw-block"
  helm_namespace: "kube-system"
  volume_count: "2"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: pre_clean
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        timeout: 5m
        cmd: "helm status {{ helm_release }} --namespace {{ helm_namespace }} >/dev/null 2>&1 && helm uninstall {{ helm_release }} --namespace {{ helm_namespace }} --wait --timeout 240s || true; kubectl -n default delete pod -l sw-block-test=multi-volume --ignore-not-found=true --wait=true --timeout=45s || true; for i in 1 2 3; do kubectl -n default delete pod sw-block-multi-writer-$i sw-block-multi-reader-$i --ignore-not-found=true --wait=true --timeout=45s || true; kubectl -n default delete pvc sw-block-multi-pvc-$i --ignore-not-found=true --wait=true --timeout=45s || true; done; kubectl delete storageclass sw-block-multi --ignore-not-found=true --wait=true --timeout=45s || true; sudo -n nvme disconnect-all >/dev/null 2>&1 || true; rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/bin /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/build /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/values /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/install /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/multi-volume /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/asserts /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/cleanup"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

  - name: build_and_import_images
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: "cd {{ product_root }} && if docker image inspect sw-block:local sw-block-csi:local >/dev/null 2>&1; then mkdir -p \"$SW_BLOCK_ARTIFACT_DIR\"; echo \"SW_BLOCK_IMAGE_ID=$(docker image inspect sw-block:local --format '{{.Id}}')\" > \"$SW_BLOCK_ARTIFACT_DIR/alpha-images.env\"; echo \"SW_BLOCK_CSI_IMAGE_ID=$(docker image inspect sw-block-csi:local --format '{{.Id}}')\" >> \"$SW_BLOCK_ARTIFACT_DIR/alpha-images.env\"; echo cached_images=true >> \"$SW_BLOCK_ARTIFACT_DIR/alpha-images.env\"; else bash scripts/build-alpha-images.sh {{ product_root }}; fi"
        env.SW_BLOCK_IMPORT_K3S: "1"
        env.SW_BLOCK_IMPORT_K3S_NODES: "192.168.1.181"
        env.SW_BLOCK_IMPORT_K3S_SSH_USER: "testdev"
        env.SW_BLOCK_IMPORT_K3S_SSH_KEY: "{{ ssh_key }}"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/build"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/build/alpha-images.env"
        pattern: "SW_BLOCK_IMAGE_ID="
        save_as: image_id_count
      - action: assert_greater
        actual: "{{ image_id_count }}"
        threshold: "0"

  - name: generate_values
    actions:
      - action: exec
        node: m02
        timeout: 4m
        cmd: "cd {{ product_root }} && go build -o /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/bin/sw-block ./cmd/sw-block && /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/bin/sw-block ops generate-helm-values --kubeconfig /etc/rancher/k3s/k3s.yaml --out /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/values/values.nvme.yaml --image sw-block:local --csi-image sw-block-csi:local --protocol nvme --node-limit 2 > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/values/generate.stdout.txt && python3 - <<'PY'\nfrom pathlib import Path\nbase=Path('/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume')\nnodes=[]\ncur=None\nfor raw in (base/'values/values.nvme.yaml').read_text().splitlines():\n    line=raw.strip()\n    if line.startswith('- name:'):\n        if cur:\n            nodes.append(cur)\n        cur={}\n    if cur is None:\n        continue\n    if line.startswith('kubernetesNode:'):\n        cur['kubernetesNode']=line.split(':',1)[1].strip().strip('\"')\nif cur:\n    nodes.append(cur)\nif len(nodes) < 2:\n    raise SystemExit('need at least two generated nodes')\n(base/'values/blockvolume-node.txt').write_text(nodes[0]['kubernetesNode']+'\\n')\n(base/'values/app-node.txt').write_text(nodes[1]['kubernetesNode']+'\\n')\nPY"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/values/generate.stdout.txt"
        pattern: "^network_mode=external-nvme$"
        save_as: external_nvme_count
      - action: assert_greater
        actual: "{{ external_nvme_count }}"
        threshold: "0"

  - name: helm_install_stack
    actions:
      - action: exec
        node: m02
        timeout: 12m
        cmd: "cd {{ product_root }} && helm lint charts/seaweed-block -f /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/values/values.nvme.yaml > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/install/helm-lint.txt && helm template {{ helm_release }} charts/seaweed-block --namespace {{ helm_namespace }} -f /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/values/values.nvme.yaml > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/install/helm-template.yaml && grep -q -- '--launcher-external-nvme' /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/install/helm-template.yaml && ! grep -q -- '--launcher-external-iscsi' /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/install/helm-template.yaml && helm install {{ helm_release }} charts/seaweed-block --namespace {{ helm_namespace }} --create-namespace -f /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/values/values.nvme.yaml --wait --timeout 10m > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/install/helm-install.txt && kubectl -n {{ helm_namespace }} get deploy,ds,pods,svc -o wide > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/install/kube-system.after-install.txt"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/install/helm-install.txt"
        pattern: "STATUS: deployed"
        save_as: helm_deployed_count
      - action: assert_greater
        actual: "{{ helm_deployed_count }}"
        threshold: "0"

  - name: multi_volume_user_loop
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: "set -e; APP_NODE=$(cat /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/values/app-node.txt); cd {{ product_root }} && SW_BLOCK_MULTI_VOLUME_NODE_SELECTOR=\"$APP_NODE\" SW_BLOCK_MULTI_VOLUME_PROTOCOL=nvme bash scripts/run-multi-volume-example.sh {{ product_root }}"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/multi-volume"
        env.SW_BLOCK_MULTI_VOLUME_COUNT: "{{ volume_count }}"
        env.SW_BLOCK_MULTI_VOLUME_CLEANUP: "0"
        env.SW_BLOCK_CLI: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/bin/sw-block"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/multi-volume/multi-volume-summary.txt"
        pattern: "^multi_volume_status=ok$"
        save_as: multi_volume_ok
      - action: assert_greater
        actual: "{{ multi_volume_ok }}"
        threshold: "0"

  - name: isolation_asserts
    actions:
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/multi-volume/multi-volume-summary.txt"
        pattern: "^protocol=nvme$"
        save_as: protocol_nvme
      - action: assert_greater
        actual: "{{ protocol_nvme }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/multi-volume/multi-volume-summary.txt"
        pattern: "^writer_verified_count=2$"
        save_as: writer_count_ok
      - action: assert_greater
        actual: "{{ writer_count_ok }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/multi-volume/multi-volume-summary.txt"
        pattern: "^reader_verified_count=2$"
        save_as: reader_count_ok
      - action: assert_greater
        actual: "{{ reader_count_ok }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/multi-volume/multi-volume-summary.txt"
        pattern: "^managed_volume_count=2$"
        save_as: managed_volume_count_ok
      - action: assert_greater
        actual: "{{ managed_volume_count_ok }}"
        threshold: "0"
      - action: exec
        node: m02
        timeout: 2m
        cmd: "python3 - <<'PY'\nfrom pathlib import Path\nimport re\nbase=Path('/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume')\napp_node=(base/'values/app-node.txt').read_text().strip()\nsummary=(base/'multi-volume/status/report/summary.txt').read_text().splitlines()\nmanaged=[line for line in summary if line.startswith('managed_volume=')]\nnvme=[line for line in summary if line.startswith('managed_volume_nvme=')]\nif len(managed) != 2:\n    raise SystemExit(f'managed_volume_count={len(managed)}')\nif len(nvme) != 2:\n    raise SystemExit(f'nvme_line_count={len(nvme)}')\nready=[line for line in managed if ' status=ready ' in line and ' reason=first_volume_verified' in line]\nif len(ready) != 2:\n    raise SystemExit('not all managed volumes are ready/first_volume_verified')\nids=[]\nnqns=[]\naddrs=[]\nfor line in managed:\n    m=re.match(r'managed_volume=([^ ]+)', line)\n    if m:\n        ids.append(m.group(1))\nfor line in nvme:\n    for key, sink in [('nqn', nqns), ('addr', addrs)]:\n        m=re.search(rf' {key}=([^ ]+)', line)\n        if m:\n            sink.append(m.group(1))\nif len(set(ids)) != 2:\n    raise SystemExit(f'volume identity collapsed: {ids}')\nif len(set(nqns)) != 2:\n    raise SystemExit(f'nqn identity collapsed: {nqns}')\nif any(a.startswith('127.') or a.startswith('localhost') for a in addrs):\n    raise SystemExit(f'loopback nvme addr observed: {addrs}')\nif not all(':4420' in a or ':442' in a for a in addrs):\n    raise SystemExit(f'unexpected nvme addrs: {addrs}')\ntext='\\n'.join([\n    'phase107_nvme_tcp_multivolume_isolation_status=ok',\n    f'app_node={app_node}',\n    'protocol=nvme',\n    'managed_volume_count=2',\n    'writer_verified_count=2',\n    'reader_verified_count=2',\n    'managed_volume_status=ready',\n    'managed_volume_reason=first_volume_verified',\n    f'distinct_volume_ids={len(set(ids))}',\n    f'distinct_nvme_nqns={len(set(nqns))}',\n    'publish_target_loopback=false',\n    'cross_volume_identity_mixup=false',\n])+'\\n'\n(base/'asserts/phase107-isolation-summary.txt').write_text(text)\nPY"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/asserts/phase107-isolation-summary.txt"
        pattern: "^phase107_nvme_tcp_multivolume_isolation_status=ok$"
        save_as: isolation_ok
      - action: assert_greater
        actual: "{{ isolation_ok }}"
        threshold: "0"

  - name: helm_uninstall_cleanup
    always: true
    actions:
      - action: exec
        node: m02
        timeout: 3m
        cmd: "helm status {{ helm_release }} --namespace {{ helm_namespace }} >/dev/null 2>&1 && helm uninstall {{ helm_release }} --namespace {{ helm_namespace }} --wait --timeout 45s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume/cleanup/helm-uninstall.txt || true"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: exec
        node: m02
        timeout: 3m
        cmd: "for i in 1 2 3; do kubectl -n default delete pod sw-block-multi-writer-$i sw-block-multi-reader-$i --ignore-not-found=true --wait=true --timeout=45s || true; kubectl -n default delete pvc sw-block-multi-pvc-$i --ignore-not-found=true --wait=true --timeout=45s || true; done; kubectl delete storageclass sw-block-multi --ignore-not-found=true --wait=true --timeout=45s || true"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: exec
        node: m02
        timeout: 1m
        cmd: "kubectl get pv --no-headers | awk '/sw-block-multi/ {print $1}' | xargs -r -n1 kubectl patch pv --type=merge -p '{\"metadata\":{\"finalizers\":[]}}' >/dev/null 2>&1 || true; kubectl get pv --no-headers | awk '/sw-block-multi/ {print $1}' | xargs -r kubectl delete pv --wait=false >/dev/null 2>&1 || true; sudo -n nvme disconnect-all >/dev/null 2>&1 || true"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: exec
        node: m02
        timeout: 1m
        cmd: "sleep 5; kubectl get pv --no-headers | awk '/sw-block-multi/ {print $1}' | xargs -r -n1 kubectl patch pv --type=merge -p '{\"metadata\":{\"finalizers\":[]}}' >/dev/null 2>&1 || true; kubectl get pv --no-headers | awk '/sw-block-multi/ {print $1}' | xargs -r kubectl delete pv --wait=false >/dev/null 2>&1 || true; sudo -n nvme disconnect-all >/dev/null 2>&1 || true"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

  - name: collect
    always: true
    actions:
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase107-nvme-multivolume"
        name: "remote-phases"
        ignore_error: true
