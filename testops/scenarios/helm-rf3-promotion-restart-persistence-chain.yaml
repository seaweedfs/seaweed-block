# Phase 31 D4: RF3 promotion state survives Kubernetes restart.
#
# Goal:
#   Prove that after an RF=3 sync-quorum volume promotes a surviving replica,
#   a k3s/product restart does not resurrect the old primary or roll authority
#   back to the pre-promotion target.
#
# Product boundary:
#   One PVC, RF=3, sync-quorum, CSI/pod recreate recovery after failover, then
#   CSI/pod recreate after k3s restart. This is not backup/restore, returned
#   replica rebuild/failback, or physical host loss.

name: helm-rf3-promotion-restart-persistence-chain
timeout: 44m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"
  helm_release: "sw-block"
  helm_namespace: "kube-system"
  sw_block_image: "sw-block:phase31-d4"
  sw_block_csi_image: "sw-block-csi:phase31-d4"
  volume_count: "1"
  replication_factor: "3"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: pre_clean
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        timeout: 6m
        cmd: "sudo -n chmod 644 /etc/rancher/k3s/k3s.yaml || true; helm status {{ helm_release }} --namespace {{ helm_namespace }} >/dev/null 2>&1 && helm uninstall {{ helm_release }} --namespace {{ helm_namespace }} --wait --timeout 240s || true; kubectl -n default delete pod -l sw-block-test=multi-volume --ignore-not-found=true --wait=true --timeout=120s; kubectl -n default delete pod -l sw-block-test=multi-volume-reattach --ignore-not-found=true --wait=true --timeout=120s; kubectl -n default delete pod sw-block-multi-writer-1 sw-block-multi-reader-1 sw-block-multi-reattach-reader-1 --ignore-not-found=true --wait=true --timeout=120s; kubectl -n default delete pvc sw-block-multi-pvc-1 --ignore-not-found=true --wait=true --timeout=120s; kubectl -n default delete deploy -l app=sw-blockvolume --ignore-not-found=true --wait=true --timeout=180s; kubectl delete storageclass sw-block-multi sw-block-dynamic --ignore-not-found=true --wait=true --timeout=120s; kubectl delete clusterrole/sw-block-csi clusterrolebinding/sw-block-csi --ignore-not-found=true; sudo -n iscsiadm -m node 2>/dev/null | awk '/io.seaweedfs/ {print $1, $2}' | while read portal target; do sudo -n iscsiadm -m node -T \"$target\" -p \"$portal\" -o delete || true; done; sudo -n rm -rf /var/lib/sw-block/testops-{{ run_id }}-rf3-promotion-restart; rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/bin /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/values /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/install /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/recovery /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/restart /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/after-restart /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/cleanup; leftover=$(kubectl -n default get deploy -l app=sw-blockvolume -o name 2>/dev/null || true); if [ -n \"$leftover\" ]; then echo \"$leftover\" > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/pre-clean-blockvolume-leftover.txt; exit 3; fi"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |^blockmaster |^blockvolume |^blockcsi |^iscsi-target "

  - name: build_and_generate_values
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: "cd {{ product_root }} && SW_BLOCK_IMAGE={{ sw_block_image }} SW_BLOCK_CSI_IMAGE={{ sw_block_csi_image }} SW_BLOCK_IMPORT_K3S=1 SW_BLOCK_IMPORT_K3S_NODES='192.168.1.181,192.168.1.188' SW_BLOCK_IMPORT_K3S_SSH_USER=testdev SW_BLOCK_IMPORT_K3S_SSH_KEY=/opt/work/testdev_key SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/build bash scripts/build-alpha-images.sh {{ product_root }}"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: exec
        node: m02
        timeout: 6m
        cmd: "cd {{ product_root }} && go build -o /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/bin/sw-block ./cmd/sw-block && /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/bin/sw-block ops generate-helm-values --kubeconfig /etc/rancher/k3s/k3s.yaml --out /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/values/values.restart.yaml --image {{ sw_block_image }} --csi-image {{ sw_block_csi_image }} --replication-factor {{ replication_factor }} --ack-profile sync-quorum --restart-persistence hostpath --state-hostpath /var/lib/sw-block/testops-{{ run_id }}-rf3-promotion-restart > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/values/generate.stdout.txt && python3 - <<'PY'\nfrom pathlib import Path\np=Path('/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/values/values.restart.yaml')\ns=p.read_text()\ns=s.replace('launcherReplicationAckFlag: false','launcherReplicationAckFlag: true')\np.write_text(s)\nPY"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/values/generate.stdout.txt"
        pattern: "^restart_persistence_mode=hostpath$"
        save_as: restart_mode_count
      - action: assert_greater
        actual: "{{ restart_mode_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/values/values.restart.yaml"
        pattern: "ackProfile: sync-quorum"
        save_as: sync_quorum_values_count
      - action: assert_greater
        actual: "{{ sync_quorum_values_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/values/values.restart.yaml"
        pattern: "launcherReplicationAckFlag: true"
        save_as: ack_flag_values_count
      - action: assert_greater
        actual: "{{ ack_flag_values_count }}"
        threshold: "0"

  - name: helm_install_stack
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: "cd {{ product_root }} && helm lint charts/seaweed-block -f /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/values/values.restart.yaml > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/install/helm-lint.txt && helm template {{ helm_release }} charts/seaweed-block -f /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/values/values.restart.yaml > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/install/helm-template.yaml && grep -q -- '--launcher-state-hostpath=/var/lib/sw-block/testops-{{ run_id }}-rf3-promotion-restart' /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/install/helm-template.yaml && grep -q -- '--launcher-replication-ack=sync-quorum' /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/install/helm-template.yaml && helm install {{ helm_release }} charts/seaweed-block --namespace {{ helm_namespace }} --create-namespace -f /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/values/values.restart.yaml --wait --timeout 10m > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/install/helm-install.txt"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/install/helm-install.txt"
        pattern: "STATUS: deployed"
        save_as: helm_deployed_count
      - action: assert_greater
        actual: "{{ helm_deployed_count }}"
        threshold: "0"

  - name: promote_and_reattach
    actions:
      - action: exec
        node: m02
        timeout: 22m
        cmd: "cd {{ product_root }} && bash scripts/run-multi-volume-reattach-recovery.sh {{ product_root }}"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/recovery"
        env.SW_BLOCK_MULTI_VOLUME_COUNT: "{{ volume_count }}"
        env.SW_BLOCK_MULTI_VOLUME_RF: "{{ replication_factor }}"
        env.SW_BLOCK_CLI: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/bin/sw-block"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/recovery/multi-volume-reattach-summary.txt"
        pattern: "^multi_volume_reattach_status=ok$"
        save_as: recovery_ok_count
      - action: assert_greater
        actual: "{{ recovery_ok_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/recovery/failover/volume-1/summary.txt"
        pattern: "^failover_status=promoted$"
        save_as: promoted_count
      - action: assert_greater
        actual: "{{ promoted_count }}"
        threshold: "0"

  - name: restart_k3s_and_verify_authority
    actions:
      - action: exec
        node: m02
        timeout: 9m
        cmd: |
          set -e
          out=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/restart
          date -u > "$out/restart-start.txt"
          sudo -n systemctl restart k3s
          for i in $(seq 1 180); do
            if sudo -n k3s kubectl get nodes > "$out/nodes.wait.txt" 2>&1; then break; fi
            sleep 2
          done
          sudo -n chmod 644 /etc/rancher/k3s/k3s.yaml
          kubectl wait --for=condition=Ready node/m02 --timeout=300s > "$out/wait-node-ready.txt"
          kubectl -n {{ helm_namespace }} rollout status deploy/sw-blockmaster --timeout=300s > "$out/wait-blockmaster.txt"
          kubectl -n {{ helm_namespace }} rollout status deploy/sw-block-csi-controller --timeout=300s > "$out/wait-csi-controller.txt"
          kubectl -n {{ helm_namespace }} rollout status ds/sw-block-csi-node --timeout=300s > "$out/wait-csi-node.txt"
          for d in $(kubectl -n default get deploy -l app=sw-blockvolume -o name); do
            kubectl -n default rollout status "$d" --timeout=300s
          done > "$out/wait-blockvolumes.txt"
          port=$(/usr/bin/python3 - <<'PY'
          import socket
          s=socket.socket(); s.bind(('127.0.0.1',0)); print(s.getsockname()[1]); s.close()
          PY
          )
          pf=''
          cluster_ready=false
          for attempt in $(seq 1 10); do
            pod=$(kubectl -n {{ helm_namespace }} get pods -l app.kubernetes.io/component=blockmaster --field-selector=status.phase=Running -o name 2>/dev/null | head -1 || true)
            if [ -z "$pod" ]; then
              pod=$(kubectl -n {{ helm_namespace }} get pods -o name 2>/dev/null | grep '/sw-blockmaster-' | head -1 || true)
            fi
            if [ -z "$pod" ]; then sleep 2; continue; fi
            echo "$pod" > "$out/blockmaster-port-forward-pod.txt"
            kubectl -n {{ helm_namespace }} wait --for=condition=Ready "$pod" --timeout=30s >> "$out/wait-blockmaster-pod.txt" 2>&1 || { sleep 2; continue; }
            kubectl -n {{ helm_namespace }} port-forward "$pod" "${port}:9333" > "$out/blockmaster-port-forward.log" 2>&1 &
            pf=$!
            sleep 2
            if /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/bin/sw-block ops cluster --master-api "127.0.0.1:${port}" --timeout 30s -o json > "$out/cluster-after-restart.json.tmp" 2> "$out/cluster-after-restart.stderr.txt"; then
              mv "$out/cluster-after-restart.json.tmp" "$out/cluster-after-restart.json"
              cluster_ready=true
              break
            fi
            kill "$pf" >/dev/null 2>&1 || true
            wait "$pf" >/dev/null 2>&1 || true
            sleep 2
          done
          test "$cluster_ready" = true
          trap 'kill "$pf" >/dev/null 2>&1 || true; wait "$pf" >/dev/null 2>&1 || true' EXIT
          python3 - /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/recovery/failover/volume-1/summary.txt /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/recovery/failover/volume-1/after.json "$out/cluster-after-restart.json" "$out/restart-promotion-summary.txt" <<'PY'
          import json, sys
          summary_path, before_json, after_json, out_path = sys.argv[1:]
          summary = {}
          for line in open(summary_path, encoding='utf-8'):
              if '=' in line:
                  k, v = line.strip().split('=', 1)
                  summary[k] = v
          volume_id = summary['volume_id']
          promoted = summary['promoted_replica']
          target = summary['after_publish_target']
          before = json.load(open(before_json))
          after = json.load(open(after_json))
          def find(doc):
              for v in doc.get('volumes', []):
                  if v.get('volume_id') == volume_id:
                      return v
              raise SystemExit('volume_not_found')
          b = find(before)
          a = find(after)
          before_epoch = int(b.get('epoch') or b.get('authority_epoch') or 0)
          after_epoch = int(a.get('epoch') or a.get('authority_epoch') or 0)
          primary_count = sum(1 for r in a.get('replicas', []) if r.get('role') == 'primary')
          status = 'ok'
          reasons = []
          if a.get('primary_replica') != promoted:
              status = 'failed'; reasons.append('primary_rolled_back')
          if a.get('publish_target') != target:
              status = 'failed'; reasons.append('publish_target_changed')
          if after_epoch < before_epoch:
              status = 'failed'; reasons.append('epoch_rolled_back')
          if primary_count != 1:
              status = 'failed'; reasons.append('primary_count_not_one')
          with open(out_path, 'w', encoding='utf-8') as f:
              f.write(f'restart_promotion_status={status}\n')
              f.write(f'volume_id={volume_id}\n')
              f.write(f'before_restart_primary={promoted}\n')
              f.write(f'after_restart_primary={a.get("primary_replica", "")}\n')
              f.write(f'before_restart_publish_target={target}\n')
              f.write(f'after_restart_publish_target={a.get("publish_target", "")}\n')
              f.write(f'before_restart_epoch={before_epoch}\n')
              f.write(f'after_restart_epoch={after_epoch}\n')
              f.write(f'post_restart_primary_count={primary_count}\n')
              f.write(f'reason={",".join(reasons) if reasons else "authority_persisted"}\n')
          if status != 'ok':
              raise SystemExit(','.join(reasons))
          PY
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/restart/restart-promotion-summary.txt"
        pattern: "^restart_promotion_status=ok$"
        save_as: restart_promotion_ok_count
      - action: assert_greater
        actual: "{{ restart_promotion_ok_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/restart/restart-promotion-summary.txt"
        pattern: "^reason=authority_persisted$"
        save_as: authority_persisted_count
      - action: assert_greater
        actual: "{{ authority_persisted_count }}"
        threshold: "0"

  - name: reader_after_restart
    actions:
      - action: exec
        node: m02
        timeout: 8m
        cmd: "set -e; kubectl -n default delete pod sw-block-multi-reattach-reader-1 --ignore-not-found=true --wait=true --timeout=120s; kubectl apply -f /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/recovery/manifests/sw-block-multi-reattach-reader-1.yaml > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/after-restart/apply-reader-after-restart.log; kubectl -n default wait --for=jsonpath='{.status.phase}'=Succeeded pod/sw-block-multi-reattach-reader-1 --timeout=240s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/after-restart/wait-reader-after-restart.log; kubectl -n default logs sw-block-multi-reattach-reader-1 > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/after-restart/reader-after-restart.log; grep -q '/data/demo.bin: OK' /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/after-restart/reader-after-restart.log"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/after-restart/reader-after-restart.log"
        pattern: "/data/demo.bin: OK"
        save_as: reader_after_restart_count
      - action: assert_greater
        actual: "{{ reader_after_restart_count }}"
        threshold: "0"

  - name: post_restart_degraded_status_boundary
    actions:
      - action: exec
        node: m02
        timeout: 4m
        cmd: |
          set -e
          out=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/after-restart/convergence
          mkdir -p "$out"
          python3 - "$out" <<'PY'
          import json
          import socket
          import subprocess
          import sys
          import time
          from pathlib import Path

          out = Path(sys.argv[1])
          root = Path("/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart")
          sw_block = root / "bin/sw-block"
          restart_summary = root / "restart/restart-promotion-summary.txt"
          volume_id = ""
          for line in restart_summary.read_text(encoding="utf-8").splitlines():
              if line.startswith("volume_id="):
                  volume_id = line.split("=", 1)[1]
                  break
          if not volume_id:
              raise SystemExit("volume_id unavailable")

          def run(*args, **kwargs):
              return subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, **kwargs)

          pods = run(
              "kubectl", "-n", "{{ helm_namespace }}", "get", "pods",
              "-l", "app.kubernetes.io/component=blockmaster",
              "--field-selector=status.phase=Running",
              "-o", "json",
              check=True,
          )
          pod_items = json.loads(pods.stdout).get("items") or []
          if not pod_items:
              pods = run(
                  "kubectl", "-n", "{{ helm_namespace }}", "get", "pods",
                  "--field-selector=status.phase=Running",
                  "-o", "json",
                  check=True,
              )
              pod_items = [
                  item for item in json.loads(pods.stdout).get("items") or []
                  if item.get("metadata", {}).get("name", "").startswith("sw-blockmaster-")
              ]
          ready_pod = ""
          for item in pod_items:
              conditions = {c.get("type"): c.get("status") for c in (item.get("status") or {}).get("conditions") or []}
              if conditions.get("Ready") == "True":
                  ready_pod = item["metadata"]["name"]
                  break
          if not ready_pod:
              raise SystemExit("no Ready blockmaster pod")
          (out / "blockmaster-pod.txt").write_text(ready_pod + "\n", encoding="utf-8")

          sock = socket.socket()
          sock.bind(("127.0.0.1", 0))
          port = sock.getsockname()[1]
          sock.close()
          (out / "port.txt").write_text(str(port) + "\n", encoding="utf-8")

          pf_log = open(out / "blockmaster-port-forward.log", "w", encoding="utf-8")
          pf = subprocess.Popen(
              ["kubectl", "-n", "{{ helm_namespace }}", "port-forward", f"pod/{ready_pod}", f"{port}:9333"],
              stdout=pf_log,
              stderr=subprocess.STDOUT,
              text=True,
          )

          def port_ready():
              try:
                  with socket.create_connection(("127.0.0.1", port), timeout=1):
                      return True
              except OSError:
                  return False

          try:
              deadline = time.time() + 30
              while time.time() < deadline:
                  if pf.poll() is not None:
                      raise SystemExit("port-forward exited early")
                  if port_ready():
                      break
                  time.sleep(0.5)
              else:
                  raise SystemExit("port-forward did not become ready")

              consecutive = 0
              max_consecutive = 0
              observations = []
              final_reason = ""
              for attempt in range(1, 31):
                  report_dir = out / f"report-{attempt:02d}"
                  evidence_dir = out / f"evidence-{attempt:02d}"
                  cmd = [
                      str(sw_block), "ops", "report",
                      "--namespace", "default",
                      "--master", f"127.0.0.1:{port}",
                      "--out", str(report_dir),
                      "--evidence-out", str(evidence_dir),
                      "--timeout", "30s",
                  ]
                  proc = run(*cmd)
                  (out / f"report-{attempt:02d}.stdout.txt").write_text(proc.stdout, encoding="utf-8")
                  (out / f"report-{attempt:02d}.stderr.txt").write_text(proc.stderr, encoding="utf-8")
                  if proc.returncode != 0:
                      observations.append(f"{attempt}: report_failed rc={proc.returncode}")
                      consecutive = 0
                      time.sleep(3)
                      continue
                  snap_path = report_dir / "operator-snapshot.json"
                  snap = json.loads(snap_path.read_text(encoding="utf-8"))
                  vols = snap.get("volumes") or []
                  target = next((v for v in vols if (v.get("status") or {}).get("volume_id") == volume_id), None)
                  if target is None:
                      observations.append(f"{attempt}: volume_missing")
                      consecutive = 0
                      time.sleep(3)
                      continue
                  status = target.get("status") or {}
                  conditions = status.get("conditions") or []
                  ready_true = any(c.get("type") == "Ready" and c.get("status") == "True" for c in conditions)
                  blocked_true = any(c.get("type") == "Blocked" and c.get("status") == "True" for c in conditions)
                  status_value = status.get("status", "")
                  reason = status.get("reason_code", "")
                  final_reason = reason
                  stable_degraded_unknown = status_value == "unknown" and reason == "status_endpoint_unreachable"
                  stable_ready = status_value == "ready" and ready_true
                  if (stable_ready or stable_degraded_unknown) and not blocked_true:
                      consecutive += 1
                  else:
                      consecutive = 0
                  max_consecutive = max(max_consecutive, consecutive)
                  observations.append(
                      f"{attempt}: status={status_value} reason={reason} ready_true={str(ready_true).lower()} "
                      f"blocked_true={str(blocked_true).lower()} consecutive_stable={consecutive}"
                  )
                  if consecutive >= 3:
                      break
                  time.sleep(3)

              (out / "observations.txt").write_text("\n".join(observations) + "\n", encoding="utf-8")
              status = "ok" if consecutive >= 3 else "failed"
              with open(out / "convergence-summary.txt", "w", encoding="utf-8") as f:
                  f.write(f"restart_status_boundary={status}\n")
                  f.write(f"volume_id={volume_id}\n")
                  f.write(f"required_consecutive_stable=3\n")
                  f.write(f"max_consecutive_stable={max_consecutive}\n")
                  f.write(f"final_reason={final_reason or 'unknown'}\n")
                  f.write("evidence=observations.txt\n")
              if status != "ok":
                  raise SystemExit("post-restart status did not reach a stable safe surface")
          finally:
              pf.terminate()
              try:
                  pf.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  pf.kill()
                  pf.wait(timeout=5)
              pf_log.close()
          PY
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/after-restart/convergence/convergence-summary.txt"
        pattern: "^restart_status_boundary=ok$"
        save_as: restart_status_boundary_ok_count
      - action: assert_greater
        actual: "{{ restart_status_boundary_ok_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/after-restart/convergence/convergence-summary.txt"
        pattern: "^max_consecutive_stable=3$"
        save_as: restart_consecutive_stable_count
      - action: assert_greater
        actual: "{{ restart_consecutive_stable_count }}"
        threshold: "0"

  - name: helm_uninstall_cleanup
    always: true
    actions:
      - action: exec
        node: m02
        timeout: 9m
        cmd: "mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/cleanup/diagnostics; kubectl -n {{ helm_namespace }} get pods,deploy,ds,svc -o wide > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/cleanup/diagnostics/kube-system.before-cleanup.txt 2>&1 || true; helm status {{ helm_release }} --namespace {{ helm_namespace }} >/dev/null 2>&1 && helm uninstall {{ helm_release }} --namespace {{ helm_namespace }} --wait --timeout 300s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/cleanup/helm-uninstall.txt || true; kubectl -n default delete pod -l sw-block-test=multi-volume --ignore-not-found=true --wait=true --timeout=120s; kubectl -n default delete pod -l sw-block-test=multi-volume-reattach --ignore-not-found=true --wait=true --timeout=120s; kubectl -n default delete pod sw-block-multi-writer-1 sw-block-multi-reader-1 sw-block-multi-reattach-reader-1 --ignore-not-found=true --wait=true --timeout=120s; kubectl -n default delete pvc sw-block-multi-pvc-1 --ignore-not-found=true --wait=true --timeout=120s; kubectl delete storageclass sw-block-multi sw-block-dynamic --ignore-not-found=true --wait=true --timeout=120s; sudo -n iscsiadm -m node 2>/dev/null | awk '/io.seaweedfs/ {print $1, $2}' | while read portal target; do sudo -n iscsiadm -m node -T \"$target\" -p \"$portal\" -o delete || true; done; sudo -n rm -rf /var/lib/sw-block/testops-{{ run_id }}-rf3-promotion-restart; cd {{ product_root }} && bash scripts/verify-helm-cleanup.sh"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/cleanup/verify"
        env.SW_BLOCK_HELM_RELEASE: "{{ helm_release }}"
        env.SW_BLOCK_HELM_NAMESPACE: "{{ helm_namespace }}"
        env.SW_BLOCK_CLEANUP_HOSTPATH_PREFIX: "testops-{{ run_id }}-rf3-promotion-restart"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |^blockmaster |^blockvolume |^blockcsi |^iscsi-target "
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart/cleanup/verify/cleanup-summary.txt"
        pattern: "^cleanup_status=ok$"
        save_as: helm_cleanup_ok_count
      - action: assert_greater
        actual: "{{ helm_cleanup_ok_count }}"
        threshold: "0"
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-rf3-promotion-restart"
        name: "remote-phases"
        ignore_error: true
