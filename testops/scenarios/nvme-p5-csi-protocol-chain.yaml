# Runner-native V3 NVMe-P5 protocol propagation chain.
#
# This scenario intentionally keeps product test logic in the existing bash
# payloads, but moves orchestration to sw-test-runner:
#   clean target -> build/import alpha images -> run NVMe PVC -> run iSCSI
#   regression -> assert cleanup -> collect remote artifacts.
#
# Expected invocation from sw-test-runner-standalone:
#   swblock run testops/scenarios/nvme-p5-csi-protocol-chain.yaml \
#     --env product_root=/path/to/seaweed_block/on/m02

name: nvme-p5-csi-protocol-chain
timeout: 25m

env:
  product_root: "/tmp/seaweed_block"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: /c/work/dev_server/testdev_key

phases:
  - name: pre_clean
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-nvme-p5-chain && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-nvme-p5-chain"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[b]lockmaster|[b]lockvolume"

  - name: pin_build_alpha_images
    actions:
      - action: exec
        node: m02
        timeout: 8m
        cmd: "cd {{ product_root }} && bash scripts/build-alpha-images.sh {{ product_root }}"
        env.SW_BLOCK_IMPORT_K3S: "1"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-nvme-p5-chain/pin_build"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-nvme-p5-chain/pin_build/alpha-images.env"
        pattern: "GIT_DIRTY=false"
        save_as: pin_clean_count
      - action: assert_greater
        actual: "{{ pin_clean_count }}"
        threshold: "0"

  - name: nvme_dynamic_pvc
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: "cd {{ product_root }} && bash scripts/run-k8s-alpha-nvme.sh {{ product_root }}"
        env.SW_BLOCK_ALPHA_IMAGES_ENV: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-nvme-p5-chain/pin_build/alpha-images.env"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-nvme-p5-chain/nvme_dynamic_pvc"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-nvme-p5-chain/nvme_dynamic_pvc/run.log"
        pattern: "\\[alpha-nvme\\] PASS:"
        save_as: nvme_pass_count
      - action: assert_greater
        actual: "{{ nvme_pass_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-nvme-p5-chain/nvme_dynamic_pvc/generated-blockvolume.yaml"
        pattern: "--nvme-listen="
        save_as: nvme_arg_count
      - action: assert_greater
        actual: "{{ nvme_arg_count }}"
        threshold: "0"

  - name: default_iscsi_regression
    actions:
      - action: exec
        node: m02
        timeout: 8m
        cmd: "cd {{ product_root }} && bash scripts/run-k8s-alpha.sh {{ product_root }}"
        env.SW_BLOCK_ALPHA_IMAGES_ENV: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-nvme-p5-chain/pin_build/alpha-images.env"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-nvme-p5-chain/default_iscsi_regression"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-nvme-p5-chain/default_iscsi_regression/run.log"
        pattern: "\\[alpha\\] PASS:"
        save_as: iscsi_pass_count
      - action: assert_greater
        actual: "{{ iscsi_pass_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-nvme-p5-chain/default_iscsi_regression/generated-blockvolume.yaml"
        pattern: "--iscsi-listen="
        save_as: iscsi_arg_count
      - action: assert_greater
        actual: "{{ iscsi_arg_count }}"
        threshold: "0"

  - name: final_asserts
    actions:
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[b]lockmaster|[b]lockvolume"

  - name: collect_and_cleanup
    always: true
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-nvme-p5-chain"
        name: "remote-phases"
        ignore_error: true
