# Runner-native Phase 74 gate: returned-replica failback is explicit,
# evidence-gated, and still disabled until a real authority owner exists.

name: returned-replica-failback-contract-chain
timeout: 8m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: returned_replica_failback_contract_gate
    actions:
      - action: exec
        node: m02
        timeout: 7m
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase74-returned-replica-failback-contract && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase74-returned-replica-failback-contract && cd {{ product_root }} && SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase74-returned-replica-failback-contract bash scripts/run-phase74-returned-replica-failback-contract-gate.sh {{ product_root }}"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase74-returned-replica-failback-contract/phase74-returned-replica-failback-contract-summary.txt"
        pattern: "^phase74_returned_replica_failback_contract_status=ok$"
        save_as: phase74_ok
      - action: assert_greater
        actual: "{{ phase74_ok }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase74-returned-replica-failback-contract/phase74-returned-replica-failback-contract-summary.txt"
        pattern: "^failback_contract_disabled=true$"
        save_as: failback_contract_disabled
      - action: assert_greater
        actual: "{{ failback_contract_disabled }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase74-returned-replica-failback-contract/phase74-returned-replica-failback-contract-summary.txt"
        pattern: "^failback_allowed_mutation_class=failback$"
        save_as: failback_class
      - action: assert_greater
        actual: "{{ failback_class }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase74-returned-replica-failback-contract/phase74-returned-replica-failback-contract-summary.txt"
        pattern: "^failback_mutation_allowed=false$"
        save_as: failback_no_mutation
      - action: assert_greater
        actual: "{{ failback_no_mutation }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase74-returned-replica-failback-contract/phase74-returned-replica-failback-contract-summary.txt"
        pattern: "^frontend_publication_attempts=0$"
        save_as: no_frontend_publication
      - action: assert_greater
        actual: "{{ no_frontend_publication }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase74-returned-replica-failback-contract/phase74-returned-replica-failback-contract-summary.txt"
        pattern: "^ack_eligibility_contract_preserved=true$"
        save_as: ack_contract_preserved
      - action: assert_greater
        actual: "{{ ack_contract_preserved }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase74-returned-replica-failback-contract/phase74-returned-replica-failback-contract-summary.txt"
        pattern: "^rebuild_contract_preserved=true$"
        save_as: rebuild_contract_preserved
      - action: assert_greater
        actual: "{{ rebuild_contract_preserved }}"
        threshold: "0"

  - name: collect
    always: true
    actions:
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase74-returned-replica-failback-contract"
        name: "remote-phases"
        ignore_error: true
