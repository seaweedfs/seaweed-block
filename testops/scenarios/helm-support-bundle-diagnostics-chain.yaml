# Runner-native Phase 26 D4 gate: Helm support bundle diagnostics.
#
# Goal:
#   Prove a Helm-installed first-volume run produces a cold, read-only support
#   bundle that can be consumed later by sw-block ops report/explain/timeline.
#   Also prove a blocked ImagePullBackOff bundle explains itself without a live
#   cluster.

name: helm-support-bundle-diagnostics-chain
timeout: 30m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"
  helm_release: "sw-block"
  helm_namespace: "kube-system"
  sw_block_image: "sw-block:phase26-d4"
  sw_block_csi_image: "sw-block-csi:phase26-d4"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: pre_clean
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        timeout: 5m
        cmd: "helm status {{ helm_release }} --namespace {{ helm_namespace }} >/dev/null 2>&1 && helm uninstall {{ helm_release }} --namespace {{ helm_namespace }} --wait --timeout 180s || true; kubectl -n default delete pod sw-block-example-reader sw-block-example-writer --ignore-not-found=true --wait=true --timeout=120s; kubectl -n default delete pvc sw-block-example-pvc --ignore-not-found=true --wait=true --timeout=120s; kubectl delete storageclass sw-block-example sw-block-dynamic --ignore-not-found=true --wait=true --timeout=120s; kubectl delete clusterrole/sw-block-csi clusterrolebinding/sw-block-csi --ignore-not-found=true; sudo -n iscsiadm -m node 2>/dev/null | awk '/io.seaweedfs/ {print $1, $2}' | while read portal target; do sudo -n iscsiadm -m node -T \"$target\" -p \"$portal\" -o delete || true; done; rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/bin /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/values /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/install /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/basic-app /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/blocked-bundle/demo /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/cleanup"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"

  - name: build_and_generate_values
    actions:
      - action: exec
        node: m02
        timeout: 8m
        cmd: "cd {{ product_root }} && SW_BLOCK_IMAGE={{ sw_block_image }} SW_BLOCK_CSI_IMAGE={{ sw_block_csi_image }} SW_BLOCK_IMPORT_K3S=1 SW_BLOCK_IMPORT_K3S_NODES='192.168.1.181,192.168.1.188' SW_BLOCK_IMPORT_K3S_SSH_USER=testdev SW_BLOCK_IMPORT_K3S_SSH_KEY=/opt/work/testdev_key SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/build bash scripts/build-alpha-images.sh {{ product_root }}"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/build/alpha-images.env"
        pattern: "SW_BLOCK_IMAGE={{ sw_block_image }}"
        save_as: local_image_built_count
      - action: assert_greater
        actual: "{{ local_image_built_count }}"
        threshold: "0"
      - action: exec
        node: m02
        timeout: 6m
        cmd: "cd {{ product_root }} && go build -o /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/bin/sw-block ./cmd/sw-block && /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/bin/sw-block ops generate-helm-values --kubeconfig /etc/rancher/k3s/k3s.yaml --out /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/values/values.day1.yaml --image {{ sw_block_image }} --csi-image {{ sw_block_csi_image }} > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/values/generate.stdout.txt"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/values/generate.stdout.txt"
        pattern: "helm_values_status=ok"
        save_as: generator_ok_count
      - action: assert_greater
        actual: "{{ generator_ok_count }}"
        threshold: "0"

  - name: helm_install_stack
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: "cd {{ product_root }} && helm install {{ helm_release }} charts/seaweed-block --namespace {{ helm_namespace }} --create-namespace -f /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/values/values.day1.yaml --wait --timeout 10m > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/install/helm-install.txt && kubectl -n {{ helm_namespace }} get deploy,ds,pods,svc -o wide > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/install/kube-system.after-install.txt"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/install/helm-install.txt"
        pattern: "STATUS: deployed"
        save_as: helm_deployed_count
      - action: assert_greater
        actual: "{{ helm_deployed_count }}"
        threshold: "0"

  - name: first_volume_kept_for_bundle
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: "cd {{ product_root }} && bash scripts/run-basic-app-example.sh {{ product_root }}"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/basic-app"
        env.SW_BLOCK_BASIC_APP_CLEANUP: "0"
        env.SW_BLOCK_INSTALL_MODE: "helm"
        env.SW_BLOCK_HELM_RELEASE: "{{ helm_release }}"
        env.SW_BLOCK_HELM_NAMESPACE: "{{ helm_namespace }}"
        env.SW_BLOCK_HELM_VALUES_FILE: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/values/values.day1.yaml"
        env.SW_BLOCK_CLI: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/bin/sw-block"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/basic-app/first-volume-summary.txt"
        pattern: "^first_volume_status=ok$"
        save_as: first_volume_ok_count
      - action: assert_greater
        actual: "{{ first_volume_ok_count }}"
        threshold: "0"

  - name: collect_support_bundle
    actions:
      - action: exec
        node: m02
        timeout: 5m
        cmd: "cd {{ product_root }} && bash scripts/collect-helm-support-bundle.sh {{ product_root }}"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
        env.SW_BLOCK_SUPPORT_BUNDLE_SOURCE: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/basic-app"
        env.SW_BLOCK_SUPPORT_BUNDLE_OUT: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/basic-app/support-bundle"
        env.SW_BLOCK_HELM_RELEASE: "{{ helm_release }}"
        env.SW_BLOCK_HELM_NAMESPACE: "{{ helm_namespace }}"
        env.SW_BLOCK_CLI: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/bin/sw-block"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/basic-app/support-bundle/support-bundle-summary.txt"
        pattern: "^support_bundle_status=ok$"
        save_as: support_bundle_ok_count
      - action: assert_greater
        actual: "{{ support_bundle_ok_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/basic-app/support-bundle/support-bundle-summary.txt"
        pattern: "^read_only=true$"
        save_as: support_bundle_readonly_count
      - action: assert_greater
        actual: "{{ support_bundle_readonly_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/basic-app/support-bundle/replayed-report/summary.txt"
        pattern: "^status=ok$"
        save_as: replayed_report_ok_count
      - action: assert_greater
        actual: "{{ replayed_report_ok_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/basic-app/support-bundle/explain.txt"
        pattern: "managed_volume "
        save_as: explain_managed_count
      - action: assert_greater
        actual: "{{ explain_managed_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/basic-app/support-bundle/helm/status.txt"
        pattern: "STATUS: deployed"
        save_as: helm_status_bundle_count
      - action: assert_greater
        actual: "{{ helm_status_bundle_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/basic-app/support-bundle/k8s/pods.txt"
        pattern: "sw-block"
        save_as: k8s_pods_bundle_count
      - action: assert_greater
        actual: "{{ k8s_pods_bundle_count }}"
        threshold: "0"

  - name: blocked_bundle_asserts
    actions:
      - action: exec
        node: m02
        timeout: 2m
        cmd: "cat > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/blocked-bundle/demo/kube-system-pods-deploys.txt <<'EOF'\nNAME READY STATUS RESTARTS AGE IP NODE\npod/sw-block-csi-node-n948t 0/2 ImagePullBackOff 0 2m3s 192.168.1.184 m02\ndeployment.apps/sw-block-csi-controller 1/1 1 1 2m3s block-csi sw-block-csi:local\nEOF\n/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/bin/sw-block ops explain volume --from-bundle /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/blocked-bundle pvc-blocked > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/blocked-bundle/explain.txt"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/blocked-bundle/explain.txt"
        pattern: "reason=csi_node_image_pull_failed"
        save_as: blocked_reason_count
      - action: assert_greater
        actual: "{{ blocked_reason_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/blocked-bundle/explain.txt"
        pattern: "ImagePullBackOff"
        save_as: blocked_image_pull_count
      - action: assert_greater
        actual: "{{ blocked_image_pull_count }}"
        threshold: "0"

  - name: failure_snapshot
    actions:
      - action: exec
        node: m02
        timeout: 3m
        cmd: "cd {{ product_root }} && bash scripts/collect-k8s-failure-snapshot.sh {{ product_root }}"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
        env.SW_BLOCK_FAILURE_SNAPSHOT_OUT: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/failure-snapshot"
        env.SW_BLOCK_HELM_RELEASE: "{{ helm_release }}"
        env.SW_BLOCK_HELM_NAMESPACE: "{{ helm_namespace }}"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/failure-snapshot/failure-snapshot-summary.txt"
        pattern: "^read_only=true$"
        save_as: failure_snapshot_readonly_count
      - action: assert_greater
        actual: "{{ failure_snapshot_readonly_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/failure-snapshot/k8s/events-all.txt"
        pattern: "."
        save_as: failure_snapshot_events_count
      - action: assert_greater
        actual: "{{ failure_snapshot_events_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/failure-snapshot/logs/csi-node.current.log"
        pattern: "."
        save_as: failure_snapshot_csi_log_count
      - action: assert_greater
        actual: "{{ failure_snapshot_csi_log_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/failure-snapshot/host/iscsi-nodes.txt"
        pattern: "."
        save_as: failure_snapshot_iscsi_nodes_count
      - action: assert_greater
        actual: "{{ failure_snapshot_iscsi_nodes_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/failure-snapshot/host/processes.txt"
        pattern: "."
        save_as: failure_snapshot_process_count
      - action: assert_greater
        actual: "{{ failure_snapshot_process_count }}"
        threshold: "0"

  - name: helm_uninstall_cleanup
    always: true
    actions:
      - action: exec
        node: m02
        timeout: 8m
        cmd: "kubectl -n default delete pod sw-block-example-reader sw-block-example-writer --ignore-not-found=true --wait=true --timeout=120s; kubectl -n default delete pvc sw-block-example-pvc --ignore-not-found=true --wait=true --timeout=120s; kubectl delete storageclass sw-block-example sw-block-dynamic --ignore-not-found=true --wait=true --timeout=120s; helm status {{ helm_release }} --namespace {{ helm_namespace }} >/dev/null 2>&1 && helm uninstall {{ helm_release }} --namespace {{ helm_namespace }} --wait --timeout 240s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/cleanup/helm-uninstall.txt || true; sudo -n iscsiadm -m node 2>/dev/null | awk '/io.seaweedfs/ {print $1, $2}' | while read portal target; do sudo -n iscsiadm -m node -T \"$target\" -p \"$portal\" -o delete || true; done; cd {{ product_root }} && bash scripts/verify-helm-cleanup.sh"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/cleanup/verify"
        env.SW_BLOCK_HELM_RELEASE: "{{ helm_release }}"
        env.SW_BLOCK_HELM_NAMESPACE: "{{ helm_namespace }}"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |^blockmaster |^blockvolume |^blockcsi |^iscsi-target "
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-support-bundle/cleanup/verify/cleanup-summary.txt"
        pattern: "^cleanup_status=ok$"
        save_as: helm_cleanup_ok_count
      - action: assert_greater
        actual: "{{ helm_cleanup_ok_count }}"
        threshold: "0"
