# Runner-native Phase 69 gate: frontend publication target contract.

name: frontend-publication-target-contract-chain
timeout: 8m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: frontend_publication_target_contract_gate
    actions:
      - action: exec
        node: m02
        timeout: 7m
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase69-frontend-publication-target-contract && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase69-frontend-publication-target-contract && cd {{ product_root }} && SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase69-frontend-publication-target-contract bash scripts/run-phase69-frontend-publication-target-contract-gate.sh {{ product_root }}"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase69-frontend-publication-target-contract/phase69-frontend-publication-target-contract-summary.txt"
        pattern: "^phase69_frontend_publication_target_contract_status=ok$"
        save_as: phase69_ok
      - action: assert_greater
        actual: "{{ phase69_ok }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase69-frontend-publication-target-contract/phase69-frontend-publication-target-contract-summary.txt"
        pattern: "^frontend_publication_target_schema_locked=true$"
        save_as: schema_locked
      - action: assert_greater
        actual: "{{ schema_locked }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase69-frontend-publication-target-contract/phase69-frontend-publication-target-contract-summary.txt"
        pattern: "^frontend_publication_target_owner_creates_target=true$"
        save_as: creates_target
      - action: assert_greater
        actual: "{{ creates_target }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase69-frontend-publication-target-contract/phase69-frontend-publication-target-contract-summary.txt"
        pattern: "^frontend_publication_target_owner_dry_run_no_create=true$"
        save_as: dry_run_no_create
      - action: assert_greater
        actual: "{{ dry_run_no_create }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase69-frontend-publication-target-contract/phase69-frontend-publication-target-contract-summary.txt"
        pattern: "^frontend_publication_target_owner_rejects_enabled_publication=true$"
        save_as: rejects_enabled
      - action: assert_greater
        actual: "{{ rejects_enabled }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase69-frontend-publication-target-contract/phase69-frontend-publication-target-contract-summary.txt"
        pattern: "^frontend_publication_target_owner_rbac_narrow=true$"
        save_as: rbac_narrow
      - action: assert_greater
        actual: "{{ rbac_narrow }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase69-frontend-publication-target-contract/phase69-frontend-publication-target-contract-summary.txt"
        pattern: "^frontend_publication_attempts=0$"
        save_as: no_frontend_attempts
      - action: assert_greater
        actual: "{{ no_frontend_attempts }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase69-frontend-publication-target-contract/phase69-frontend-publication-target-contract-summary.txt"
        pattern: "^failback_attempts=0$"
        save_as: no_failback_attempts
      - action: assert_greater
        actual: "{{ no_failback_attempts }}"
        threshold: "0"

  - name: collect
    always: true
    actions:
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase69-frontend-publication-target-contract"
        name: "remote-phases"
        ignore_error: true
