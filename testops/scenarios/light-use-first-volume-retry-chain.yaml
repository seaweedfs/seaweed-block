# Runner-native light-use first-volume retry/idempotency chain.
#
# Goal:
#   Prove a user can recover from a partial first-volume attempt by running the
#   documented cleanup path, then re-run the same demo successfully. Also prove
#   a successful run can be repeated immediately without a manual cleanup step.
#
# Expected invocation:
#   swblock run \
#     -env product_root=/path/to/seaweed_block/on/m02 \
#     -env ssh_key=/path/to/testdev_key/on/controller \
#     testops/scenarios/light-use-first-volume-retry-chain.yaml

name: light-use-first-volume-retry-chain
timeout: 30m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: pre_clean
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/pin_build /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/partial /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/retry_cleanup /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/retry_demo /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/success_rerun"
      - action: exec
        node: m02
        cmd: "pkill -f 'kubectl.*port-forward.*svc/blockmaste[r]' >/dev/null 2>&1 || true"
      - action: exec
        node: m02
        timeout: 3m
        cmd: "cd {{ product_root }} && bash scripts/uninstall-k8s-alpha.sh {{ product_root }}"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/pre_clean_uninstall"
        env.SW_BLOCK_UNINSTALL_DELETE_ALL_BLOCKVOLUMES: "1"
      - action: exec
        node: m02
        cmd: "kubectl -n default get pvc sw-block-demo-pvc -o name > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/pre-clean-residue.txt 2>&1 || true; kubectl -n default get deploy -l app=sw-blockvolume -o name >> /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/pre-clean-residue.txt 2>&1 || true; ! grep -q '^persistentvolumeclaim/\\|^deployment.apps/' /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/pre-clean-residue.txt"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |^blockmaster |^blockvolume |^blockcsi |^iscsi-target "

  - name: preflight
    actions:
      - action: exec
        node: m02
        cmd: "cd {{ product_root }} && bash scripts/preflight-k8s-alpha.sh --local-k3s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/preflight.txt 2>&1"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/preflight.txt"
        pattern: "summary status=PASS"
        save_as: preflight_count
      - action: assert_greater
        actual: "{{ preflight_count }}"
        threshold: "0"

  - name: pin_build_alpha_images
    actions:
      - action: exec
        node: m02
        timeout: 8m
        cmd: "cd {{ product_root }} && bash scripts/build-alpha-images.sh {{ product_root }}"
        env.SW_BLOCK_IMPORT_K3S: "1"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/pin_build"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/pin_build/alpha-images.env"
        pattern: "SW_BLOCK_IMAGE_ID="
        save_as: sw_block_image_id_count
      - action: assert_greater
        actual: "{{ sw_block_image_id_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/pin_build/alpha-images.env"
        pattern: "SW_BLOCK_CSI_IMAGE_ID="
        save_as: sw_block_csi_image_id_count
      - action: assert_greater
        actual: "{{ sw_block_csi_image_id_count }}"
        threshold: "0"

  - name: partial_first_attempt
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: "cd {{ product_root }} && bash -lc 'set -a; source /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/pin_build/alpha-images.env; set +a; set +e; SW_BLOCK_DEMO_STOP_AFTER=blockvolume-ready SW_BLOCK_DEMO_KEEP_ON_STOP=1 SW_BLOCK_DEMO_COLLECT_OPS_STATUS=1 bash scripts/run-k8s-demo.sh {{ product_root }}; rc=$?; echo $rc > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/partial/controlled-stop.exit_code; test \"$rc\" -eq 42'"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/partial"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/partial/run.log"
        pattern: "\\[app-demo\\] keeping resources for retry validation"
        save_as: keep_resources_count
      - action: assert_greater
        actual: "{{ keep_resources_count }}"
        threshold: "0"
      - action: exec
        node: m02
        cmd: "kubectl -n default get pvc sw-block-demo-pvc -o name > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/partial/residue-before-retry.txt 2>&1 || true; kubectl -n default get deploy -l app=sw-blockvolume -o name >> /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/partial/residue-before-retry.txt 2>&1 || true"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/partial/residue-before-retry.txt"
        pattern: "^persistentvolumeclaim/sw-block-demo-pvc$"
        save_as: stale_pvc_count
      - action: assert_greater
        actual: "{{ stale_pvc_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/partial/residue-before-retry.txt"
        pattern: "^deployment.apps/"
        save_as: stale_blockvolume_deploy_count
      - action: assert_greater
        actual: "{{ stale_blockvolume_deploy_count }}"
        threshold: "0"

  - name: cleanup_before_retry
    actions:
      - action: exec
        node: m02
        timeout: 3m
        cmd: "cd {{ product_root }} && bash scripts/uninstall-k8s-alpha.sh {{ product_root }}"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/retry_cleanup"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/retry_cleanup/uninstall.log"
        pattern: "\\[alpha-uninstall\\] PASS: seaweed-block alpha stack uninstall requested"
        save_as: uninstall_pass_count
      - action: assert_greater
        actual: "{{ uninstall_pass_count }}"
        threshold: "0"
      - action: exec
        node: m02
        cmd: "kubectl -n default get pvc sw-block-demo-pvc -o name > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/retry_cleanup/residue-after-cleanup.txt 2>&1 || true; kubectl -n default get deploy -l app=sw-blockvolume -o name >> /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/retry_cleanup/residue-after-cleanup.txt 2>&1 || true; ! grep -q '^persistentvolumeclaim/\\|^deployment.apps/' /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/retry_cleanup/residue-after-cleanup.txt"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"

  - name: retry_first_volume_demo
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: "cd {{ product_root }} && bash -lc 'set -a; source /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/pin_build/alpha-images.env; set +a; bash scripts/run-k8s-demo.sh {{ product_root }}'"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/retry_demo"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/retry_demo/run.log"
        pattern: "\\[app-demo\\] PASS: app pod wrote data, replacement app pod read it back through the same PVC, cleanup complete"
        save_as: retry_pass_count
      - action: assert_greater
        actual: "{{ retry_pass_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/retry_demo/writer.log"
        pattern: "/data/demo.bin: OK"
        save_as: retry_writer_checksum_count
      - action: assert_greater
        actual: "{{ retry_writer_checksum_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/retry_demo/reader.log"
        pattern: "/data/demo.bin: OK"
        save_as: retry_reader_checksum_count
      - action: assert_greater
        actual: "{{ retry_reader_checksum_count }}"
        threshold: "0"

  - name: rerun_after_success_no_cleanup
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: "cd {{ product_root }} && bash -lc 'set -a; source /mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/pin_build/alpha-images.env; set +a; bash scripts/run-k8s-demo.sh {{ product_root }}'"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/success_rerun"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/success_rerun/run.log"
        pattern: "\\[app-demo\\] PASS: app pod wrote data, replacement app pod read it back through the same PVC, cleanup complete"
        save_as: success_rerun_pass_count
      - action: assert_greater
        actual: "{{ success_rerun_pass_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/success_rerun/writer.log"
        pattern: "/data/demo.bin: OK"
        save_as: success_rerun_writer_checksum_count
      - action: assert_greater
        actual: "{{ success_rerun_writer_checksum_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/success_rerun/reader.log"
        pattern: "/data/demo.bin: OK"
        save_as: success_rerun_reader_checksum_count
      - action: assert_greater
        actual: "{{ success_rerun_reader_checksum_count }}"
        threshold: "0"

  - name: final_asserts
    actions:
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |[/]kubectl .*port-forward .*svc/blockmaste[r]|^blockmaster |^blockvolume |^blockcsi |^iscsi-target "

  - name: collect_and_cleanup
    always: true
    actions:
      - action: exec
        node: m02
        timeout: 3m
        cmd: "cd {{ product_root }} && bash scripts/uninstall-k8s-alpha.sh {{ product_root }}"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry/uninstall"
        env.SW_BLOCK_UNINSTALL_DELETE_ALL_BLOCKVOLUMES: "1"
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        cmd: "pkill -f 'kubectl.*port-forward.*svc/blockmaste[r]' >/dev/null 2>&1 || true"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |[/]kubectl .*port-forward .*svc/blockmaste[r]|^blockmaster |^blockvolume |^blockcsi |^iscsi-target "
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-first-volume-retry"
        name: "remote-phases"
        ignore_error: true
