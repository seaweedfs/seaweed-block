# Runner-native Phase 94 gate: full opt-in failback suite renders coherently and
# the executor can call a real blockmaster FailbackService in local test.
# This is not a live Kubernetes install claim.

name: failback-deployed-grpc-smoke-chain
timeout: 6m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: failback_deployed_grpc_smoke_gate
    actions:
      - action: exec
        node: m02
        timeout: 5m
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase94-failback-deployed-grpc-smoke && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase94-failback-deployed-grpc-smoke && cd {{ product_root }} && SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase94-failback-deployed-grpc-smoke bash scripts/run-phase94-failback-deployed-grpc-smoke-gate.sh {{ product_root }}"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase94-failback-deployed-grpc-smoke/phase94-failback-deployed-grpc-smoke-summary.txt"
        pattern: "^phase94_failback_deployed_grpc_smoke_status=ok$"
        save_as: phase94_ok
      - action: assert_greater
        actual: "{{ phase94_ok }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase94-failback-deployed-grpc-smoke/phase94-failback-deployed-grpc-smoke-summary.txt"
        pattern: "^enabled_renders_failback_runtime_rpc=true$"
        save_as: runtime_rpc
      - action: assert_greater
        actual: "{{ runtime_rpc }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase94-failback-deployed-grpc-smoke/phase94-failback-deployed-grpc-smoke-summary.txt"
        pattern: "^enabled_target_owner_activates_targets=true$"
        save_as: target_activation
      - action: assert_greater
        actual: "{{ target_activation }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase94-failback-deployed-grpc-smoke/phase94-failback-deployed-grpc-smoke-summary.txt"
        pattern: "^enabled_executor_grpc_runtime=true$"
        save_as: executor_grpc
      - action: assert_greater
        actual: "{{ executor_grpc }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase94-failback-deployed-grpc-smoke/phase94-failback-deployed-grpc-smoke-summary.txt"
        pattern: "^executor_grpc_uses_real_master_service=true$"
        save_as: real_master_grpc
      - action: assert_greater
        actual: "{{ real_master_grpc }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase94-failback-deployed-grpc-smoke/phase94-failback-deployed-grpc-smoke-summary.txt"
        pattern: "^live_kubernetes_install_claimed=false$"
        save_as: no_live_install_claim
      - action: assert_greater
        actual: "{{ no_live_install_claim }}"
        threshold: "0"

  - name: collect
    always: true
    actions:
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase94-failback-deployed-grpc-smoke"
        name: "remote-phases"
        ignore_error: true
