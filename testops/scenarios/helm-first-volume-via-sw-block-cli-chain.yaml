# Runner-native v0.3 pre-release gate: documented Go CLI Helm values path.
#
# Goal:
#   Prove the literal user-facing path:
#     go build ./cmd/sw-block
#     -> sw-block ops generate-helm-values
#     -> helm install
#     -> first PVC writer/reader
#     -> read-only report
#     -> helm uninstall cleanup
#
# This exists because the older Helm gates used scripts/generate-helm-values-day1.sh
# and did not cover the documented Go CLI generator.

name: helm-first-volume-via-sw-block-cli-chain
timeout: 28m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"
  helm_release: "sw-block"
  helm_namespace: "kube-system"
  sw_block_image: "ghcr.io/seaweedfs/seaweed-block:sha-28a99ce4f644"
  sw_block_csi_image: "ghcr.io/seaweedfs/seaweed-block-csi:sha-28a99ce4f644"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: pre_clean
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        timeout: 5m
        cmd: "helm status {{ helm_release }} --namespace {{ helm_namespace }} >/dev/null 2>&1 && helm uninstall {{ helm_release }} --namespace {{ helm_namespace }} --wait --timeout 180s || true; kubectl -n default delete pod sw-block-example-reader sw-block-example-writer --ignore-not-found=true --wait=true --timeout=120s; kubectl -n default delete pvc sw-block-example-pvc --ignore-not-found=true --wait=true --timeout=120s; kubectl delete storageclass sw-block-example --ignore-not-found=true --wait=true --timeout=120s; kubectl delete clusterrole/sw-block-csi clusterrolebinding/sw-block-csi --ignore-not-found=true; sudo -n iscsiadm -m node 2>/dev/null | awk '/io.seaweedfs/ {print $1, $2}' | while read portal target; do sudo -n iscsiadm -m node -T \"$target\" -p \"$portal\" -o delete || true; done; rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/bin /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/values /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/install /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/basic-app /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/cleanup"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |^blockmaster |^blockvolume |^blockcsi |^iscsi-target "

  - name: build_sw_block_cli
    actions:
      - action: exec
        node: m02
        timeout: 5m
        cmd: "cd {{ product_root }} && go build -o /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/bin/sw-block ./cmd/sw-block && /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/bin/sw-block --version > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/bin/sw-block.version.txt"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/bin/sw-block.version.txt"
        pattern: "sw-block"
        save_as: sw_block_version_count
      - action: assert_greater
        actual: "{{ sw_block_version_count }}"
        threshold: "0"

  - name: generate_day1_values_via_cli
    actions:
      - action: exec
        node: m02
        timeout: 3m
        cmd: "helm version --short > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/values/helm-version.txt && /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/bin/sw-block ops generate-helm-values --kubeconfig /etc/rancher/k3s/k3s.yaml --out /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/values/values.day1.yaml --image {{ sw_block_image }} --csi-image {{ sw_block_csi_image }} > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/values/generate.stdout.txt && ! grep -q '^    dataPort: 3260$' /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/values/values.day1.yaml"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/values/generate.stdout.txt"
        pattern: "helm_values_status=ok"
        save_as: generator_ok_count
      - action: assert_greater
        actual: "{{ generator_ok_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/values/values.day1.yaml"
        pattern: "dataPort: 19101"
        save_as: data_port_19101_count
      - action: assert_greater
        actual: "{{ data_port_19101_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/values/values.day1.yaml"
        pattern: "launcherReplicationAckFlag: false"
        save_as: compat_ack_false_count
      - action: assert_greater
        actual: "{{ compat_ack_false_count }}"
        threshold: "0"

  - name: helm_install_stack
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: "cd {{ product_root }} && helm lint charts/seaweed-block -f /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/values/values.day1.yaml > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/install/helm-lint.txt && helm install {{ helm_release }} charts/seaweed-block --namespace {{ helm_namespace }} --create-namespace -f /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/values/values.day1.yaml --wait --timeout 10m > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/install/helm-install.txt && kubectl -n {{ helm_namespace }} get deploy,ds,pods,svc -o wide > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/install/kube-system.after-install.txt"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/install/helm-install.txt"
        pattern: "STATUS: deployed"
        save_as: helm_deployed_count
      - action: assert_greater
        actual: "{{ helm_deployed_count }}"
        threshold: "0"

  - name: first_volume_user_loop
    actions:
      - action: exec
        node: m02
        timeout: 8m
        cmd: "cd {{ product_root }} && bash scripts/run-basic-app-example.sh {{ product_root }}"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/basic-app"
        env.SW_BLOCK_BASIC_APP_CLEANUP: "1"
        env.SW_BLOCK_INSTALL_MODE: "helm"
        env.SW_BLOCK_HELM_RELEASE: "{{ helm_release }}"
        env.SW_BLOCK_HELM_NAMESPACE: "{{ helm_namespace }}"
        env.SW_BLOCK_HELM_VALUES_FILE: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/values/values.day1.yaml"

  - name: first_volume_asserts
    actions:
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/basic-app/first-volume-summary.txt"
        pattern: "^first_volume_status=ok$"
        save_as: first_volume_ok_count
      - action: assert_greater
        actual: "{{ first_volume_ok_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/basic-app/first-volume-summary.txt"
        pattern: "^writer_verified=true$"
        save_as: writer_verified_count
      - action: assert_greater
        actual: "{{ writer_verified_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/basic-app/first-volume-summary.txt"
        pattern: "^reader_verified=true$"
        save_as: reader_verified_count
      - action: assert_greater
        actual: "{{ reader_verified_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/basic-app/first-volume-summary.txt"
        pattern: "^status_report=status/report/index.html$"
        save_as: report_html_count
      - action: assert_greater
        actual: "{{ report_html_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/basic-app/first-volume-summary.txt"
        pattern: "^operator_snapshot=status/report/operator-snapshot.json$"
        save_as: operator_snapshot_summary_count
      - action: assert_greater
        actual: "{{ operator_snapshot_summary_count }}"
        threshold: "0"
      - action: exec
        node: m02
        timeout: 1m
        cmd: "set -e; out=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/basic-app/status/report/dashboard-route; mkdir -p \"$out\"; /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/bin/sw-block ops dashboard --from-bundle /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/basic-app --listen 127.0.0.1:19334 > \"$out/dashboard.stdout.txt\" 2> \"$out/dashboard.stderr.txt\" & pid=$!; trap 'kill $pid >/dev/null 2>&1 || true; wait $pid >/dev/null 2>&1 || true' EXIT; for i in $(seq 1 100); do code=$(curl -s -o \"$out/operator-snapshot.json\" -w '%{http_code}' http://127.0.0.1:19334/operator-snapshot.json || true); if [ \"$code\" = \"200\" ] && grep -q '\"read_only\": true' \"$out/operator-snapshot.json\" && grep -q '\"mutation_allowed\": false' \"$out/operator-snapshot.json\"; then exit 0; fi; sleep 0.2; done; echo \"operator-snapshot route failed\" >&2; cat \"$out/dashboard.stderr.txt\" >&2 || true; exit 1"

  - name: helm_uninstall_cleanup
    always: true
    actions:
      - action: exec
        node: m02
        timeout: 6m
        cmd: "helm status {{ helm_release }} --namespace {{ helm_namespace }} >/dev/null 2>&1 && helm uninstall {{ helm_release }} --namespace {{ helm_namespace }} --wait --timeout 240s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/cleanup/helm-uninstall.txt || true; kubectl -n default delete pod sw-block-example-reader sw-block-example-writer --ignore-not-found=true --wait=true --timeout=120s; kubectl -n default delete pvc sw-block-example-pvc --ignore-not-found=true --wait=true --timeout=120s; kubectl delete storageclass sw-block-example --ignore-not-found=true --wait=true --timeout=120s; sudo -n iscsiadm -m node 2>/dev/null | awk '/io.seaweedfs/ {print $1, $2}' | while read portal target; do sudo -n iscsiadm -m node -T \"$target\" -p \"$portal\" -o delete || true; done; cd {{ product_root }} && bash scripts/verify-helm-cleanup.sh"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/cleanup/verify"
        env.SW_BLOCK_HELM_RELEASE: "{{ helm_release }}"
        env.SW_BLOCK_HELM_NAMESPACE: "{{ helm_namespace }}"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |^blockmaster |^blockvolume |^blockcsi |^iscsi-target "
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-helm-cli-first-volume/cleanup/verify/cleanup-summary.txt"
        pattern: "^cleanup_status=ok$"
        save_as: helm_cleanup_ok_count
      - action: assert_greater
        actual: "{{ helm_cleanup_ok_count }}"
        threshold: "0"
