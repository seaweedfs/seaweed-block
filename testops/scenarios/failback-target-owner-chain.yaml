# Runner-native Phase 75 gate: returned-replica failback can create a
# failback target handoff CR only after terminal evidence is present. The owner
# remains disabled by default, dry-run by default, and has no status/finalizer,
# storage, authority, or frontend publication mutation power.

name: failback-target-owner-chain
timeout: 8m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: failback_target_owner_gate
    actions:
      - action: exec
        node: m02
        timeout: 7m
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase75-failback-target-owner && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase75-failback-target-owner && cd {{ product_root }} && SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase75-failback-target-owner bash scripts/run-phase75-failback-target-owner-gate.sh {{ product_root }}"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase75-failback-target-owner/phase75-failback-target-owner-summary.txt"
        pattern: "^phase75_failback_target_owner_status=ok$"
        save_as: phase75_ok
      - action: assert_greater
        actual: "{{ phase75_ok }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase75-failback-target-owner/phase75-failback-target-owner-summary.txt"
        pattern: "^failback_target_owner_creates_target=true$"
        save_as: creates_target
      - action: assert_greater
        actual: "{{ creates_target }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase75-failback-target-owner/phase75-failback-target-owner-summary.txt"
        pattern: "^failback_target_owner_dry_run_no_create=true$"
        save_as: dry_run_no_create
      - action: assert_greater
        actual: "{{ dry_run_no_create }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase75-failback-target-owner/phase75-failback-target-owner-summary.txt"
        pattern: "^failback_target_owner_requires_terminal_evidence=true$"
        save_as: terminal_evidence_required
      - action: assert_greater
        actual: "{{ terminal_evidence_required }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase75-failback-target-owner/phase75-failback-target-owner-summary.txt"
        pattern: "^failback_target_crd_schema=true$"
        save_as: target_crd_schema
      - action: assert_greater
        actual: "{{ target_crd_schema }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase75-failback-target-owner/phase75-failback-target-owner-summary.txt"
        pattern: "^failback_target_owner_chart_boundary=true$"
        save_as: chart_boundary
      - action: assert_greater
        actual: "{{ chart_boundary }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase75-failback-target-owner/phase75-failback-target-owner-summary.txt"
        pattern: "^failback_attempts=0$"
        save_as: no_failback_attempt
      - action: assert_greater
        actual: "{{ no_failback_attempt }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase75-failback-target-owner/phase75-failback-target-owner-summary.txt"
        pattern: "^storage_mutation_allowed=false$"
        save_as: no_storage_mutation
      - action: assert_greater
        actual: "{{ no_storage_mutation }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase75-failback-target-owner/phase75-failback-target-owner-summary.txt"
        pattern: "^frontend_publication_allowed=false$"
        save_as: no_frontend_publication
      - action: assert_greater
        actual: "{{ no_frontend_publication }}"
        threshold: "0"

  - name: collect
    always: true
    actions:
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase75-failback-target-owner"
        name: "remote-phases"
        ignore_error: true
