# Runner-native mounted failover MVP degraded-replica negative gate.
#
# Goal:
#   Prove an RF=2 Kubernetes placement with one replica workload scaled to zero
#   is reported as degraded and not as a recovered/healthy RF=2 state. This is
#   a D5 negative fixture, not the final mounted recovery claim.

name: mounted-failover-rf2-degraded-replica-chain
timeout: 18m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: pre_clean
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/pin_build /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/install /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/rf2 /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/inventory"
      - action: exec
        node: m02
        cmd: "kubectl -n default delete pvc sw-block-rf2-degraded-pvc --ignore-not-found=true --wait=true --timeout=120s >/dev/null 2>&1 || true; kubectl delete sc sw-block-rf2-degraded --ignore-not-found=true >/dev/null 2>&1 || true; pkill -f 'kubectl.*port-forward.*svc/blockmaste[r]' >/dev/null 2>&1 || true"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |^blockmaster |^blockvolume |^blockcsi |^iscsi-target "

  - name: preflight
    actions:
      - action: exec
        node: m02
        cmd: "cd {{ product_root }} && bash scripts/preflight-k8s-alpha.sh --local-k3s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/preflight.txt 2>&1"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/preflight.txt"
        pattern: "summary status=PASS"
        save_as: preflight_count
      - action: assert_greater
        actual: "{{ preflight_count }}"
        threshold: "0"

  - name: pin_build_alpha_images
    actions:
      - action: exec
        node: m02
        timeout: 8m
        cmd: "cd {{ product_root }} && bash scripts/build-alpha-images.sh {{ product_root }}"
        env.SW_BLOCK_IMPORT_K3S: "1"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/pin_build"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/pin_build/alpha-images.env"
        pattern: "SW_BLOCK_IMAGE_ID="
        save_as: sw_block_image_id_count
      - action: assert_greater
        actual: "{{ sw_block_image_id_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/pin_build/alpha-images.env"
        pattern: "SW_BLOCK_CSI_IMAGE_ID="
        save_as: sw_block_csi_image_id_count
      - action: assert_greater
        actual: "{{ sw_block_csi_image_id_count }}"
        threshold: "0"

  - name: install_rf2_alpha_stack
    actions:
      - action: exec
        node: m02
        timeout: 6m
        cmd: "cd {{ product_root }} && bash -c 'set -a; source /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/pin_build/alpha-images.env; set +a; SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/install SW_BLOCK_ALPHA_LOGICAL_SERVERS=2 SW_BLOCK_ALPHA_EXPECTED_SLOTS_PER_VOLUME=2 bash scripts/install-k8s-alpha.sh {{ product_root }}'"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/install/install.log"
        pattern: "logical_servers=2"
        save_as: logical_servers_count
      - action: assert_greater
        actual: "{{ logical_servers_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/install/install.log"
        pattern: "expected_slots_per_volume=2"
        save_as: expected_slots_count
      - action: assert_greater
        actual: "{{ expected_slots_count }}"
        threshold: "0"

  - name: rf2_placement_boundary
    actions:
      - action: exec
        node: m02
        timeout: 5m
        cmd: "cat > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/rf2/rf2-degraded.yaml <<'YAML'\napiVersion: storage.k8s.io/v1\nkind: StorageClass\nmetadata:\n  name: sw-block-rf2-degraded\nprovisioner: block.csi.seaweedfs.com\nvolumeBindingMode: Immediate\nallowVolumeExpansion: false\nparameters:\n  replicationFactor: \"2\"\n  sw-block.seaweedfs.com/protocol: iscsi\n---\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: sw-block-rf2-degraded-pvc\n  namespace: default\nspec:\n  accessModes:\n    - ReadWriteOnce\n  storageClassName: sw-block-rf2-degraded\n  resources:\n    requests:\n      storage: 1Mi\nYAML\nkubectl apply -f /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/rf2/rf2-degraded.yaml > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/rf2/apply-rf2.log 2>&1\nkubectl -n default wait --for=jsonpath='{.status.phase}'=Bound pvc/sw-block-rf2-degraded-pvc --timeout=120s >> /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/rf2/apply-rf2.log 2>&1\nfor i in $(seq 1 120); do count=$(kubectl -n default get deploy -l app=sw-blockvolume --no-headers 2>/dev/null | wc -l); test \"$count\" -ge 2 && break; sleep 1; done\ncount=$(kubectl -n default get deploy -l app=sw-blockvolume --no-headers 2>/dev/null | wc -l); test \"$count\" -eq 2\nkubectl -n default wait --for=condition=available deploy -l app=sw-blockvolume --timeout=120s >> /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/rf2/apply-rf2.log 2>&1\nkubectl -n default get deploy -l app=sw-blockvolume -o wide > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/rf2/blockvolumes.before-degrade.txt"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/rf2/blockvolumes.before-degrade.txt"
        pattern: "^sw-blockvolume-"
        save_as: rf2_deploy_count
      - action: assert_greater
        actual: "{{ rf2_deploy_count }}"
        threshold: "1"

  - name: degrade_one_replica
    actions:
      - action: exec
        node: m02
        timeout: 3m
        cmd: "set -eu\nOUT=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/rf2\nR2_DEPLOY=$(kubectl -n default get deploy -l app=sw-blockvolume,sw-block.seaweedfs.com/replica=r2 -o jsonpath='{.items[0].metadata.name}')\ntest -n \"$R2_DEPLOY\"\necho \"$R2_DEPLOY\" > \"$OUT/degraded-deployment.txt\"\nkubectl -n default scale deploy \"$R2_DEPLOY\" --replicas=0 > \"$OUT/scale-r2.log\" 2>&1\nfor i in $(seq 1 60); do ready=$(kubectl -n default get deploy \"$R2_DEPLOY\" -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true); test -z \"$ready\" -o \"$ready\" = \"0\" && break; sleep 1; done\nkubectl -n default get deploy -l app=sw-blockvolume -o wide > \"$OUT/blockvolumes.after-degrade.txt\"\nready=$(kubectl -n default get deploy \"$R2_DEPLOY\" -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true); test -z \"$ready\" -o \"$ready\" = \"0\""
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/rf2/degraded-deployment.txt"
        pattern: "sw-blockvolume-"
        save_as: degraded_deploy_name_count
      - action: assert_greater
        actual: "{{ degraded_deploy_name_count }}"
        threshold: "0"

  - name: inventory_after_degraded_replica
    actions:
      - action: exec
        node: m02
        timeout: 4m
        cmd: "cd {{ product_root }} && bash -c 'set -euo pipefail; OUT=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/inventory; mkdir -p \"$OUT\"; pf_port=$(python3 - <<\"PY\"\nimport socket\ns=socket.socket(); s.bind((\"127.0.0.1\",0)); print(s.getsockname()[1]); s.close()\nPY\n); kubectl -n kube-system port-forward svc/blockmaster ${pf_port}:9333 > \"$OUT/blockmaster-port-forward.log\" 2>&1 & pf_pid=$!; echo \"$pf_pid\" > \"$OUT/blockmaster-port-forward.pid\"; cleanup(){ kill \"$pf_pid\" >/dev/null 2>&1 || true; wait \"$pf_pid\" >/dev/null 2>&1 || true; }; trap cleanup EXIT; for i in $(seq 1 30); do (echo >/dev/tcp/127.0.0.1/${pf_port}) >/dev/null 2>&1 && break; sleep 1; done; (echo >/dev/tcp/127.0.0.1/${pf_port}) >/dev/null 2>&1; go run ./cmd/sw-block ops inventory --namespace default --master 127.0.0.1:${pf_port} --out \"$OUT\" --timeout 30s > \"$OUT/stdout.txt\" 2> \"$OUT/stderr.txt\"; rc=$?; echo \"$rc\" > \"$OUT/exit_code.txt\"; find \"$OUT/volumes\" -name ops-status-bundle.json -exec cat {} \\; > \"$OUT/nested-ops-status-bundles.json\" 2>/dev/null || true; exit \"$rc\"'"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/inventory/exit_code.txt"
        pattern: "^0$"
        save_as: inventory_exit_zero_count
      - action: assert_greater
        actual: "{{ inventory_exit_zero_count }}"
        threshold: "0"

  - name: inventory_asserts
    actions:
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/inventory/volume-inventory-summary.txt"
        pattern: "pvc=sw-block-rf2-degraded-pvc"
        save_as: rf2_pvc_identity_count
      - action: assert_greater
        actual: "{{ rf2_pvc_identity_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/inventory/volume-inventory-summary.txt"
        pattern: "rf=2 desired=2 observed=2"
        save_as: rf2_observed_count
      - action: assert_greater
        actual: "{{ rf2_observed_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/inventory/volume-inventory-summary.txt"
        pattern: "replica: volume=.*replica=r2 .*status=unhealthy"
        save_as: r2_unhealthy_count
      - action: assert_greater
        actual: "{{ r2_unhealthy_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/inventory/volume-inventory-summary.txt"
        pattern: "replica_degraded=r2 status=unhealthy"
        save_as: r2_degraded_issue_count
      - action: assert_greater
        actual: "{{ r2_degraded_issue_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/inventory/volume-inventory-summary.txt"
        pattern: "ops_status=unhealthy reason=replication_role_not_ready"
        save_as: replication_not_ready_count
      - action: assert_greater
        actual: "{{ replication_not_ready_count }}"
        threshold: "0"
      - action: exec
        node: m02
        cmd: "! grep -q 'generated_deployment_missing\\|observed_replicas=0 desired_replicas=2\\|replica_slot_missing=unknown' /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/inventory/volume-inventory-summary.txt"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/inventory/nested-ops-status-bundles.json"
        pattern: "\"command\": \"sw-block ops status\""
        save_as: nested_status_bundle_count
      - action: assert_greater
        actual: "{{ nested_status_bundle_count }}"
        threshold: "0"

  - name: collect_and_cleanup
    always: true
    actions:
      - action: exec
        node: m02
        cmd: "kubectl -n default delete pvc sw-block-rf2-degraded-pvc --ignore-not-found=true --wait=true --timeout=120s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/delete-rf2-pvc.log 2>&1 || true; kubectl delete sc sw-block-rf2-degraded --ignore-not-found=true > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/delete-rf2-sc.log 2>&1 || true"
      - action: exec
        node: m02
        timeout: 3m
        cmd: "cd {{ product_root }} && bash scripts/uninstall-k8s-alpha.sh {{ product_root }}"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded/uninstall"
        env.SW_BLOCK_UNINSTALL_DELETE_ALL_BLOCKVOLUMES: "1"
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        cmd: "pkill -f 'kubectl.*port-forward.*svc/blockmaste[r]' >/dev/null 2>&1 || true"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |[/]kubectl .*port-forward .*svc/blockmaste[r]|^blockmaster |^blockvolume |^blockcsi |^iscsi-target "
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-degraded"
        name: "remote-phases"
        ignore_error: true
