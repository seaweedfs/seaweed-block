# Runner-native Phase 76 gate: SwBlockReplicaFailback executor writes
# disabled/blocked status only. It does not execute failback, advance authority,
# swap publish targets, publish frontend paths, or mutate storage.

name: failback-executor-boundary-chain
timeout: 8m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: failback_executor_boundary_gate
    actions:
      - action: exec
        node: m02
        timeout: 7m
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase76-failback-executor-boundary && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase76-failback-executor-boundary && cd {{ product_root }} && SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase76-failback-executor-boundary bash scripts/run-phase76-failback-executor-boundary-gate.sh {{ product_root }}"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase76-failback-executor-boundary/phase76-failback-executor-boundary-summary.txt"
        pattern: "^phase76_failback_executor_boundary_status=ok$"
        save_as: phase76_ok
      - action: assert_greater
        actual: "{{ phase76_ok }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase76-failback-executor-boundary/phase76-failback-executor-boundary-summary.txt"
        pattern: "^failback_executor_writes_disabled_status=true$"
        save_as: writes_disabled
      - action: assert_greater
        actual: "{{ writes_disabled }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase76-failback-executor-boundary/phase76-failback-executor-boundary-summary.txt"
        pattern: "^failback_executor_dry_run_no_status_write=true$"
        save_as: dry_run_no_write
      - action: assert_greater
        actual: "{{ dry_run_no_write }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase76-failback-executor-boundary/phase76-failback-executor-boundary-summary.txt"
        pattern: "^kubernetes_writer_failback_status_subresource=true$"
        save_as: status_subresource
      - action: assert_greater
        actual: "{{ status_subresource }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase76-failback-executor-boundary/phase76-failback-executor-boundary-summary.txt"
        pattern: "^failback_executor_rbac_status_only=true$"
        save_as: rbac_status_only
      - action: assert_greater
        actual: "{{ rbac_status_only }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase76-failback-executor-boundary/phase76-failback-executor-boundary-summary.txt"
        pattern: "^failback_attempts=0$"
        save_as: no_failback_attempt
      - action: assert_greater
        actual: "{{ no_failback_attempt }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase76-failback-executor-boundary/phase76-failback-executor-boundary-summary.txt"
        pattern: "^authority_mutation_allowed=false$"
        save_as: no_authority_mutation
      - action: assert_greater
        actual: "{{ no_authority_mutation }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase76-failback-executor-boundary/phase76-failback-executor-boundary-summary.txt"
        pattern: "^frontend_publication_allowed=false$"
        save_as: no_frontend_publication
      - action: assert_greater
        actual: "{{ no_frontend_publication }}"
        threshold: "0"

      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase76-failback-executor-boundary/phase76-failback-executor-boundary-summary.txt"
        pattern: "^storage_mutation_allowed=false$"
        save_as: no_storage_mutation
      - action: assert_greater
        actual: "{{ no_storage_mutation }}"
        threshold: "0"

  - name: collect
    always: true
    actions:
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase76-failback-executor-boundary"
        name: "remote-phases"
        ignore_error: true
