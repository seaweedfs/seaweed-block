name: nvme-tcp-wal-multiblock-head-lsn-confirmation-chain
timeout: 95m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m01:
      host: 192.168.1.181
      user: testdev
      key: "{{ ssh_key }}"
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: pre_clean
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        timeout: 5m
        cmd: "helm status sw-block --namespace kube-system >/dev/null 2>&1 && helm uninstall sw-block --namespace kube-system --wait --timeout 240s || true; kubectl -n default delete pod sw-block-phase126-block-perf sw-block-phase126-local-perf --ignore-not-found=true --wait=true --timeout=60s || true; kubectl -n default delete pvc sw-block-phase126-block-pvc sw-block-phase126-local-pvc --ignore-not-found=true --wait=true --timeout=60s || true; kubectl delete storageclass sw-block-phase126-block --ignore-not-found=true --wait=true --timeout=60s || true; kubectl get pv --no-headers | awk '/sw-block-phase126/ {print $1}' | xargs -r -n1 kubectl patch pv --type=merge -p '{\"metadata\":{\"finalizers\":[]}}' >/dev/null 2>&1 || true; kubectl get pv --no-headers | awk '/sw-block-phase126/ {print $1}' | xargs -r kubectl delete pv --wait=false >/dev/null 2>&1 || true; kubectl -n kube-system get swblockvolumes.block.seaweedfs.com -o name 2>/dev/null | xargs -r -n1 kubectl -n kube-system patch --type=merge -p '{\"metadata\":{\"finalizers\":[]}}' >/dev/null 2>&1 || true; kubectl -n kube-system delete swblockvolumes.block.seaweedfs.com --all --ignore-not-found=true --wait=true --timeout=60s >/dev/null 2>&1 || true; kubectl -n kube-system delete swblockclusters.block.seaweedfs.com --all --ignore-not-found=true --wait=true --timeout=60s >/dev/null 2>&1 || true; kubectl delete validatingadmissionpolicy,validatingadmissionpolicybinding -l app.kubernetes.io/instance=sw-block --ignore-not-found=true >/dev/null 2>&1 || true; kubectl delete crd swblockclusters.block.seaweedfs.com swblockvolumes.block.seaweedfs.com swblockreplicaeligibilities.block.seaweedfs.com swblockreplicarebuilds.block.seaweedfs.com swblockreplicafailbacks.block.seaweedfs.com swblockfrontendpublications.block.seaweedfs.com --ignore-not-found=true --wait=true --timeout=60s >/dev/null 2>&1 || true; sudo -n nvme disconnect-all >/dev/null 2>&1 || true; sudo -n rm -rf /tmp/sw-block-phase155-recovery-*; rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      - action: exec
        node: m01
        timeout: 2m
        cmd: "sudo -n rm -rf /tmp/sw-block-phase155-recovery-*"

  - name: run_gate
    actions:
      - action: exec
        node: m02
        timeout: 87m
        cmd: "cd {{ product_root }} && SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn SW_BLOCK_PHASE155_CANDIDATE_MAX_H2C_BYTES=65536 SW_BLOCK_PHASE155_SEQ_MIB=4 SW_BLOCK_PHASE155_RESTART_VERIFY_MIB=4 SW_BLOCK_PHASE155_STATE_HOSTPATH=/tmp/sw-block-phase155-recovery-{{ run_id }} SW_BLOCK_PHASE125_FRONTEND_IP_MAP=m01=10.0.0.1,m02=10.0.0.3 SW_BLOCK_PHASE125_EXPECTED_ROUTE_DEV=enp1s0np0 SW_BLOCK_IMPORT_K3S_SSH_KEY=/opt/work/testdev_key bash scripts/run-phase155-mounted-durable-status-head-lsn-confirmation-gate.sh {{ product_root }}"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

  - name: assert_summary
    actions:
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^phase155_mounted_durable_status_head_lsn_confirmation_status=ok$"
        save_as: phase155_status_ok
      - action: assert_greater
        actual: "{{ phase155_status_ok }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^phase152_followup=head_lsn_diagnostic_cleanup$"
        save_as: phase152_followup
      - action: assert_greater
        actual: "{{ phase152_followup }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^runtime_opt_in_enabled=true$"
        save_as: runtime_enabled
      - action: assert_greater
        actual: "{{ runtime_enabled }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^recovery_test_disable_flusher_enabled=true$"
        save_as: recovery_test_flusher_disabled
      - action: assert_greater
        actual: "{{ recovery_test_flusher_disabled }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^restart_persistence_mode=hostpath$"
        save_as: restart_persistence
      - action: assert_greater
        actual: "{{ restart_persistence }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^blockvolume_restart_mode=force_delete_pod$"
        save_as: restart_mode
      - action: assert_greater
        actual: "{{ restart_mode }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^recovery_completed=true$"
        save_as: recovery_completed
      - action: assert_greater
        actual: "{{ recovery_completed }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^recovered_lsn_after_restart=[1-9][0-9]*$"
        save_as: recovered_lsn
      - action: assert_greater
        actual: "{{ recovered_lsn }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^recovered_lsn_remains_correct=true$"
        save_as: recovered_lsn_correct
      - action: assert_greater
        actual: "{{ recovered_lsn_correct }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^durable_status_head_lsn_after_restart=[1-9][0-9]*$"
        save_as: head_lsn_after
      - action: assert_greater
        actual: "{{ head_lsn_after }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^durable_status_head_lsn_equals_recovered_lsn=true$"
        save_as: head_equals_recovered
      - action: assert_greater
        actual: "{{ head_equals_recovered }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^durable_status_evidence_matches_recovered_lsn=true$"
        save_as: evidence_matches
      - action: assert_greater
        actual: "{{ evidence_matches }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^reader_verified_after_restart=true$"
        save_as: reader_after
      - action: assert_greater
        actual: "{{ reader_after }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^ready_after_restart=true$"
        save_as: ready_after
      - action: assert_greater
        actual: "{{ ready_after }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^default_wal_format_unchanged=true$"
        save_as: default_unchanged
      - action: assert_greater
        actual: "{{ default_unchanged }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^roce_claim_allowed=false$"
        save_as: no_roce_claim
      - action: assert_greater
        actual: "{{ no_roce_claim }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^nvme_rdma_claim_allowed=false$"
        save_as: no_rdma_claim
      - action: assert_greater
        actual: "{{ no_rdma_claim }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^performance_slo_claim_allowed=false$"
        save_as: no_slo_claim
      - action: assert_greater
        actual: "{{ no_slo_claim }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^cleanup_status=ok$"
        save_as: cleanup_ok
      - action: assert_greater
        actual: "{{ cleanup_ok }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn/phase155-mounted-durable-status-head-lsn-confirmation-summary.txt"
        pattern: "^phase155_decision=mounted_confirmed$"
        save_as: decision_confirmed
      - action: assert_greater
        actual: "{{ decision_confirmed }}"
        threshold: "0"

  - name: collect
    always: true
    actions:
      - action: exec
        node: m01
        timeout: 2m
        cmd: "sudo -n rm -rf /tmp/sw-block-phase155-recovery-{{ run_id }}"
        ignore_error: true
      - action: exec
        node: m02
        timeout: 2m
        cmd: "sudo -n rm -rf /tmp/sw-block-phase155-recovery-{{ run_id }}"
        ignore_error: true
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase155-head-lsn"
        name: "remote-phases"
        ignore_error: true
