name: nvme-tcp-k8s-multivolume-mounted-path-churn-soak-chain
timeout: 90m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: pre_clean
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        timeout: 5m
        cmd: "helm status sw-block --namespace kube-system >/dev/null 2>&1 && helm uninstall sw-block --namespace kube-system --wait --timeout 240s || true; kubectl -n default delete pod sw-block-phase115-mounted-1 sw-block-phase115-mounted-2 --ignore-not-found=true --wait=true --timeout=120s || true; kubectl -n default delete pod -l sw-block-test=multi-volume --ignore-not-found=true --wait=true --timeout=120s || true; for i in 1 2; do kubectl -n default delete pod sw-block-multi-reader-$i sw-block-multi-writer-$i --ignore-not-found=true --wait=true --timeout=120s || true; kubectl -n default delete pvc sw-block-multi-pvc-$i --ignore-not-found=true --wait=true --timeout=120s || true; done; kubectl delete storageclass sw-block-multi --ignore-not-found=true --wait=true --timeout=120s || true; kubectl -n default delete deploy -l app=sw-blockvolume --ignore-not-found=true --wait=false || true; kubectl -n kube-system get swblockvolumes.block.seaweedfs.com -o name 2>/dev/null | xargs -r -n1 kubectl -n kube-system patch --type=merge -p '{\"metadata\":{\"finalizers\":[]}}' >/dev/null 2>&1 || true; kubectl -n kube-system delete swblockvolumes.block.seaweedfs.com --all --ignore-not-found=true --wait=true --timeout=60s || true; kubectl -n kube-system delete swblockclusters.block.seaweedfs.com --all --ignore-not-found=true --wait=true --timeout=60s || true; kubectl delete validatingadmissionpolicy,validatingadmissionpolicybinding -l app.kubernetes.io/instance=sw-block --ignore-not-found=true >/dev/null 2>&1 || true; kubectl delete crd swblockclusters.block.seaweedfs.com swblockvolumes.block.seaweedfs.com swblockreplicaeligibilities.block.seaweedfs.com swblockreplicarebuilds.block.seaweedfs.com swblockreplicafailbacks.block.seaweedfs.com swblockfrontendpublications.block.seaweedfs.com --ignore-not-found=true --wait=true --timeout=60s >/dev/null 2>&1 || true; kubectl get pv --no-headers 2>/dev/null | awk '/sw-block-multi/ {print $1}' | xargs -r -n1 kubectl patch pv --type=merge -p '{\"metadata\":{\"finalizers\":[]}}' >/dev/null 2>&1 || true; kubectl get pv --no-headers 2>/dev/null | awk '/sw-block-multi/ {print $1}' | xargs -r kubectl delete pv --wait=false >/dev/null 2>&1 || true; sudo -n nvme disconnect-all >/dev/null 2>&1 || true; rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak/build /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak/gate"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

  - name: build_and_import_images
    actions:
      - action: exec
        node: m02
        timeout: 10m
        cmd: "cd {{ product_root }} && bash scripts/build-alpha-images.sh {{ product_root }}"
        env.SW_BLOCK_IMPORT_K3S: "1"
        env.SW_BLOCK_IMPORT_K3S_NODES: "192.168.1.181"
        env.SW_BLOCK_IMPORT_K3S_SSH_USER: "testdev"
        env.SW_BLOCK_IMPORT_K3S_SSH_KEY: "{{ ssh_key }}"
        env.SW_BLOCK_DOCKER_NO_CACHE: "1"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak/build"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak/build/alpha-images.env"
        pattern: "SW_BLOCK_IMAGE_ID="
        save_as: image_id_count
      - action: assert_greater
        actual: "{{ image_id_count }}"
        threshold: "0"

  - name: run_phase115_gate
    actions:
      - action: exec
        node: m02
        timeout: 75m
        cmd: "cd {{ product_root }} && bash scripts/run-phase115-nvme-k8s-multivolume-mounted-path-churn-soak-gate.sh {{ product_root }}"
        env.KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak/gate"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak/gate/phase115-nvme-k8s-multivolume-mounted-path-churn-soak-summary.txt"
        pattern: "^phase115_nvme_k8s_multivolume_mounted_path_churn_soak_status=ok$"
        save_as: gate_ok
      - action: assert_greater
        actual: "{{ gate_ok }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak/gate/phase115-nvme-k8s-multivolume-mounted-path-churn-soak-summary.txt"
        pattern: "^cycle_count=3$"
        save_as: cycle_count
      - action: assert_greater
        actual: "{{ cycle_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak/gate/phase115-nvme-k8s-multivolume-mounted-path-churn-soak-summary.txt"
        pattern: "^mounted_pods_preserved=true$"
        save_as: pods_preserved
      - action: assert_greater
        actual: "{{ pods_preserved }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak/gate/phase115-nvme-k8s-multivolume-mounted-path-churn-soak-summary.txt"
        pattern: "^mounted_io_after_loss_count=6$"
        save_as: mounted_io_loss
      - action: assert_greater
        actual: "{{ mounted_io_loss }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak/gate/phase115-nvme-k8s-multivolume-mounted-path-churn-soak-summary.txt"
        pattern: "^mounted_io_after_restore_count=6$"
        save_as: mounted_io_restore
      - action: assert_greater
        actual: "{{ mounted_io_restore }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak/gate/phase115-nvme-k8s-multivolume-mounted-path-churn-soak-summary.txt"
        pattern: "^cross_volume_reason_mixup=false$"
        save_as: no_reason_mixup
      - action: assert_greater
        actual: "{{ no_reason_mixup }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak/gate/phase115-nvme-k8s-multivolume-mounted-path-churn-soak-summary.txt"
        pattern: "^cross_volume_publish_target_mixup=false$"
        save_as: no_target_mixup
      - action: assert_greater
        actual: "{{ no_target_mixup }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak/gate/phase115-nvme-k8s-multivolume-mounted-path-churn-soak-summary.txt"
        pattern: "^all_restored_path_count=2$"
        save_as: restored_paths
      - action: assert_greater
        actual: "{{ restored_paths }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak/gate/phase115-nvme-k8s-multivolume-mounted-path-churn-soak-summary.txt"
        pattern: "^cleanup_status=ok$"
        save_as: cleanup_ok
      - action: assert_greater
        actual: "{{ cleanup_ok }}"
        threshold: "0"

  - name: collect
    always: true
    actions:
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase115-nvme-multivolume-mounted-path-churn-soak"
        name: "remote-phases"
        ignore_error: true
