# Runner-native RF=2 promotion-ready gate.
#
# Goal:
#   Write data through the RF=2 Kubernetes app/PVC path, derive the mounted
#   writer durable frontier from the primary support bundle, and require a
#   non-primary replica to become promotion-ready under sync-quorum before any
#   primary failure is injected. This does not claim recovery.

name: mounted-failover-rf2-promotion-ready-chain
timeout: 24m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: pre_clean
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/pin_build /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo"
      - action: exec
        node: m02
        cmd: "kubectl -n default delete pod sw-block-demo-reader sw-block-demo-writer --ignore-not-found=true --wait=true --timeout=120s >/dev/null 2>&1 || true; kubectl -n default delete pvc sw-block-demo-pvc --ignore-not-found=true --wait=true --timeout=120s >/dev/null 2>&1 || true; kubectl delete sc sw-block-dynamic --ignore-not-found=true >/dev/null 2>&1 || true; pkill -f 'kubectl.*port-forward.*svc/blockmaste[r]' >/dev/null 2>&1 || true"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |^blockmaster |^blockvolume |^blockcsi |^iscsi-target "

  - name: preflight
    actions:
      - action: exec
        node: m02
        cmd: "cd {{ product_root }} && bash scripts/preflight-k8s-alpha.sh --local-k3s > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/preflight.txt 2>&1"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/preflight.txt"
        pattern: "summary status=PASS"
        save_as: preflight_count
      - action: assert_greater
        actual: "{{ preflight_count }}"
        threshold: "0"

  - name: pin_build_alpha_images
    actions:
      - action: exec
        node: m02
        timeout: 8m
        cmd: "cd {{ product_root }} && bash scripts/build-alpha-images.sh {{ product_root }}"
        env.SW_BLOCK_IMPORT_K3S: "1"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/pin_build"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/pin_build/alpha-images.env"
        pattern: "SW_BLOCK_IMAGE_ID="
        save_as: sw_block_image_id_count
      - action: assert_greater
        actual: "{{ sw_block_image_id_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/pin_build/alpha-images.env"
        pattern: "SW_BLOCK_CSI_IMAGE_ID="
        save_as: sw_block_csi_image_id_count
      - action: assert_greater
        actual: "{{ sw_block_csi_image_id_count }}"
        threshold: "0"

  - name: render_rf2_demo_manifest
    actions:
      - action: exec
        node: m02
        cmd: "cd {{ product_root }} && sed 's/replicationFactor: \"1\"/replicationFactor: \"2\"/' deploy/k8s/alpha/demo-app-pvc.yaml > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo/demo-app-rf2.yaml"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo/demo-app-rf2.yaml"
        pattern: "replicationFactor: \"2\""
        save_as: rf2_manifest_count
      - action: assert_greater
        actual: "{{ rf2_manifest_count }}"
        threshold: "0"

  - name: rf2_promotion_ready
    actions:
      - action: exec
        node: m02
        timeout: 14m
        cmd: "cd {{ product_root }} && bash -c 'set -a; source /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/pin_build/alpha-images.env; set +a; set +e; SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo SW_BLOCK_DEMO_APP_MANIFEST=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo/demo-app-rf2.yaml SW_BLOCK_ALPHA_LOGICAL_SERVERS=2 SW_BLOCK_ALPHA_EXPECTED_SLOTS_PER_VOLUME=2 SW_BLOCK_ALPHA_REPLICATION_ACK=sync-quorum SW_BLOCK_LAUNCHER_STATE_HOSTPATH=/var/lib/sw-block/testops-{{ run_id }}-rf2-promotion-ready SW_BLOCK_DEMO_STOP_AFTER=promotion-ready bash scripts/run-k8s-demo.sh {{ product_root }}; rc=$?; echo $rc > /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo/exit_code.txt; test \"$rc\" -eq 47'"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo/run.log"
        pattern: "controlled stop after promotion-ready"
        save_as: promotion_ready_log_count
        ignore_error: true

  - name: promotion_ready_asserts
    actions:
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo/writer.log"
        pattern: "\\[app-writer\\] wrote and verified /data/demo.bin"
        save_as: writer_checksum_count
      - action: assert_greater
        actual: "{{ writer_checksum_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo/promotion-ready.txt"
        pattern: "promotion_ready_status: ready"
        save_as: promotion_ready_count
      - action: assert_greater
        actual: "{{ promotion_ready_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo/promotion-ready.txt"
        pattern: "ack_profile: sync-quorum"
        save_as: sync_quorum_count
      - action: assert_greater
        actual: "{{ sync_quorum_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo/promotion-ready.txt"
        pattern: "candidate_ready=true"
        save_as: candidate_ready_count
      - action: assert_greater
        actual: "{{ candidate_ready_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo/promotion-ready.txt"
        pattern: "candidate_promotion_evidence=promotion: .* candidate_ready=true"
        save_as: candidate_promotion_evidence_count
      - action: assert_greater
        actual: "{{ candidate_promotion_evidence_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo/mounted-writer-required-frontier.txt"
        pattern: "^pvc-.*=[0-9][0-9]*$"
        save_as: mounted_writer_frontier_count
      - action: assert_greater
        actual: "{{ mounted_writer_frontier_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo/ops-inventory-promotion-ready/volume-inventory-summary.txt"
        pattern: "required_frontier_known=true"
        save_as: required_frontier_known_count
      - action: assert_greater
        actual: "{{ required_frontier_known_count }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo/ops-inventory-promotion-ready/volume-inventory-summary.txt"
        pattern: "rf=2 desired=2 observed=2"
        save_as: rf2_count
      - action: assert_greater
        actual: "{{ rf2_count }}"
        threshold: "0"
      - action: exec
        node: m02
        cmd: "! grep -q '/data/demo.bin: OK' /mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/demo/reader.log 2>/dev/null"

  - name: collect_and_cleanup
    always: true
    actions:
      - action: exec
        node: m02
        timeout: 3m
        cmd: "cd {{ product_root }} && bash scripts/uninstall-k8s-alpha.sh {{ product_root }}"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready/uninstall"
        env.SW_BLOCK_UNINSTALL_DELETE_ALL_BLOCKVOLUMES: "1"
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        cmd: "find /var/lib/sw-block -maxdepth 1 -type d -name 'testops-{{ run_id }}-*' -exec rm -rf {} + 2>/dev/null || true; pkill -f 'kubectl.*port-forward.*svc/blockmaste[r]' >/dev/null 2>&1 || true"
      - action: assert_no_active_iscsi_sessions
        node: m02
        iqn_substr: "io.seaweedfs"
      - action: assert_no_processes
        node: m02
        pattern: "[/]blockmaster --|[/]blockvolume --|[/]blockcsi |[/]iscsi-target |[/]kubectl .*port-forward .*svc/blockmaste[r]|^blockmaster |^blockvolume |^blockcsi |^iscsi-target "
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-mounted-failover-rf2-promotion-ready"
        name: "remote-phases"
        ignore_error: true
