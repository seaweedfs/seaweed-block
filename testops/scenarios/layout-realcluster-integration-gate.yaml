# Runner-native real-cluster gate for the content-named layout.
#
# Goal:
#   Run the four real-process tests of the layout cutover as one gated
#   scenario on a Linux host (WSL by default): a clean and a forced move,
#   the lease-owned clean shutdown, the systemd expired-startup / regrant /
#   prestarted-target move, and the catalog restore and delete against
#   SeaweedFS. Each test writes go test -json, and each phase passes only on
#   that test's own "pass" event: a skip (CHUNKSTORE_WEED unset) or a build
#   failure fails the phase.
#
# Expected invocation (on the Linux host, as the user that owns systemd):
#   swblock run \
#     -env product_root=/path/to/seaweed-block \
#     -env weed=/path/to/weed \
#     -env go_bin=/path/to/go1.25/bin \
#     testops/scenarios/layout-realcluster-integration-gate.yaml

name: layout-realcluster-integration-gate
timeout: 60m

env:
  product_root: "/tmp/seaweed-block"
  weed: "/usr/local/bin/weed"
  go_bin: "/usr/local/go/bin"
  out: "/tmp/layout-realcluster"

topology:
  nodes:
    host:
      is_local: true

phases:
  - name: pre_clean
    actions:
      - action: exec
        node: host
        cmd: "rm -rf {{ out }}/{{ run_id }} && mkdir -p {{ out }}/{{ run_id }}"

  - name: pin_build
    actions:
      - action: exec
        node: host
        cmd: "cd {{ product_root }} && git rev-parse HEAD > {{ out }}/{{ run_id }}/git.sha && git status --porcelain > {{ out }}/{{ run_id }}/git.status && {{ go_bin }}/go version > {{ out }}/{{ run_id }}/go.version && sha256sum {{ weed }} > {{ out }}/{{ run_id }}/weed.sha256"

  - name: layout_move
    actions:
      - action: exec
        node: host
        timeout: 15m
        cmd: "cd {{ product_root }}/cmd/blockvolume && PATH={{ go_bin }}:$PATH CHUNKSTORE_WEED={{ weed }} bash -o pipefail -c 'go test -count=1 -json -timeout 14m -tags \"subprocess chunkstore_integration\" -run \"^TestIntegrationWorkspaceLayoutMove$\" . | tee {{ out }}/{{ run_id }}/move.jsonl'"
      - action: grep_log
        node: host
        path: "{{ out }}/{{ run_id }}/move.jsonl"
        pattern: "\"Action\":\"pass\".*\"Test\":\"TestIntegrationWorkspaceLayoutMove\",\"Elapsed\""
        save_as: move_pass
      - action: assert_greater
        actual: "{{ move_pass }}"
        threshold: "0"

  - name: lease_clean_shutdown
    actions:
      - action: exec
        node: host
        timeout: 10m
        cmd: "cd {{ product_root }}/cmd/blockvolume && PATH={{ go_bin }}:$PATH CHUNKSTORE_WEED={{ weed }} bash -o pipefail -c 'go test -count=1 -json -timeout 9m -tags \"subprocess chunkstore_integration\" -run \"^TestBinaryWorkspaceLeaseOptInOwnsCLEANShutdown$\" . | tee {{ out }}/{{ run_id }}/lease.jsonl'"
      - action: grep_log
        node: host
        path: "{{ out }}/{{ run_id }}/lease.jsonl"
        pattern: "\"Action\":\"pass\".*\"Test\":\"TestBinaryWorkspaceLeaseOptInOwnsCLEANShutdown\",\"Elapsed\""
        save_as: lease_pass
      - action: assert_greater
        actual: "{{ lease_pass }}"
        threshold: "0"

  - name: systemd_regrant_and_move
    actions:
      - action: exec
        node: host
        timeout: 15m
        cmd: "cd {{ product_root }}/cmd/blockvolume && PATH={{ go_bin }}:$PATH CHUNKSTORE_WEED={{ weed }} GAP1_SYSTEMD_AUTHORIZED=1 bash -o pipefail -c 'go test -count=1 -json -timeout 14m -tags \"subprocess chunkstore_integration systemd_integration\" -run \"^TestSystemdExpiredStartupExits75ThenRegrantServes$\" . | tee {{ out }}/{{ run_id }}/systemd.jsonl'"
      - action: grep_log
        node: host
        path: "{{ out }}/{{ run_id }}/systemd.jsonl"
        pattern: "\"Action\":\"pass\".*\"Test\":\"TestSystemdExpiredStartupExits75ThenRegrantServes\",\"Elapsed\""
        save_as: systemd_pass
      - action: assert_greater
        actual: "{{ systemd_pass }}"
        threshold: "0"

  - name: catalog_restore_and_delete
    actions:
      - action: exec
        node: host
        timeout: 10m
        cmd: "cd {{ product_root }}/core/frontend/chunkstore && PATH={{ go_bin }}:$PATH CHUNKSTORE_WEED={{ weed }} bash -o pipefail -c 'go test -count=1 -json -timeout 9m -tags chunkstore_integration -run \"^TestIntegration_CatalogRestoreAndDelete$\" . | tee {{ out }}/{{ run_id }}/catalog.jsonl'"
      - action: grep_log
        node: host
        path: "{{ out }}/{{ run_id }}/catalog.jsonl"
        pattern: "\"Action\":\"pass\".*\"Test\":\"TestIntegration_CatalogRestoreAndDelete\",\"Elapsed\""
        save_as: catalog_pass
      - action: assert_greater
        actual: "{{ catalog_pass }}"
        threshold: "0"

  - name: final_asserts
    actions:
      # only the processes these tests start (their chunk paths): the host may
      # run other people's volumes
      - action: assert_no_processes
        node: host
        pattern: "blockvolume .*--chunk-path /(workspace-move|workspace-lease|gap1)-"

  - name: collect
    always: true
    actions:
      - action: collect_path
        node: host
        path: "{{ out }}/{{ run_id }}"
        name: "go-test-json"
        ignore_error: true
