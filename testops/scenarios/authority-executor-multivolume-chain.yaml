# Runner-native Phase 54 D6 gate: authority-executor multi-volume isolation.

name: authority-executor-multivolume-chain
timeout: 10m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: authority_executor_multivolume_gate
    actions:
      - action: exec
        node: m02
        timeout: 9m
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume && cd {{ product_root }} && SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume bash scripts/run-phase54-authority-executor-multivolume-gate.sh {{ product_root }}"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume/phase54-authority-executor-multivolume-summary.txt"
        pattern: "^phase54_authority_executor_multivolume_status=ok$"
        save_as: phase54_multivolume_ok
      - action: assert_greater
        actual: "{{ phase54_multivolume_ok }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume/phase54-authority-executor-multivolume-summary.txt"
        pattern: "^multivolume_contracts=4$"
        save_as: multivolume_contracts
      - action: assert_greater
        actual: "{{ multivolume_contracts }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume/phase54-authority-executor-multivolume-summary.txt"
        pattern: "^multivolume_mutation_attempts=2$"
        save_as: multivolume_two_mutations
      - action: assert_greater
        actual: "{{ multivolume_two_mutations }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume/phase54-authority-executor-multivolume-summary.txt"
        pattern: "^multivolume_ack_mutation_attempts=2$"
        save_as: multivolume_two_ack_mutations
      - action: assert_greater
        actual: "{{ multivolume_two_ack_mutations }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume/phase54-authority-executor-multivolume-summary.txt"
        pattern: "^multivolume_terminal_missing=1$"
        save_as: multivolume_one_terminal_missing
      - action: assert_greater
        actual: "{{ multivolume_one_terminal_missing }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume/phase54-authority-executor-multivolume-summary.txt"
        pattern: "^multivolume_target_missing=1$"
        save_as: multivolume_one_target_missing
      - action: assert_greater
        actual: "{{ multivolume_one_target_missing }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume/phase54-authority-executor-multivolume-summary.txt"
        pattern: "^eligible_a_reason=ack_eligibility_recorded$"
        save_as: eligible_a_written
      - action: assert_greater
        actual: "{{ eligible_a_written }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume/phase54-authority-executor-multivolume-summary.txt"
        pattern: "^eligible_b_reason=ack_eligibility_recorded$"
        save_as: eligible_b_written
      - action: assert_greater
        actual: "{{ eligible_b_written }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume/phase54-authority-executor-multivolume-summary.txt"
        pattern: "^blocked_c_reason_absent=$"
        save_as: blocked_c_held
      - action: assert_greater
        actual: "{{ blocked_c_held }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume/phase54-authority-executor-multivolume-summary.txt"
        pattern: "^mismatch_e_reason_absent=$"
        save_as: mismatch_e_held
      - action: assert_greater
        actual: "{{ mismatch_e_held }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume/phase54-authority-executor-multivolume-summary.txt"
        pattern: "^no_contract_d_target_count=0$"
        save_as: no_contract_d_no_target
      - action: assert_greater
        actual: "{{ no_contract_d_no_target }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume/phase54-authority-executor-multivolume-summary.txt"
        pattern: "^eligible_written_count=2$"
        save_as: exactly_two_written
      - action: assert_greater
        actual: "{{ exactly_two_written }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume/phase54-authority-executor-multivolume-summary.txt"
        pattern: "^cross_contamination_count=0$"
        save_as: no_cross_contamination
      - action: assert_greater
        actual: "{{ no_cross_contamination }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume/phase54-authority-executor-multivolume-summary.txt"
        pattern: "^exec_patch_swblockvolumes_status_denied=no$"
        save_as: boundary_volume_status_denied
      - action: assert_greater
        actual: "{{ boundary_volume_status_denied }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume/phase54-authority-executor-multivolume-summary.txt"
        pattern: "^exec_create_events_denied=no$"
        save_as: boundary_events_denied
      - action: assert_greater
        actual: "{{ boundary_events_denied }}"
        threshold: "0"

  - name: collect
    always: true
    actions:
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-multivolume"
        name: "remote-phases"
        ignore_error: true
