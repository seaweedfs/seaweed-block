# Runner-native Phase 54 D3 gate: authority-executor ACK target RBAC boundary.

name: authority-executor-target-rbac-chain
timeout: 5m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: authority_executor_target_rbac_gate
    actions:
      - action: exec
        node: m02
        timeout: 4m
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-target-rbac && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-target-rbac && cd {{ product_root }} && SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-target-rbac bash scripts/run-phase54-authority-executor-target-rbac-gate.sh {{ product_root }}"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-target-rbac/phase54-authority-executor-target-rbac-summary.txt"
        pattern: "^phase54_authority_executor_target_rbac_status=ok$"
        save_as: phase54_rbac_ok
      - action: assert_greater
        actual: "{{ phase54_rbac_ok }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-target-rbac/phase54-authority-executor-target-rbac-summary.txt"
        pattern: "^default_patch_swblockreplicaeligibilities_status_denied=no$"
        save_as: default_target_status_denied
      - action: assert_greater
        actual: "{{ default_target_status_denied }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-target-rbac/phase54-authority-executor-target-rbac-summary.txt"
        pattern: "^exec_patch_swblockreplicaeligibilities_status_allowed=yes$"
        save_as: exec_target_status_allowed
      - action: assert_greater
        actual: "{{ exec_target_status_allowed }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-target-rbac/phase54-authority-executor-target-rbac-summary.txt"
        pattern: "^exec_patch_swblockreplicaeligibilities_main_denied=no$"
        save_as: exec_target_main_denied
      - action: assert_greater
        actual: "{{ exec_target_main_denied }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-target-rbac/phase54-authority-executor-target-rbac-summary.txt"
        pattern: "^exec_patch_swblockvolumes_status_denied=no$"
        save_as: exec_swblockvolume_status_denied
      - action: assert_greater
        actual: "{{ exec_swblockvolume_status_denied }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-target-rbac/phase54-authority-executor-target-rbac-summary.txt"
        pattern: "^exec_create_events_denied=no$"
        save_as: exec_events_denied
      - action: assert_greater
        actual: "{{ exec_events_denied }}"
        threshold: "0"

  - name: collect
    always: true
    actions:
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase54-authority-executor-target-rbac"
        name: "remote-phases"
        ignore_error: true
