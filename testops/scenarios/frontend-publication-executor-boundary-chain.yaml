# Runner-native Phase 70 gate: frontend publication executor status boundary.

name: frontend-publication-executor-boundary-chain
timeout: 8m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: frontend_publication_executor_boundary_gate
    actions:
      - action: exec
        node: m02
        timeout: 7m
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase70-frontend-publication-executor-boundary && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase70-frontend-publication-executor-boundary && cd {{ product_root }} && SW_BLOCK_ARTIFACT_DIR=/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase70-frontend-publication-executor-boundary bash scripts/run-phase70-frontend-publication-executor-boundary-gate.sh {{ product_root }}"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase70-frontend-publication-executor-boundary/phase70-frontend-publication-executor-boundary-summary.txt"
        pattern: "^phase70_frontend_publication_executor_boundary_status=ok$"
        save_as: phase70_ok
      - action: assert_greater
        actual: "{{ phase70_ok }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase70-frontend-publication-executor-boundary/phase70-frontend-publication-executor-boundary-summary.txt"
        pattern: "^frontend_publication_executor_status_writes=true$"
        save_as: status_writes
      - action: assert_greater
        actual: "{{ status_writes }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase70-frontend-publication-executor-boundary/phase70-frontend-publication-executor-boundary-summary.txt"
        pattern: "^frontend_publication_executor_status=blocked$"
        save_as: status_blocked
      - action: assert_greater
        actual: "{{ status_blocked }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase70-frontend-publication-executor-boundary/phase70-frontend-publication-executor-boundary-summary.txt"
        pattern: "^frontend_publication_executor_reason=frontend_publication_policy_disabled$"
        save_as: reason_disabled
      - action: assert_greater
        actual: "{{ reason_disabled }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase70-frontend-publication-executor-boundary/phase70-frontend-publication-executor-boundary-summary.txt"
        pattern: "^frontend_publication_attempts=0$"
        save_as: no_frontend_attempts
      - action: assert_greater
        actual: "{{ no_frontend_attempts }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase70-frontend-publication-executor-boundary/phase70-frontend-publication-executor-boundary-summary.txt"
        pattern: "^frontend_published=false$"
        save_as: no_frontend_published
      - action: assert_greater
        actual: "{{ no_frontend_published }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase70-frontend-publication-executor-boundary/phase70-frontend-publication-executor-boundary-summary.txt"
        pattern: "^failback_started=false$"
        save_as: no_failback_started
      - action: assert_greater
        actual: "{{ no_failback_started }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase70-frontend-publication-executor-boundary/phase70-frontend-publication-executor-boundary-summary.txt"
        pattern: "^storage_mutation_allowed=false$"
        save_as: no_storage_mutation
      - action: assert_greater
        actual: "{{ no_storage_mutation }}"
        threshold: "0"

  - name: collect
    always: true
    actions:
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase70-frontend-publication-executor-boundary"
        name: "remote-phases"
        ignore_error: true
