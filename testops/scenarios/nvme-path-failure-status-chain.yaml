name: nvme-path-failure-status-chain
timeout: 30m

env:
  product_root: "/tmp/seaweed_block"
  ssh_key: "C:\\work\\dev_server\\testdev_key"

topology:
  nodes:
    m02:
      host: 192.168.1.184
      user: testdev
      key: "{{ ssh_key }}"

phases:
  - name: pre_clean
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: exec
        node: m02
        cmd: "rm -rf /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-path-failure && mkdir -p /mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-path-failure"

  - name: nvme_path_failure_status
    actions:
      - action: exec
        node: m02
        timeout: 20m
        cmd: "cd {{ product_root }} && bash scripts/run-nvme-mounted-failover-smoke.sh {{ product_root }}"
        env.SW_BLOCK_ARTIFACT_DIR: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-path-failure/gate"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-path-failure/gate/phase101-nvme-path-failure-summary.txt"
        pattern: "^phase101_nvme_path_failure_status=ok$"
        save_as: d2_ok
      - action: assert_greater
        actual: "{{ d2_ok }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-path-failure/gate/phase101-nvme-path-failure-summary.txt"
        pattern: "^before_path_count=2$"
        save_as: before_two_paths
      - action: assert_greater
        actual: "{{ before_two_paths }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-path-failure/gate/phase101-nvme-path-failure-summary.txt"
        pattern: "^after_path_count=1$"
        save_as: after_one_path
      - action: assert_greater
        actual: "{{ after_one_path }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-path-failure/gate/phase101-nvme-path-failure-summary.txt"
        pattern: "^after_nvme_reason=nvme_multipath_path_missing$"
        save_as: missing_path_reason
      - action: assert_greater
        actual: "{{ missing_path_reason }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-path-failure/gate/phase101-nvme-path-failure-summary.txt"
        pattern: "^after_ready_true=false$"
        save_as: no_false_ready
      - action: assert_greater
        actual: "{{ no_false_ready }}"
        threshold: "0"
      - action: grep_log
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-path-failure/gate/phase101-nvme-path-failure-summary.txt"
        pattern: "^final_nvme_residue_count=0$"
        save_as: nvme_clean
      - action: assert_greater
        actual: "{{ nvme_clean }}"
        threshold: "0"

  - name: collect_and_cleanup
    always: true
    actions:
      - action: pre_run_cleanup
        node: m02
        kill_patterns: "blockmaster,blockvolume,blockcsi,iscsi-target"
        nvme_disconnect: "true"
        iscsi_logout_prefix: "iqn.2026-05.io.seaweedfs"
      - action: collect_path
        node: m02
        path: "/mnt/smb/work/share/g15d-k8s/{{ run_id }}-phase101-nvme-path-failure"
        name: "remote-phases"
        ignore_error: true
